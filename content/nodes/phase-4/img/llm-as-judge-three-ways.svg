0" height="30" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="375" y="81" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">answer B</text><line x1="432" y1="41" x2="452" y2="55" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="432" y1="81" x2="452" y2="67" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="454" y="43" width="58" height="34" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="483" y="60" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">judge</text><line x1="512" y1="60" x2="526" y2="60" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="528" y="45" width="78" height="30" rx="6" class="s-orange" fill="none" stroke-width="1.5"/><text x="567" y="60" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">A, B or tie</text><text x="320" y="128" font-size="12.5" class="t-ink" xml:space="preserve">Subjective qualities, like tone, when</text><text x="320" y="144.88" font-size="12.5" class="t-ink" xml:space="preserve">comparing two versions. Run both orders.</text><text x="620" y="8" font-size="14.5" font-weight="700" class="t-green" xml:space="preserve">Reference-guided</text><rect x="620" y="26" width="110" height="30" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="675" y="41" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">answer</text><rect x="620" y="66" width="110" height="30" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="675" y="81" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">reference</text><line x1="732" y1="41" x2="752" y2="55" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="732" y1="81" x2="752" y2="67" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="754" y="43" width="58" height="34" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="783" y="60" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">judge</text><line x1="812" y1="60" x2="826" y2="60" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="828" y="45" width="78" height="30" rx="6" class="s-green" fill="none" stroke-width="1.5"/><text x="867" y="60" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">pass / fail</text><text x="620" y="128" font-size="12.5" class="t-ink" xml:space="preserve">When a correct answer exists, like math, so</text><text x="620" y="144.88" font-size="12.5" class="t-ink" xml:space="preserve">the judge isn't misled by the answer.</text><line x1="20" y1="112" x2="900" y2="112" class="grid" stroke-width="1"/></g>
<text x="24" y="235" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Shapes from Zheng et al. (2023). When each fits, from Yan (2024) and Zheng et al.</text>
