<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 920 246" width="920" height="246" role="img" aria-labelledby="fig-1kw2851-t fig-1kw2851-d">
<title id="fig-1kw2851-t">Three ways to ask a judge, and when each fits</title>
<desc id="fig-1kw2851-d">Three ways to ask a judge. Single output: the judge sees one answer and a rubric, and returns pass or fail (or a score). Pairwise: the judge sees two answers to the same input and picks the better one or calls a tie; run it twice with the order swapped. Reference-guided: the judge sees one answer next to a known-good reference answer and checks it against that. Below, when each fits: single output for objective checks like faithfulness or a policy rule, pairwise for subjective qualities like tone when comparing two versions, reference-guided when a correct answer exists, such as math.</desc>
<style>
