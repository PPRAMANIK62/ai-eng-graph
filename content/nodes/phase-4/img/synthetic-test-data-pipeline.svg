ne="central" class="t-ink" xml:space="preserve">Queries</text><line x1="676" y1="126" x2="692" y2="126" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="696" y="8" width="200" height="236" rx="10" class="s-green" fill="none" stroke-width="1.5"/><rect x="696" y="8" width="200" height="40" rx="10" class="fs-green s-green" stroke-width="1.5"/><rect x="696.75" y="38" width="198.5" height="10" rx="0" class="fs-green"/><line x1="696" y1="48" x2="896" y2="48" class="s-green" stroke-width="1.5"/><text x="710" y="28" font-size="15" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">4</text><text x="728" y="28" font-size="14" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Traces</text><text x="38" y="70" font-size="13" font-weight="600" class="t-ink" xml:space="preserve">Dietary restriction</text><text x="38" y="88" font-size="12" class="t-muted" xml:space="preserve">vegan · gluten-free · none</text><text x="38" y="124" font-size="13" font-weight="600" class="t-ink" xml:space="preserve">Cuisine</text><text x="38" y="142" font-size="12" class="t-muted" xml:space="preserve">Italian · Asian · comfort</text><text x="38" y="157" font-size="12" class="t-muted" xml:space="preserve">food</text><text x="38" y="178" font-size="13" font-weight="600" class="t-ink" xml:space="preserve">Complexity</text><text x="38" y="196" font-size="12" class="t-muted" xml:space="preserve">simple request · multi-step</text><text x="38" y="211" font-size="12" class="t-muted" xml:space="preserve">· edge case</text><rect x="258" y="60" width="180" height="26" rx="4" class="fs-purple"/><text x="266" y="73" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">(vegan, Italian, multi-step)</text><rect x="258" y="92" width="180" height="26" rx="4" class="fs-purple"/><text x="266" y="105" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">(gluten-free, Asian, simple)</text><text x="348" y="137" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">…</text><text x="262" y="170" font-size="12.5" class="t-muted" xml:space="preserve">One value per dimension.</text><text x="262" y="187" font-size="12.5" class="t-muted" xml:space="preserve">Write the first 20 by</text><text x="262" y="204" font-size="12.5" class="t-muted" xml:space="preserve">hand, then let a model</text><text x="262" y="221" font-size="12.5" class="t-muted" xml:space="preserve">make more.</text><rect x="482" y="60" width="180" height="70" rx="4" class="fs-orange"/><text x="490" y="76" font-size="12.5" font-style="italic" class="t-ink" xml:space="preserve">“I need a dairy-free</text><text x="490" y="93" font-size="12.5" font-style="italic" class="t-ink" xml:space="preserve">lasagna recipe that I can</text><text x="490" y="110" font-size="12.5" font-style="italic" class="t-ink" xml:space="preserve">prep the day before.”</text><text x="486" y="170" font-size="12.5" class="t-muted" xml:space="preserve">Each tuple becomes a</text><text x="486" y="187" font-size="12.5" class="t-muted" xml:space="preserve">message in a separate</text><text x="486" y="204" font-size="12.5" class="t-muted" xml:space="preserve">prompt, so they don’t</text><text x="486" y="221" font-size="12.5" class="t-muted" xml:space="preserve">all sound the same.</text><text x="710" y="74" font-size="13" class="t-ink" xml:space="preserve">Run every query through</text><text x="710" y="93" font-size="13" class="t-ink" xml:space="preserve">the full system. Read</text><text x="710" y="112" font-size="13" class="t-ink" xml:space="preserve">the traces: about 100</text><text x="710" y="131" font-size="13" class="t-ink" xml:space="preserve">is a good first pool for</text><text x="710" y="150" font-size="13" class="t-ink" xml:space="preserve">error analysis.</text><text x="710" y="188" font-size="12.5" class="t-muted" xml:space="preserve">The model writes the</text><text x="710" y="205" font-size="12.5" class="t-muted" xml:space="preserve">inputs only, never the</text><text x="710" y="222" font-size="12.5" class="t-muted" xml:space="preserve">expected answers.</text></g>
<text x="24" y="315" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Example from Husain and Shankar, AI Evals FAQ (2025).</text>
