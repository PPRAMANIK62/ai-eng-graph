<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 920 326" width="920" height="326" role="img" aria-labelledby="fig-1oqrk3u-t fig-1oqrk3u-d">
<title id="fig-1oqrk3u-t">Synthetic test inputs: plan the variety, then generate</title>
<desc id="fig-1oqrk3u-d">Synthetic test inputs in four steps, with the recipe-app example. 1: Dimensions, such as dietary restriction (vegan, gluten-free, none), cuisine (Italian, Asian, comfort food) and complexity (simple request, multi-step, edge case). 2: Tuples, one value per dimension, the first 20 by hand: (vegan, Italian, multi-step). 3: Queries, each tuple turned into natural language in a separate prompt: &quot;I need a dairy-free lasagna recipe that I can prep the day before.&quot; 4: Run every query through the full system and read the traces. The model writes only the inputs, never the expected answers.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
