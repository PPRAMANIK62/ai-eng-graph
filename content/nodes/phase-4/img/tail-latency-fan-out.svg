<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 820 446" width="820" height="446" role="img" aria-labelledby="fig-1fojz6s-t fig-1fojz6s-d">
<title id="fig-1fojz6s-t">One slow call in a hundred becomes most requests when you wait on many</title>
<desc id="fig-1fojz6s-d">A chart of how often a user request hits at least one slow call, against how many calls it waits on, from 1 to 2,000 on a log scale. Two curves: calls that are slow 1 time in 100, and 1 time in 10,000. With 1 in 100, one call is slow 1% of the time, 10 calls about 10%, and 100 calls 63%. With 1 in 10,000, 2,000 calls are slow almost one time in five.</desc>
