<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 748 282" width="748" height="282" role="img" aria-labelledby="fig-1q44efw-t fig-1q44efw-d">
<title id="fig-1q44efw-t">How far behind are open models? Three answers</title>
<desc id="fig-1q44efw-d">Three measurements of the gap between the best open-weight and best closed models. Epoch AI, January to May 2026, capabilities index built from public benchmarks: about 4 months behind, or 6 months with a stricter test, 8 index points. Artificial Analysis, April 2026, its own Intelligence Index: 6 points behind (54 vs 60), down from 13 points a year earlier (22 vs 35). Menlo Ventures, mid-2025, in a report built on a survey of 150 tech leaders: 9 to 12 months, stated without a method.</desc>
