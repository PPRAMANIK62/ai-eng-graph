<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 700 288" width="700" height="288" role="img" aria-labelledby="fig-1j2l51-t fig-1j2l51-d">
<title id="fig-1j2l51-t">People miss more factual errors when the answer sounds sure</title>
<desc id="fig-1j2l51-d">Bar chart of how many factual errors crowdworkers missed compared with careful annotation, as the difference in error rates. When the model answered cautiously, crowdworkers found 5.3 points fewer factual errors. At the baseline, 16.2 points fewer. When it answered assertively, 22.3 points fewer. The more confident the answer, the more errors slipped past.</desc>
