<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 870 364" width="870" height="364" role="img" aria-labelledby="fig-1u28pj5-t fig-1u28pj5-d">
<title id="fig-1u28pj5-t">Where the time goes in one model call</title>
<desc id="fig-1u28pj5-d">One model call as a row of stages, not to scale. Network out and waiting in the provider's queue, then prefill of the whole prompt, then, for reasoning models only, thinking tokens, then the answer tokens one at a time, then the last bytes back. Brackets above: time to first token covers network, queue and prefill. For a reasoning model, time to first answer token runs on through the thinking. End-to-end time covers everything. Under each stage, what makes it longer: distance and region, how busy the server is, prompt length, how much the model thinks, and answer length.</desc>
