<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 744 312" width="744" height="312" role="img" aria-labelledby="fig-1rttuvs-t fig-1rttuvs-d">
<title id="fig-1rttuvs-t">Choosing a model: shortlist, then decide on your own evals</title>
<desc id="fig-1rttuvs-d">The model selection loop. Step 1, shortlist: use public benchmarks to rule out models that are weak at your kind of task. Step 2, pick a starting point: either the cheapest model that might work, or the strongest one. Step 3, run your own eval set on each candidate. Step 4, check it against your quality bar. Step 5, work out cost per task and measure latency on your real prompts. Then keep the lightest model and setting that passes. When a new model comes out, run the loop again.</desc>
