<g transform="translate(0 44)"><rect x="20" y="20" width="170" height="78" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="105" y="42" font-size="14" text-anchor="middle" font-weight="700" class="t-blue" xml:space="preserve">1. Shortlist</text><text x="105" y="64" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">benchmarks rule</text><text x="105" y="82" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">weak models out</text><rect x="234" y="20" width="170" height="78" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="319" y="42" font-size="14" text-anchor="middle" font-weight="700" class="t-blue" xml:space="preserve">2. Start point</text><text x="319" y="64" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">cheapest that might</text><text x="319" y="82" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">work, or strongest</text><rect x="448" y="20" width="170" height="78" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="533" y="42" font-size="14" text-anchor="middle" font-weight="700" class="t-orange" xml:space="preserve">3. Your evals</text><text x="533" y="64" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">real inputs,</text><text x="533" y="82" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">same questions</text><rect x="20" y="150" width="170" height="78" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="105" y="172" font-size="14" text-anchor="middle" font-weight="700" class="t-blue" xml:space="preserve">4. Quality bar</text><text x="105" y="194" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">pass or fail</text><text x="105" y="212" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">vs your target</text><rect x="234" y="150" width="170" height="78" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="319" y="172" font-size="14" text-anchor="middle" font-weight="700" class="t-blue" xml:space="preserve">5. Cost, latency</text><text x="319" y="194" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">cost per task, time</text><text x="319" y="212" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">on your prompts</text><line x1="193" y1="59" x2="231" y2="59" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="407" y1="59" x2="445" y2="59" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><path d="M533,100 L533,122 L105,122 L105,147" class="s-muted" stroke-width="1.5" fill="none" marker-end="url(#ah-muted)"/><line x1="193" y1="189" x2="231" y2="189" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="407" y1="189" x2="445" y2="189" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="448" y="150" width="170" height="78" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="533" y="180.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">keep the lightest</text><text x="533" y="197.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">setting that passes</text><path d="M620,189 L644,189 L644,59 L621,59" class="s-orange" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/><text x="654" y="106" font-size="12" class="t-orange" xml:space="preserve">new model</text><text x="654" y="123" font-size="12" class="t-orange" xml:space="preserve">or setting?</text><text x="654" y="140" font-size="12" class="t-orange" xml:space="preserve">same evals</text></g>
