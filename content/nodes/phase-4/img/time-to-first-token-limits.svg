<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 288" width="900" height="288" role="img" aria-labelledby="fig-19knd8y-t fig-19knd8y-d">
<title id="fig-19knd8y-t">How long a wait people notice, and when they switch tasks</title>
<desc id="fig-19knd8y-d">A time axis on a log scale from 0.05 to 30 seconds with three limits marked. Under 0.1 second, the system feels instant. Under 1 second, the user's flow of thought stays unbroken, though the delay is noticed. Under 10 seconds, the user's attention stays on the task. Past 10 seconds, people turn to other tasks, so show progress. With streaming, the user's wait ends at the first token, so time to first token is the number to hold against these limits.</desc>
