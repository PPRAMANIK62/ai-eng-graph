<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 730 264" width="730" height="264" role="img" aria-labelledby="fig-lunn93-t fig-lunn93-d">
<title id="fig-lunn93-t">Testing for contamination with a fresh look-alike test</title>
<desc id="fig-lunn93-d">How GSM1k tests for contamination. A model is scored on the public GSM8k benchmark and on GSM1k, a fresh set of 1,000 problems matched to GSM8k in style and difficulty that can't be in the training data. If the model learned the skill, the two scores match. If it memorized GSM8k, it scores lower on GSM1k. Some model families dropped by up to 8%, and the models most likely to generate GSM8k problems had the biggest drops (Spearman r² = 0.36). Frontier models showed little drop.</desc>
