<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 670 244" width="670" height="244" role="img" aria-labelledby="fig-5cqgl5-t fig-5cqgl5-d">
<title id="fig-5cqgl5-t">On 100 questions, a 4-point gap sits inside the noise</title>
<desc id="fig-5cqgl5-d">Two models scored on the same 100 pass/fail questions, as dots with 95% confidence intervals. Model A scores 82% (interval about 74% to 90%) and model B 78% (about 70% to 86%). The intervals overlap heavily, so the 4-point gap is weak evidence on its own. Worked example, not measured data.</desc>
