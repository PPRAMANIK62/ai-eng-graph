<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 870 342" width="870" height="342" role="img" aria-labelledby="fig-17cqhjb-t fig-17cqhjb-d">
<title id="fig-17cqhjb-t">Code checks on one output: fast, cheap, and the same every time</title>
<desc id="fig-17cqhjb-d">One support reply going through five code checks. The output: tag &quot;billing&quot; and a four-sentence reply that mentions the refund policy but also contains the internal ID TCK-88213. Checks: tag equals the expected label, pass. Contains &quot;refund policy&quot;, pass. Contains no internal ID, fail. Two to six sentences, pass. Valid JSON with the right fields, pass. Each check is a few lines of code, returns pass or fail, and gives the same answer every time.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
