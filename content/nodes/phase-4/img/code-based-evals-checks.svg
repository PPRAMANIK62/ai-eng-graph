<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="870" height="342"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Code checks on one output: fast, cheap, and the same every time</text>
<g transform="translate(0 44)"><text x="20" y="8" font-size="14" font-weight="700" class="t-blue" xml:space="preserve">The output</text><rect x="20" y="22" width="270" height="214" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="32" y="46" font-size="12.5" class="t-ink mono" xml:space="preserve">{</text><text x="32" y="69" font-size="12.5" class="t-ink mono" xml:space="preserve">  &quot;tag&quot;: &quot;billing&quot;,</text><text x="32" y="92" font-size="12.5" class="t-ink mono" xml:space="preserve">  &quot;reply&quot;: &quot;Sorry about the double</text><text x="32" y="115" font-size="12.5" class="t-ink mono" xml:space="preserve">   charge. Under our refund policy</text><text x="32" y="138" font-size="12.5" class="t-ink mono" xml:space="preserve">   you'll get the money back in 5</text><text x="32" y="161" font-size="12.5" class="t-red mono" xml:space="preserve">   days. Your case is TCK-88213.</text><text x="32" y="184" font-size="12.5" class="t-ink mono" xml:space="preserve">   Anything else I can help with?&quot;</text><text x="32" y="207" font-size="12.5" class="t-ink mono" xml:space="preserve">}</text><text x="340" y="8" font-size="14" font-weight="700" class="t-ink" xml:space="preserve">Five checks, each a few lines of code</text><line x1="292" y1="129" x2="336" y2="40" class="grid" stroke-width="1" marker-end="url(#ah-grey)"/><rect x="340" y="22" width="420" height="36" rx="6" class="s-grey" fill="none" stroke-width="1"/><text x="352" y="36" font-size="13" font-weight="600" class="t-ink" xml:space="preserve">Tag is the expected label</text><text x="352" y="51" font-size="11.5" class="t-muted mono" xml:space="preserve">tag.strip().lower() == &quot;billing&quot;</text><rect x="770" y="26" width="64" height="28" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="802" y="40" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">pass</text><line x1="292" y1="129" x2="336" y2="84" class="grid" stroke-width="1" marker-end="url(#ah-grey)"/><rect x="340" y="66" width="420" height="36" rx="6" class="s-grey" fill="none" stroke-width="1"/><text x="352" y="80" font-size="13" font-weight="600" class="t-ink" xml:space="preserve">Mentions the refund policy</text><text x="352" y="95" font-size="11.5" class="t-muted mono" xml:space="preserve">&quot;refund policy&quot; in reply</text><rect x="770" y="70" width="64" height="28" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="802" y="84" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">pass</text><line x1="292" y1="129" x2="336" y2="128" class="grid" stroke-width="1" marker-end="url(#ah-grey)"/><rect x="340" y="110" width="420" height="36" rx="6" class="s-grey" fill="none" stroke-width="1"/><text x="352" y="124" font-size="13" font-weight="600" class="t-ink" xml:space="preserve">No internal ticket IDs</text><text x="352" y="139" font-size="11.5" class="t-muted mono" xml:space="preserve">not re.search(r&quot;TCK-\d+&quot;, reply)</text><rect x="770" y="114" width="64" height="28" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="802" y="128" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">fail</text><line x1="292" y1="129" x2="336" y2="172" class="grid" stroke-width="1" marker-end="url(#ah-grey)"/><rect x="340" y="154" width="420" height="36" rx="6" class="s-grey" fill="none" stroke-width="1"/><text x="352" y="168" font-size="13" font-weight="600" class="t-ink" xml:space="preserve">Two to six sentences</text><text x="352" y="183" font-size="11.5" class="t-muted mono" xml:space="preserve">2 &lt;= count_sentences(reply) &lt;= 6</text><rect x="770" y="158" width="64" height="28" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="802" y="172" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">pass</text><line x1="292" y1="129" x2="336" y2="216" class="grid" stroke-width="1" marker-end="url(#ah-grey)"/><rect x="340" y="198" width="420" height="36" rx="6" class="s-grey" fill="none" stroke-width="1"/><text x="352" y="212" font-size="13" font-weight="600" class="t-ink" xml:space="preserve">Valid JSON, right fields</text><text x="352" y="227" font-size="11.5" class="t-muted mono" xml:space="preserve">json.loads(out) has tag, reply</text><rect x="770" y="202" width="64" height="28" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="802" y="216" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">pass</text><text x="340" y="256" font-size="12.5" class="t-muted" xml:space="preserve">Same input, same verdict, every run. One failure is enough to fail the case.</text></g>
<text x="24" y="331" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Illustrative example. Kinds of check from Anthropic's eval docs and Yan et al. (2024).</text>
</svg>
