<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 660 520" width="660" height="520" role="img" aria-labelledby="fig-1ajfxje-t fig-1ajfxje-d">
<title id="fig-1ajfxje-t">Same open model, different hosts: tool calls matching the schema</title>
<desc id="fig-1ajfxje-d">Horizontal bar chart of tool-call schema accuracy for the same open model, Kimi K2 0905, served by different providers, on 4,000 requests (test date 2025-11-15). Moonshot's own API, Moonshot AI Turbo, DeepInfra, Fireworks, Infinigence, NovitaAI and Groq 100%, SiliconFlow 99.8%, Chutes 96.7%, Nebius 84.5%, vLLM 76.0%, SGLang 73.1%, Volc 72.9%, Baseten 72.5%, AtlasCloud 72.4%, Together 72.0%.</desc>
