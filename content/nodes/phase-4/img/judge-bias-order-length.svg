<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 390" width="900" height="390" role="img" aria-labelledby="fig-1p06vhg-t fig-1p06vhg-d">
<title id="fig-1p06vhg-t">Same answers, different verdicts: order and length move an LLM judge</title>
<desc id="fig-1p06vhg-d">Two bar charts of the same answers judged differently. Left, position: Vicuna-13B's win rate against ChatGPT depends on where its answer appears. With GPT-4 judging, 51.3% when shown first and 23.8% when shown second. With ChatGPT judging, 2.5% when first and 82.5% when second. Right, length: the same GPT-4 Turbo model judged against its own answers on AlpacaEval scores a 22.9% win rate when prompted to be concise and 64.3% when prompted to be verbose. With length control the spread shrinks to 41.9% to 51.6%.</desc>
