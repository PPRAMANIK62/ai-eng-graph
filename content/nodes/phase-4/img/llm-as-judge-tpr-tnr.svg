<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 940 354" width="940" height="354" role="img" aria-labelledby="fig-jntmiu-t fig-jntmiu-d">
<title id="fig-jntmiu-t">Measure a judge with two rates, not one agreement number</title>
<desc id="fig-jntmiu-d">Why a judge needs two numbers, not one. Left, a judge checked against 110 expert labels: of 10 real failures it catches 8 (true positive rate 80%), and of 100 good outputs it passes 95 (true negative rate 95%). Right, a judge that always says pass, on a set where 5% of outputs fail: its agreement with the expert is 95%, yet it catches none of the failures (true positive rate 0%). Raw agreement looks high whenever failures are rare.</desc>
