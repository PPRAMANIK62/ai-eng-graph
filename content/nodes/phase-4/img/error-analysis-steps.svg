.fig .f-muted{fill:var(--muted)}.fig .s-muted{stroke:var(--muted)}.fig .fs-muted{fill:var(--muted-soft)}.fig .t-muted{fill:var(--muted)}
.fig .f-blue{fill:var(--blue)}.fig .s-blue{stroke:var(--blue)}.fig .fs-blue{fill:var(--blue-soft)}.fig .t-blue{fill:var(--blue)}
.fig .f-orange{fill:var(--orange)}.fig .s-orange{stroke:var(--orange)}.fig .fs-orange{fill:var(--orange-soft)}.fig .t-orange{fill:var(--orange)}
.fig .f-green{fill:var(--green)}.fig .s-green{stroke:var(--green)}.fig .fs-green{fill:var(--green-soft)}.fig .t-green{fill:var(--green)}
.fig .f-red{fill:var(--red)}.fig .s-red{stroke:var(--red)}.fig .fs-red{fill:var(--red-soft)}.fig .t-red{fill:var(--red)}
.fig .f-purple{fill:var(--purple)}.fig .s-purple{stroke:var(--purple)}.fig .fs-purple{fill:var(--purple-soft)}.fig .t-purple{fill:var(--purple)}
.fig .f-grey{fill:var(--grey)}.fig .s-grey{stroke:var(--grey)}.fig .fs-grey{fill:var(--grey-soft)}.fig .t-grey{fill:var(--grey)}
</style>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="910" height="366"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Error analysis: read, note, group, count</text>
<g transform="translate(0 44)"><rect x="24" y="8" width="196" height="232" rx="10" class="s-blue" fill="none" stroke-width="1.5"/><rect x="24" y="8" width="196" height="40" rx="10" class="fs-blue s-blue" stroke-width="1.5"/><rect x="24.75" y="38" width="194.5" height="10" rx="0" class="fs-blue"/><line x1="24" y1="48" x2="220" y2="48" class="s-blue" stroke-width="1.5"/><text x="38" y="28" font-size="15" font-weight="700" dominant-baseline="central" class="t-blue" xml:space="preserve">1</text><text x="56" y="28" font-size="14" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Collect traces</text><line x1="224" y1="124" x2="242" y2="124" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="246" y="8" width="196" height="232" rx="10" class="s-purple" fill="none" stroke-width="1.5"/><rect x="246" y="8" width="196" height="40" rx="10" class="fs-purple s-purple" stroke-width="1.5"/><rect x="246.75" y="38" width="194.5" height="10" rx="0" class="fs-purple"/><line x1="246" y1="48" x2="442" y2="48" class="s-purple" stroke-width="1.5"/><text x="260" y="28" font-size="15" font-weight="700" dominant-baseline="central" class="t-purple" xml:space="preserve">2</text><text x="278" y="28" font-size="14" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Open coding</text><line x1="446" y1="124" x2="464" y2="124" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="468" y="8" width="196" height="232" rx="10" class="s-orange" fill="none" stroke-width="1.5"/><rect x="468" y="8" width="196" height="40" rx="10" class="fs-orange s-orange" stroke-width="1.5"/><rect x="468.75" y="38" width="194.5" height="10" rx="0" class="fs-orange"/><line x1="468" y1="48" x2="664" y2="48" class="s-orange" stroke-width="1.5"/><text x="482" y="28" font-size="15" font-weight="700" dominant-baseline="central" class="t-orange" xml:space="preserve">3</text><text x="500" y="28" font-size="14" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Axial coding</text><line x1="668" y1="124" x2="686" y2="124" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="690" y="8" width="196" height="232" rx="10" class="s-green" fill="none" stroke-width="1.5"/><rect x="690" y="8" width="196" height="40" rx="10" class="fs-green s-green" stroke-width="1.5"/><rect x="690.75" y="38" width="194.5" height="10" rx="0" class="fs-green"/><line x1="690" y1="48" x2="886" y2="48" class="s-green" stroke-width="1.5"/><text x="704" y="28" font-size="15" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">4</text><text x="722" y="28" font-size="14" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Count</text><text x="38" y="72" font-size="13" class="t-ink" xml:space="preserve">About 100 diverse</text><text x="38" y="91" font-size="13" class="t-ink" xml:space="preserve">sessions, full record</text><text x="38" y="110" font-size="13" class="t-ink" xml:space="preserve">of each. No users yet?</text><text x="38" y="129" font-size="13" class="t-ink" xml:space="preserve">Use synthetic inputs.</text><rect x="38" y="164" width="26" height="34" rx="3" class="fs-blue s-blue" stroke-width="1.5"/><rect x="72" y="164" width="26" height="34" rx="3" class="fs-blue s-blue" stroke-width="1.5"/><rect x="106" y="164" width="26" height="34" rx="3" class="fs-blue s-blue" stroke-width="1.5"/><rect x="140" y="164" width="26" height="34" rx="3" class="fs-blue s-blue" stroke-width="1.5"/><rect x="174" y="164" width="26" height="34" rx="3" class="fs-blue s-blue" stroke-width="1.5"/><text x="38" y="220" font-size="12" class="t-muted" xml:space="preserve">one trace = one session</text><rect x="258" y="66" width="172" height="26" rx="4" class="fs-purple"/><text x="266" y="79" font-size="12" font-style="italic" dominant-baseline="central" class="t-ink" xml:space="preserve">“Sunday slot, office closed”</text><rect x="258" y="100" width="172" height="26" rx="4" class="fs-purple"/><text x="266" y="113" font-size="12" font-style="italic" dominant-baseline="central" class="t-ink" xml:space="preserve">“no handoff, asked twice”</text><rect x="258" y="134" width="172" height="26" rx="4" class="fs-purple"/><text x="266" y="147" font-size="12" font-style="italic" dominant-baseline="central" class="t-ink" xml:space="preserve">“booked the wrong week”</text><text x="260" y="184" font-size="12.5" class="t-muted" xml:space="preserve">Free-form, first failure</text><text x="260" y="201" font-size="12.5" class="t-muted" xml:space="preserve">in each trace. First 30</text><text x="260" y="218" font-size="12.5" class="t-muted" xml:space="preserve">yourself.</text><rect x="480" y="64" width="172" height="24" rx="4" class="fs-orange s-orange" stroke-width="1.5"/><text x="490" y="76" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">conversation flow</text><rect x="480" y="94" width="172" height="24" rx="4" class="fs-orange s-orange" stroke-width="1.5"/><text x="490" y="106" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">handoff to a person</text><rect x="480" y="124" width="172" height="24" rx="4" class="fs-orange s-orange" stroke-width="1.5"/><text x="490" y="136" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">date handling</text><text x="566" y="166" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">…</text><text x="482" y="194" font-size="12.5" class="t-muted" xml:space="preserve">Group similar notes into</text><text x="482" y="211" font-size="12.5" class="t-muted" xml:space="preserve">a failure taxonomy.</text><text x="788" y="92" font-size="24" text-anchor="middle" font-weight="700" class="t-green" xml:space="preserve">over 60%</text><text x="788" y="120" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">of all problems came from</text><text x="788" y="137" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">the top three categories</text><text x="788" y="154" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">(Nurture Boss)</text><text x="704" y="194" font-size="12.5" class="t-muted" xml:space="preserve">The counts decide which</text><text x="704" y="211" font-size="12.5" class="t-muted" xml:space="preserve">evals to write and what to</text><text x="704" y="228" font-size="12.5" class="t-muted" xml:space="preserve">fix first.</text><path d="M788,244 L788,274 L122,274 L122,248" class="s-muted" stroke-width="2" fill="none" marker-end="url(#ah-muted)"/><rect x="225" y="262" width="460" height="24" class="bg"/><text x="455" y="274" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-muted" xml:space="preserve">Read fresh traces until they stop showing new kinds of failure.</text></g>
<text x="24" y="355" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Example notes are illustrative. The 60% figure is from the Nurture Boss case (Husain, 2025).</text>
</svg>
