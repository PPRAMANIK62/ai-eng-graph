 markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="870" height="300"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Shorter answers save far more time than shorter prompts</text>
<g transform="translate(0 44)"><text x="196" y="42" font-size="14" text-anchor="end" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Halve the output</text><rect x="210" y="20" width="400" height="44" rx="2" class="f-blue"/><text x="620" y="42" font-size="13.5" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">about 50% less time</text><text x="196" y="112" font-size="14" text-anchor="end" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Halve the prompt</text><rect x="210" y="90" width="8" height="44" rx="2" class="f-orange"/><rect x="218" y="90" width="32" height="44" rx="2" class="fs-orange s-orange" stroke-width="1.5"/><text x="260" y="112" font-size="13.5" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">1–5% less time</text><line x1="210" y1="10" x2="210" y2="144" class="axis" stroke-width="1.5"/><line x1="210" y1="144" x2="210" y2="149" class="axis" stroke-width="1.5"/><text x="210" y="164" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">0%</text><line x1="290" y1="144" x2="290" y2="149" class="axis" stroke-width="1.5"/><text x="290" y="164" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">10%</text><line x1="370" y1="144" x2="370" y2="149" class="axis" stroke-width="1.5"/><text x="370" y="164" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">20%</text><line x1="450" y1="144" x2="450" y2="149" class="axis" stroke-width="1.5"/><text x="450" y="164" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">30%</text><line x1="530" y1="144" x2="530" y2="149" class="axis" stroke-width="1.5"/><text x="530" y="164" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">40%</text><line x1="610" y1="144" x2="610" y2="149" class="axis" stroke-width="1.5"/><text x="610" y="164" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">50%</text><line x1="690" y1="144" x2="690" y2="149" class="axis" stroke-width="1.5"/><text x="690" y="164" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">60%</text><line x1="210" y1="144" x2="690" y2="144" class="axis" stroke-width="1.5"/><text x="450" y="186" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">share of total response time saved</text><text x="24" y="214" font-size="12.5" class="t-muted" xml:space="preserve">The prompt matters more only with very large contexts (long documents, images).</text></g>
<text x="24" y="289" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Rules of thumb from OpenAI's latency optimization guide, not a measurement.</text>
</svg>
