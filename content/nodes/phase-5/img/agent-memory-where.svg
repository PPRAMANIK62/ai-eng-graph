<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 920 414" width="920" height="414" role="img" aria-labelledby="fig-m5xp00-t fig-m5xp00-d">
<title id="fig-m5xp00-t">Where an agent's memory lives</title>
<desc id="fig-m5xp00-d">Where an agent's memory lives. Inside the context window, seen on every call: the system prompt and instructions, a few small memory blocks the agent can edit (who the user is, the current goal), and the recent messages and tool results of this run. Outside the window, fetched with tool calls: memory files the agent writes and reads (like a /memories folder or NOTES.md), the full message history it can search, and a knowledge store it can search. When the window fills, old messages move out to the history store and get folded into a summary.</desc>
