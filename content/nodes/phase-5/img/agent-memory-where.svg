r="middle" class="t-blue" xml:space="preserve">when the window fills:</text><text x="460" y="298.2" font-size="12" text-anchor="middle" class="t-blue" xml:space="preserve">old turns move out,</text><text x="460" y="314.4" font-size="12" text-anchor="middle" class="t-blue" xml:space="preserve">folded into a summary</text></g>
