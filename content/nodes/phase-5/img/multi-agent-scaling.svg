<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 910 430" width="910" height="430" role="img" aria-labelledby="fig-1rxwlen-t fig-1rxwlen-d">
<title id="fig-1rxwlen-t">Same token budget: more agents helped on one task shape, hurt on others</title>
<desc id="fig-1rxwlen-d">For each of six agent benchmarks, the range of relative change from four multi-agent setups compared with a single agent at the same token budget. Finance Agent: +57% to +80.8%. BrowseComp-Plus: −35% to +9.2%. Workbench: −11% to +5.6%. Terminal-Bench: −19.2% to +1.7%. SWE-bench Verified: −14.9% to −2.1%. PlanCraft: −70% to −39.1%. Averaged across everything, the change was −0.3%.</desc>
