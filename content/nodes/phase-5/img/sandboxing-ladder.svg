<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 790 346" width="790" height="346" role="img" aria-labelledby="fig-wzwjoq-t fig-wzwjoq-d">
<title id="fig-wzwjoq-t">A ladder of sandbox options</title>
<desc id="fig-wzwjoq-d">A ladder of sandbox options for a coding agent, from least to most isolation. Sandboxed shell commands: only shell commands and their child processes are fenced; file tools, MCP servers and hooks still run on the host. Sandbox runtime: the whole agent process, including MCP servers and hooks, inside OS-level filesystem and network limits. Container (dev container or custom): a full development environment, sharing the host kernel. Virtual machine or microVM: a full operating system with its own kernel, the strongest separation. Cloud session: a VM run by the provider, with a network allowlist and credentials held by a proxy outside.</desc>
