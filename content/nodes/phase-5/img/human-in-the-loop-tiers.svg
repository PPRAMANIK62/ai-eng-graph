<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 517" width="900" height="517" role="img" aria-labelledby="fig-8pt0um-t fig-8pt0um-d">
<title id="fig-8pt0um-t">Only risky actions reach the classifier, and repeated denials reach a human</title>
<desc id="fig-8pt0um-d">A funnel of permission checks in Claude Code auto mode. Tier 1: a built-in allowlist of tools that can't change anything (reads, search, code navigation) runs without a check. Tier 2: file edits inside the project directory run without a check, since they can be reviewed in version control. Tier 3: everything else (shell commands, web fetches, external tools, subagents, files outside the project) goes to a two-stage classifier, a fast yes/no filter and then careful reasoning on what it flags. Blocked actions go back to the agent with a reason. After 3 denials in a row or 20 in total, the session stops and a human decides. Measured: 0.4% of harmless actions blocked, 17% of real overeager actions missed.</desc>
<style>
