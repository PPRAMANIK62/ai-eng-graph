<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="900" height="517"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Only risky actions reach the classifier, and repeated denials reach a human</text>
<g transform="translate(0 44)"><rect x="20" y="10" width="150" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="95" y="30" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">agent wants to act</text><rect x="20" y="76" width="420" height="46" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="230" y="99" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve"></text><text x="34" y="94" font-size="13.5" font-weight="700" class="t-ink" xml:space="preserve">Tier 1: safe tools</text><text x="34" y="112" font-size="12.5" class="t-muted" xml:space="preserve">reads, search, code navigation</text><line x1="442" y1="99" x2="498" y2="99" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="506" y="99" font-size="13" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">runs, no check</text><rect x="20" y="138" width="420" height="46" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="230" y="161" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve"></text><text x="34" y="156" font-size="13.5" font-weight="700" class="t-ink" xml:space="preserve">Tier 2: edits in the project</text><text x="34" y="174" font-size="12.5" class="t-muted" xml:space="preserve">reviewable in version control</text><line x1="442" y1="161" x2="498" y2="161" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="506" y="161" font-size="13" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">runs, no check</text><rect x="20" y="200" width="420" height="46" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="230" y="223" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve"></text><text x="34" y="218" font-size="13.5" font-weight="700" class="t-ink" xml:space="preserve">Tier 3: everything else</text><text x="34" y="236" font-size="12.5" class="t-muted" xml:space="preserve">shell, web fetch, external tools, subagents, outside files</text><line x1="442" y1="223" x2="498" y2="223" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="506" y="223" font-size="13" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">classifier</text><line x1="95" y1="50" x2="95" y2="74" class="s-muted" stroke-width="1.5"/><rect x="620" y="203" width="250" height="40" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="745" y="214.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">stage 1: fast yes/no,</text><text x="745" y="231.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">errs toward blocking</text><rect x="620" y="267" width="250" height="40" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="745" y="278.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">stage 2: reasons carefully</text><text x="745" y="295.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">about what stage 1 flagged</text><line x1="745" y1="243" x2="745" y2="265" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><line x1="588" y1="223" x2="618" y2="223" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="620" y="333" width="250" height="40" rx="6" class="s-red" fill="none" stroke-width="1.5"/><text x="745" y="344.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">blocked: reason goes back</text><text x="745" y="361.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">to the agent, it tries again</text><line x1="745" y1="307" x2="745" y2="331" class="s-red" stroke-width="1.5" marker-end="url(#ah-red)"/><rect x="620" y="395" width="250" height="40" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="745" y="406.88" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">3 denials in a row or 20 total:</text><text x="745" y="423.13" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">stop, a human decides</text><line x1="745" y1="373" x2="745" y2="393" class="s-purple" stroke-width="1.5" marker-end="url(#ah-purple)"/><text x="20" y="353" font-size="13" font-weight="600" class="t-ink" xml:space="preserve">Measured on the full pipeline:</text><text x="20" y="375" font-size="12.5" class="t-ink" xml:space="preserve">0.4% of 10,000 real, harmless tool calls blocked</text><text x="20" y="395" font-size="12.5" font-weight="600" class="t-red" xml:space="preserve">17% of 52 real overeager actions let through</text><text x="20" y="415" font-size="12.5" class="t-muted" xml:space="preserve">Users had approved 93% of the old prompts.</text></g>
<text x="24" y="506" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Based on Anthropic, “How we built Claude Code auto mode” (2026). Simplified.</text>
</svg>
