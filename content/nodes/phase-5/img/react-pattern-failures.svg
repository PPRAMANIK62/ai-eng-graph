<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 790 366" width="790" height="366" role="img" aria-labelledby="fig-1q2gl4n-t fig-1q2gl4n-d">
<title id="fig-1q2gl4n-t">Why ReAct and chain-of-thought fail differently</title>
<desc id="fig-1q2gl4n-d">Two bar groups from hand-labeled failures on HotpotQA. Hallucinated facts or reasoning: 56% of chain-of-thought failures, 0% of ReAct failures. Wrong reasoning, including getting stuck repeating steps: 16% for chain-of-thought, 47% for ReAct. Search returned nothing useful: 23% of ReAct failures, not applicable to chain-of-thought.</desc>
