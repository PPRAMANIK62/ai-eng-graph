<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 958 334" width="958" height="334" role="img" aria-labelledby="fig-u928v3-t fig-u928v3-d">
<title id="fig-u928v3-t">Four ways to match a run against a reference</title>
<desc id="fig-u928v3-d">The four trajectory match modes, checked against one reference run: look up order, check policy, issue refund. A run with the same calls in the same order passes all four. A run with the same calls in a different order fails strict and passes unordered, subset and superset. A run with one extra call (search FAQ) fails strict, unordered and subset, and passes superset. A run that skips checking the policy fails strict, unordered and superset, and passes subset.</desc>
