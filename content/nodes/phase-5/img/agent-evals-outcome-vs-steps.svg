<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 880 374" width="880" height="374" role="img" aria-labelledby="fig-17pewbw-t fig-17pewbw-d">
<title id="fig-17pewbw-t">Grade the outcome; check steps only for rules</title>
<desc id="fig-17pewbw-d">Outcome first, steps to diagnose. Two runs of a refund agent reach the same correct end state by different routes. Run A: look up the order, check the policy, verify the customer, issue the refund. Run B: look up the order, verify the customer, check the policy, issue the refund. An outcome check queries the payments database and passes both. A strict trajectory match against Run A as the reference passes Run A and fails Run B, even though Run B did the job. A rule check (the refund must come after verifying the customer) passes both.</desc>
