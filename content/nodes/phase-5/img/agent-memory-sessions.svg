<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 398" width="900" height="398" role="img" aria-labelledby="fig-15jf20y-t fig-15jf20y-d">
<title id="fig-15jf20y-t">Memory across sessions is a handoff note</title>
<desc id="fig-15jf20y-d">Memory across sessions as a handoff. Session 1, the initializer, writes a feature list, a progress file and a first git commit. Each later session starts with an empty context window, reads the progress file and the git log, picks one unfinished feature, builds and tests it end to end, then commits and updates the progress file. The files and the git history persist between sessions; the context windows don't.</desc>
