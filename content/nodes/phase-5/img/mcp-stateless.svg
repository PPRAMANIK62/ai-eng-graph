<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 458" width="900" height="458" role="img" aria-labelledby="fig-1z0jlwu-t fig-1z0jlwu-d">
<title id="fig-1z0jlwu-t">MCP dropped sessions on 2026-07-28</title>
<desc id="fig-1z0jlwu-d">Two sequence sketches. Left, MCP before 2026-07-28: a handshake (initialize, a reply, initialized) opens a session, and later tools/list and tools/call requests carry an Mcp-Session-Id header tied to state kept for that session. Right, MCP 2026-07-28: there is no handshake; each request (an optional server/discover, then tools/list, then tools/call) carries its protocol version, client info and capabilities in _meta, so a round-robin load balancer can send each one to a different server instance.</desc>
<style>
