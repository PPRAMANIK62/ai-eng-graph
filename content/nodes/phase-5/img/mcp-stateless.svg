<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="900" height="458"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">MCP dropped sessions on 2026-07-28</text>
<g transform="translate(0 44)"><text x="20" y="8" font-size="14.5" font-weight="700" class="t-orange" xml:space="preserve">Before 2026-07-28: a session</text><rect x="20" y="30" width="90" height="30" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="65" y="45" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">client</text><rect x="310" y="30" width="110" height="30" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="365" y="45" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">server</text><line x1="65" y1="60" x2="65" y2="330" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="365" y1="60" x2="365" y2="330" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="67" y1="86" x2="363" y2="86" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><text x="215" y="79" font-size="12.5" text-anchor="middle" class="t-ink mono" xml:space="preserve">initialize</text><line x1="363" y1="130" x2="67" y2="130" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><text x="215" y="123" font-size="12.5" text-anchor="middle" class="t-ink mono" xml:space="preserve">reply</text><line x1="67" y1="174" x2="363" y2="174" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><text x="215" y="167" font-size="12.5" text-anchor="middle" class="t-ink mono" xml:space="preserve">initialized</text><line x1="67" y1="218" x2="363" y2="218" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><text x="215" y="211" font-size="12.5" text-anchor="middle" class="t-ink mono" xml:space="preserve">tools/list + Mcp-Session-Id</text><line x1="67" y1="262" x2="363" y2="262" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><text x="215" y="255" font-size="12.5" text-anchor="middle" class="t-ink mono" xml:space="preserve">tools/call + Mcp-Session-Id</text><rect x="321" y="300" width="88" height="26" rx="4" class="fs-orange s-orange" stroke-width="1.5"/><text x="365" y="313" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-orange" xml:space="preserve">session state</text><text x="20" y="356" font-size="12.5" class="t-ink" xml:space="preserve">The same server has to remember the session,</text><text x="20" y="374" font-size="12.5" class="t-ink" xml:space="preserve">or share that state with every other instance.</text><line x1="446" y1="0" x2="446" y2="380" class="grid" stroke-width="1"/><text x="470" y="8" font-size="14.5" font-weight="700" class="t-blue" xml:space="preserve">2026-07-28: every request stands alone</text><rect x="470" y="30" width="90" height="30" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="515" y="45" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">client</text><rect x="620" y="30" width="110" height="30" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="675" y="45" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">load balancer</text><line x1="515" y1="60" x2="515" y2="280" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="675" y1="60" x2="675" y2="280" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="770" y="88" width="110" height="32" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="825" y="104" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">instance A</text><rect x="770" y="164" width="110" height="32" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="825" y="180" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">instance B</text><rect x="770" y="240" width="110" height="32" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="825" y="256" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">instance C</text><line x1="517" y1="104" x2="673" y2="104" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><text x="595" y="80" font-size="12.5" text-anchor="middle" class="t-ink mono" xml:space="preserve">server/discover (optional)</text><text x="595" y="96" font-size="12" text-anchor="middle" class="t-blue mono" xml:space="preserve">+ _meta</text><line x1="677" y1="104" x2="768" y2="104" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><line x1="517" y1="180" x2="673" y2="180" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><text x="595" y="156" font-size="12.5" text-anchor="middle" class="t-ink mono" xml:space="preserve">tools/list</text><text x="595" y="172" font-size="12" text-anchor="middle" class="t-blue mono" xml:space="preserve">+ _meta</text><line x1="677" y1="180" x2="768" y2="180" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><line x1="517" y1="256" x2="673" y2="256" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><text x="595" y="232" font-size="12.5" text-anchor="middle" class="t-ink mono" xml:space="preserve">tools/call</text><text x="595" y="248" font-size="12" text-anchor="middle" class="t-blue mono" xml:space="preserve">+ _meta</text><line x1="677" y1="256" x2="768" y2="256" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><text x="470" y="306" font-size="12.5" class="t-muted" xml:space="preserve">_meta = protocol version, client info,</text><text x="470" y="324" font-size="12.5" class="t-muted" xml:space="preserve">client capabilities, on every request</text><text x="470" y="356" font-size="12.5" class="t-ink" xml:space="preserve">Round-robin: any instance can answer,</text><text x="470" y="374" font-size="12.5" class="t-ink" xml:space="preserve">with no shared session storage.</text></g>
<text x="24" y="447" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Based on the MCP 2026-07-28 release post and architecture docs. Simplified.</text>
</svg>
