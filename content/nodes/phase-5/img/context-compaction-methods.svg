<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 884 454" width="884" height="454" role="img" aria-labelledby="fig-vinr57-t fig-vinr57-d">
<title id="fig-vinr57-t">Two ways to shrink an agent's history</title>
<desc id="fig-vinr57-d">Three versions of the same agent run of 14 turns. Raw: every turn keeps its reasoning, tool call and full tool output. Observation masking: every turn keeps its reasoning and tool call, but tool outputs older than the last 10 turns become a one-line placeholder. LLM summary: the older turns are replaced by one model-written summary, and the last 10 turns are kept in full.</desc>
