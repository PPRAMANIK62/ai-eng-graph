<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="fig-156lgga-t fig-156lgga-d">
<title id="fig-156lgga-t">Design tools around the job, not around the endpoints</title>
<desc id="fig-156lgga-d">Two ways to give an agent the same abilities. Left, tools that mirror the API: list_users, list_events, create_event, read_logs, get_customer_by_id, list_transactions and list_notes, seven tools, with each intermediate result passing through the model. Right, tools built around tasks: schedule_event (finds availability and books), search_logs (only matching lines with context) and get_customer_context (everything relevant about one customer), three tools. Arrows show which API tools each task tool replaces.</desc>
