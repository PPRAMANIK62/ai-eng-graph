<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 356" width="900" height="356" role="img" aria-labelledby="fig-51c7d8-t fig-51c7d8-d">
<title id="fig-51c7d8-t">What each turn sends in the auth.ts run</title>
<desc id="fig-51c7d8-d">The auth.ts run as it grows. Turn 1 sends the system prompt, tool definitions and task, and gets back the npm test output. Turn 2 sends all of that plus the test output and gets back two files. Turn 3 sends all of that plus the two files, edits and re-runs the tests. The final turn sends everything and gets back a text reply. Each turn's input contains every earlier turn. Bar lengths show the shape, not measured token counts.</desc>
<style>
