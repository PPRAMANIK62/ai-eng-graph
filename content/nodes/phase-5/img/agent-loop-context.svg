<g transform="translate(0 44)"><text x="78" y="34" font-size="13.5" text-anchor="end" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Turn 1</text><rect x="90" y="20" width="150" height="28" rx="3" class="f-grey"/><text x="90" y="64" font-size="12" class="t-muted" xml:space="preserve">sends: system prompt, tools, task</text><text x="254" y="34" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">gets back: npm test: 3 failures</text><text x="78" y="96" font-size="13.5" text-anchor="end" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Turn 2</text><rect x="90" y="82" width="150" height="28" rx="3" class="fs-grey s-grey" stroke-width="1"/><rect x="242" y="82" width="70" height="28" rx="3" class="f-orange"/><text x="90" y="126" font-size="12" class="t-muted" xml:space="preserve">sends: + test output</text><text x="326" y="96" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">gets back: auth.ts, auth.test.ts</text><text x="78" y="158" font-size="13.5" text-anchor="end" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Turn 3</text><rect x="90" y="144" width="150" height="28" rx="3" class="fs-grey s-grey" stroke-width="1"/><rect x="242" y="144" width="70" height="28" rx="3" class="fs-orange s-orange" stroke-width="1"/><rect x="314" y="144" width="150" height="28" rx="3" class="f-blue"/><text x="90" y="188" font-size="12" class="t-muted" xml:space="preserve">sends: + two files</text><text x="478" y="158" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">gets back: edit; npm test: all pass</text><text x="78" y="220" font-size="13.5" text-anchor="end" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Final</text><rect x="90" y="206" width="150" height="28" rx="3" class="fs-grey s-grey" stroke-width="1"/><rect x="242" y="206" width="70" height="28" rx="3" class="fs-orange s-orange" stroke-width="1"/><rect x="314" y="206" width="150" height="28" rx="3" class="fs-blue s-blue" stroke-width="1"/><rect x="466" y="206" width="90" height="28" rx="3" class="f-purple"/><text x="90" y="250" font-size="12" class="t-muted" xml:space="preserve">sends: + edit and new test output</text><text x="570" y="220" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">gets back: text reply, no tool call</text><text x="90" y="274" font-size="12" font-style="italic" class="t-muted" xml:space="preserve">Solid: new this turn. Every turn re-sends everything before it. Bar lengths are illustrative, not measured tokens.</text></g>
<text x="24" y="345" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Run from the Claude Agent SDK docs, “How the agent loop works”.</text>
</svg>
