<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 434" width="900" height="434" role="img" aria-labelledby="fig-1x054n-t fig-1x054n-d">
<title id="fig-1x054n-t">Most paths through these questions end in a workflow</title>
<desc id="fig-1x054n-d">A decision flow. First: can you write down the steps ahead of time? If yes, build a workflow. If no: is there a clear way to check progress, like tests? If no, narrow the task or add a check before reaching for an agent. If yes: is the result worth more tokens, more latency and less predictability? If no, use a workflow with a retry loop. If yes, try a single agent with a turn and budget limit.</desc>
<style>
