="700" y="136.45" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">before reaching for an agent</text><line x1="185" y1="158" x2="185" y2="198" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="195" y="180" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">yes</text><rect x="20" y="200" width="330" height="56" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="185" y="219.55" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Is the result worth more tokens,</text><text x="185" y="236.45" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">latency and less predictability?</text><line x1="352" y1="228" x2="518" y2="228" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="435" y="220" font-size="12.5" text-anchor="middle" font-weight="600" class="t-muted" xml:space="preserve">no</text><rect x="520" y="204" width="360" height="48" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="700" y="228" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Workflow with a retry loop</text><line x1="185" y1="258" x2="185" y2="298" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="195" y="280" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">yes</text><rect x="20" y="300" width="330" height="50" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="185" y="316.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Try a single agent with</text><text x="185" y="333.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">a turn limit and a budget</text></g>
