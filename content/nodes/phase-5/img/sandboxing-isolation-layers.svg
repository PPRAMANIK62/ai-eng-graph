<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 902 384" width="902" height="384" role="img" aria-labelledby="fig-kr125d-t fig-kr125d-d">
<title id="fig-kr125d-t">How much sits between the agent's code and your machine</title>
<desc id="fig-kr125d-d">Three ways to run untrusted code, drawn as layers. Container: the app sits directly on the shared host kernel, with seccomp filters trimming its system calls; one kernel bug reachable from the app can compromise the host. gVisor: the app talks to the Sentry, a kernel written in Go running in user space, which answers the app's system calls itself and makes only a small set of calls to the host kernel; its threat model is a host kernel bug. Firecracker microVM: the app runs on its own guest kernel inside a virtual machine on KVM, with only 5 emulated devices and a jailer around the VMM; its threat model is that the guest kernel is already compromised. Boot under 125 ms, under 5 MiB overhead per microVM.</desc>
