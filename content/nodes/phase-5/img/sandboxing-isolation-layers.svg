<g transform="translate(0 44)"><text x="20" y="10" font-size="15" font-weight="700" class="t-ink" xml:space="preserve">Container</text><rect x="20" y="30" width="270" height="61.33" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="155" y="60.67" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">agent's code</text><rect x="20" y="99.33" width="270" height="61.33" rx="6" class="s-grey" fill="none" stroke-width="1.5"/><text x="155" y="130" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">seccomp filter</text><rect x="20" y="168.67" width="270" height="61.33" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="155" y="199.33" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">host kernel (shared)</text><text x="20" y="256" font-size="12.5" font-weight="600" class="t-ink" xml:space="preserve">One kernel for everything.</text><text x="20" y="275" font-size="12.5" font-weight="400" class="t-muted" xml:space="preserve">A kernel bug reachable through an</text><text x="20" y="294" font-size="12.5" font-weight="400" class="t-muted" xml:space="preserve">allowed call is a host compromise.</text><text x="316" y="10" font-size="15" font-weight="700" class="t-blue" xml:space="preserve">gVisor</text><rect x="316" y="30" width="270" height="61.33" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="451" y="60.67" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">agent's code</text><rect x="316" y="99.33" width="270" height="61.33" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="451" y="121.55" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Sentry: a kernel in Go,</text><text x="451" y="138.45" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">in user space</text><rect x="316" y="168.67" width="270" height="61.33" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="451" y="190.88" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">host kernel</text><text x="451" y="207.78" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">(small set of calls)</text><text x="316" y="256" font-size="12.5" font-weight="600" class="t-ink" xml:space="preserve">Threat model: a host kernel bug.</text><text x="316" y="275" font-size="12.5" font-weight="400" class="t-muted" xml:space="preserve">Every system call pays</text><text x="316" y="294" font-size="12.5" font-weight="400" class="t-muted" xml:space="preserve">for the extra layer.</text><text x="612" y="10" font-size="15" font-weight="700" class="t-green" xml:space="preserve">Firecracker microVM</text><rect x="612" y="30" width="270" height="44" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="747" y="52" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">agent's code</text><rect x="612" y="82" width="270" height="44" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="747" y="104" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">its own guest kernel</text><rect x="612" y="134" width="270" height="44" rx="6" class="s-green" fill="none" stroke-width="1.5"/><text x="747" y="147.55" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">VMM: 5 emulated devices,</text><text x="747" y="164.45" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">inside a jailer</text><rect x="612" y="186" width="270" height="44" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="747" y="208" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">host kernel + KVM</text><text x="612" y="256" font-size="12.5" font-weight="600" class="t-ink" xml:space="preserve">Threat model: the guest kernel</text><text x="612" y="275" font-size="12.5" font-weight="400" class="t-muted" xml:space="preserve">is already compromised.</text><text x="612" y="294" font-size="12.5" font-weight="400" class="t-muted" xml:space="preserve">Boot &lt; 125 ms, &lt; 5 MiB overhead.</text></g>
