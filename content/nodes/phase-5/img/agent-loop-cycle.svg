<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 404" width="900" height="404" role="img" aria-labelledby="fig-1rvrkua-t fig-1rvrkua-d">
<title id="fig-1rvrkua-t">The agent loop: call the model, run its tools, repeat</title>
<desc id="fig-1rvrkua-d">The agent loop. The task and the system prompt go to the model. The model either asks for one or more tool calls, which your code runs and feeds back as results for the next model call, or it answers with no tool call, which ends the loop. Around the loop, your code enforces a turn limit and a budget, and can pause for a person to approve risky actions.</desc>
