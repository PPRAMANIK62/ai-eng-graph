<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 918 316" width="918" height="316" role="img" aria-labelledby="fig-e251b3-t fig-e251b3-d">
<title id="fig-e251b3-t">Fewer key-value heads, smaller cache</title>
<desc id="fig-e251b3-d">Three diagrams, each with 8 query heads on top. Multi-head attention gives each query head its own key-value head, 8 in all. Grouped-query attention has 2 key-value heads, each shared by 4 query heads. Multi-query attention has 1 key-value head shared by all 8. Fewer key-value heads means less to store in the cache.</desc>
