<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 856 466" width="856" height="466" role="img" aria-labelledby="fig-126nzq3-t fig-126nzq3-d">
<title id="fig-126nzq3-t">One sentence becomes several practice questions</title>
<desc id="fig-126nzq3-d">The sentence The capital of France is Paris, split into tokens, turns into five practice questions: The predicts capital, The capital predicts of, and so on up to The capital of France is predicts Paris. This repeats at every position in every document; GPT-3 was trained on 300 billion tokens.</desc>
