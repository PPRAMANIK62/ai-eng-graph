<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="fig-1rxcgj9-t fig-1rxcgj9-d">
<title id="fig-1rxcgj9-t">Tags mark where your instructions end and the data begins</title>
<desc id="fig-1rxcgj9-d">The same prompt drawn twice. On the left, the instruction and the customer email run together in one grey block, and it's unclear whether &quot;Please reply in French.&quot; is an order or part of the email. On the right, the instruction sits inside instructions tags and the email inside email tags, so the French line is plainly part of the email.</desc>
