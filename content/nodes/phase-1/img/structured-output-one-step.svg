<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 316" width="900" height="316" role="img" aria-labelledby="fig-12cqc3z-t fig-12cqc3z-d">
<title id="fig-12cqc3z-t">Constrained decoding: the grammar removes choices, the model still predicts</title>
<desc id="fig-12cqc3z-d">One generation step with a strict schema. The JSON so far is {&quot;demo_requested&quot;: . The model gives probabilities to true, false, yes, a quote mark and maybe. The grammar then rules out yes, the quote mark and maybe, which are greyed out and crossed, so only true and false are left to sample from. The probabilities are illustrative.</desc>
