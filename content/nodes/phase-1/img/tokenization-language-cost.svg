<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="fig-gr2iad-t fig-gr2iad-d">
<title id="fig-gr2iad-t">Tokens needed for the same text, compared with English</title>
<desc id="fig-gr2iad-d">Bar chart of tokens needed for the same text under GPT-4's tokenizer, relative to English: English 1, Portuguese 1.5, German 1.6, Italian 1.6, Japanese 2.3, Bulgarian 2.6, Arabic 3, Burmese 11.7, Shan 15.</desc>
<style>
