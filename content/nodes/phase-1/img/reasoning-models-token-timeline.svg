<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 828 334" width="828" height="334" role="img" aria-labelledby="fig-10q2w07-t fig-10q2w07-d">
<title id="fig-10q2w07-t">Where the time and money go in a reasoning model</title>
<desc id="fig-10q2w07-d">Two token timelines for the same request. A reasoning model reads the input, then generates a long block of thinking tokens (hidden or summarized, but billed as output) before a short answer; the thinking and the answer together count toward max_tokens. A regular model reads the input and writes the answer straight away.</desc>
