middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Input</text><rect x="264" y="154" width="110" height="44" rx="4" class="fs-green s-green" stroke-width="1.5"/><text x="319" y="176" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Answer</text><line x1="150" y1="232" x2="798" y2="232" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="798" y="252" font-size="12" text-anchor="end" class="t-muted" xml:space="preserve">time, tokens generated one by one</text><text x="390" y="176" font-size="12.5" dominant-baseline="central" class="t-muted" xml:space="preserve">Same visible answer, much less to generate.</text></g>
