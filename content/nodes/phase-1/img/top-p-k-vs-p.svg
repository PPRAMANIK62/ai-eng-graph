<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 936 452" width="936" height="452" role="img" aria-labelledby="fig-pwapos-t fig-pwapos-d">
<title id="fig-pwapos-t">A fixed count (top-k) vs a fixed share (top-p)</title>
<desc id="fig-pwapos-d">Two bar charts of next-token probabilities. On the left the probability is spread flat over many tokens; on the right most of it sits on one or two. A top-k cut at k = 6 is the same line in both: on the left it throws away good options, on the right it lets in tokens with almost no chance. A top-p cut at p = 0.92 keeps 9 tokens on the left and only 3 on the right.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
@media (prefers-color-scheme: dark){.fig{--bg:var(--t-surface,#1c2026);--ink:var(--t-ink,#d9dee5);--muted:var(--t-ink-2,#a0a8b4);--line:var(--t-ink-3,#7a8390);--grid:var(--t-rule,#2e343d);--blue:var(--line-1,#6d9fe6);--orange:var(--line-3,#de9054);--green:var(--line-2,#52b27d);--red:var(--line-0,#e0636c);--purple:var(--line-4,#b08bcb);--grey:var(--t-ink-3,#7a8390);--blue-soft:var(--line-1-soft,#1f2d42);--orange-soft:var(--line-3-soft,#3a2a1d);--green-soft:var(--line-2-soft,#1c3226);--red-soft:var(--line-0-soft,#3b2226);--purple-soft:var(--line-4-soft,#2e2537);--grey-soft:var(--t-panel,#21262d);--ink-soft:var(--t-panel,#21262d);--muted-soft:var(--t-panel,#21262d)}}
.fig .bg{fill:var(--bg)}
.fig text{font-family:var(--transit-text), 'Public Sans', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;fill:var(--ink)}
.fig .display{font-family:var(--transit-sign), Overpass, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif}
.fig .mono{font-family:'JetBrains Mono', 'Noto Sans Mono', Menlo, Consolas, monospace}
.fig .grid{stroke:var(--grid)}
.fig .axis{stroke:var(--line)}
.fig .f-ink{fill:var(--ink)}.fig .s-ink{stroke:var(--ink)}.fig .fs-ink{fill:var(--ink-soft)}.fig .t-ink{fill:var(--ink)}
.fig .f-muted{fill:var(--muted)}.fig .s-muted{stroke:var(--muted)}.fig .fs-muted{fill:var(--muted-soft)}.fig .t-muted{fill:var(--muted)}
.fig .f-blue{fill:var(--blue)}.fig .s-blue{stroke:var(--blue)}.fig .fs-blue{fill:var(--blue-soft)}.fig .t-blue{fill:var(--blue)}
.fig .f-orange{fill:var(--orange)}.fig .s-orange{stroke:var(--orange)}.fig .fs-orange{fill:var(--orange-soft)}.fig .t-orange{fill:var(--orange)}
.fig .f-green{fill:var(--green)}.fig .s-green{stroke:var(--green)}.fig .fs-green{fill:var(--green-soft)}.fig .t-green{fill:var(--green)}
.fig .f-red{fill:var(--red)}.fig .s-red{stroke:var(--red)}.fig .fs-red{fill:var(--red-soft)}.fig .t-red{fill:var(--red)}
.fig .f-purple{fill:var(--purple)}.fig .s-purple{stroke:var(--purple)}.fig .fs-purple{fill:var(--purple-soft)}.fig .t-purple{fill:var(--purple)}
.fig .f-grey{fill:var(--grey)}.fig .s-grey{stroke:var(--grey)}.fig .fs-grey{fill:var(--grey-soft)}.fig .t-grey{fill:var(--grey)}
</style>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="936" height="452"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">A fixed count (top-k) vs a fixed share (top-p)</text>
<g transform="translate(0 44)"><text x="24" y="12" font-size="12.5" font-style="italic" class="t-muted" xml:space="preserve">Illustrative shape, not data. The counts (k = 6; 9 and 3 tokens kept at p = 0.92) are from the Hugging Face example.</text><text x="24" y="42" font-size="15" font-weight="600" class="t-ink" xml:space="preserve">Flat: many tokens fit</text><rect x="20" y="88" width="317.11" height="218" rx="4" class="fs-blue"/><rect x="24" y="62" width="14" height="14" rx="2" class="fs-blue s-blue" stroke-width="1"/><text x="44" y="69" font-size="13" font-weight="700" dominant-baseline="central" class="t-blue" xml:space="preserve">top-p (p = 0.92) keeps 9</text><line x1="234" y1="69" x2="256" y2="69" class="s-orange" stroke-width="2.5" stroke-dasharray="5 4"/><text x="262" y="69" font-size="13" font-weight="700" dominant-baseline="central" class="t-orange" xml:space="preserve">top-k (k = 6) keeps 6</text><rect x="31.56" y="261.97" width="26.81" height="44.03" rx="2" class="f-blue"/><rect x="65.93" y="265.35" width="26.81" height="40.65" rx="2" class="f-blue"/><rect x="100.3" y="267.05" width="26.81" height="38.95" rx="2" class="f-blue"/><rect x="134.67" y="268.74" width="26.81" height="37.26" rx="2" class="f-blue"/><rect x="169.04" y="270.44" width="26.81" height="35.56" rx="2" class="f-blue"/><rect x="203.41" y="273.82" width="26.81" height="32.18" rx="2" class="f-blue"/><rect x="237.78" y="275.52" width="26.81" height="30.48" rx="2" class="f-blue"/><rect x="272.15" y="277.21" width="26.81" height="28.79" rx="2" class="f-blue"/><rect x="306.52" y="278.9" width="26.81" height="27.1" rx="2" class="f-blue"/><rect x="340.89" y="295.84" width="26.81" height="10.16" rx="2" class="f-grey"/><rect x="375.26" y="297.53" width="26.81" height="8.47" rx="2" class="f-grey"/><rect x="409.63" y="300.92" width="26.81" height="5.08" rx="2" class="f-grey"/><line x1="20" y1="306" x2="444" y2="306" class="axis" stroke-width="1.5"/><text x="234" y="324" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">tokens, most likely first</text><line x1="234" y1="88" x2="234" y2="310" class="s-orange" stroke-width="2.5" stroke-dasharray="5 4"/><text x="24" y="350" font-size="12.5" font-weight="600" class="t-orange" xml:space="preserve">k = 6 covers only about two-thirds:</text><text x="24" y="368" font-size="12.5" class="t-orange" xml:space="preserve">it cuts tokens that would have been fine</text><text x="492" y="42" font-size="15" font-weight="600" class="t-ink" xml:space="preserve">Sharp: one or two tokens fit</text><rect x="488" y="88" width="110.89" height="218" rx="4" class="fs-blue"/><rect x="492" y="62" width="14" height="14" rx="2" class="fs-blue s-blue" stroke-width="1"/><text x="512" y="69" font-size="13" font-weight="700" dominant-baseline="central" class="t-blue" xml:space="preserve">top-p (p = 0.92) keeps 3</text><line x1="702" y1="69" x2="724" y2="69" class="s-orange" stroke-width="2.5" stroke-dasharray="5 4"/><text x="730" y="69" font-size="13" font-weight="700" dominant-baseline="central" class="t-orange" xml:space="preserve">top-k (k = 6) keeps 6</text><rect x="499.56" y="102.77" width="26.81" height="203.23" rx="2" class="f-blue"/><rect x="533.93" y="221.32" width="26.81" height="84.68" rx="2" class="f-blue"/><rect x="568.3" y="278.9" width="26.81" height="27.1" rx="2" class="f-blue"/><rect x="602.67" y="295.84" width="26.81" height="10.16" rx="2" class="f-grey"/><rect x="637.04" y="299.23" width="26.81" height="6.77" rx="2" class="f-grey"/><rect x="671.41" y="302.61" width="26.81" height="3.39" rx="2" class="f-grey"/><rect x="705.78" y="304.65" width="26.81" height="1.5" rx="2" class="f-grey"/><rect x="740.15" y="304.98" width="26.81" height="1.5" rx="2" class="f-grey"/><rect x="774.52" y="305.66" width="26.81" height="1.5" rx="2" class="f-grey"/><rect x="808.89" y="305.66" width="26.81" height="1.5" rx="2" class="f-grey"/><rect x="843.26" y="305.83" width="26.81" height="1.5" rx="2" class="f-grey"/><rect x="877.63" y="305.83" width="26.81" height="1.5" rx="2" class="f-grey"/><line x1="488" y1="306" x2="912" y2="306" class="axis" stroke-width="1.5"/><text x="702" y="324" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">tokens, most likely first</text><line x1="702" y1="88" x2="702" y2="310" class="s-orange" stroke-width="2.5" stroke-dasharray="5 4"/><text x="492" y="350" font-size="12.5" font-weight="600" class="t-orange" xml:space="preserve">k = 6 covers almost everything:</text><text x="492" y="368" font-size="12.5" class="t-orange" xml:space="preserve">it lets in tokens with almost no chance</text></g>
<text x="24" y="441" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from Holtzman et al. (2019), Figure 5, and Hugging Face, “How to generate text” (2020).</text>
</svg>
