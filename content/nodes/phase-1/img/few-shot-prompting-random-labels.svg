<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Random labels barely hurt; leaving the examples out hurts more</text>
<g transform="translate(0 44)"><line x1="60" y1="240" x2="480" y2="240" class="axis" stroke-width="1.5"/><line x1="60" y1="20" x2="60" y2="240" class="axis" stroke-width="1.5"/><text x="46" y="130" font-size="12.5" text-anchor="middle" transform="rotate(-90 46 130)" class="t-muted" xml:space="preserve">accuracy</text><rect x="82" y="125.6" width="96" height="114.4" rx="2" class="fs-grey s-grey" stroke-width="1.5" stroke-dasharray="5 4"/><text x="130" y="260" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">No examples</text><rect x="222" y="50.8" width="96" height="189.2" rx="2" class="fs-blue s-blue" stroke-width="1.5" stroke-dasharray="5 4"/><text x="270" y="260" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">Examples,</text><text x="270" y="277" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">correct labels</text><rect x="362" y="59.6" width="96" height="180.4" rx="2" class="fs-orange s-orange" stroke-width="1.5" stroke-dasharray="5 4"/><text x="410" y="260" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">Examples,</text><text x="410" y="277" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">random labels</text><text x="130" y="72" font-size="13" text-anchor="middle" font-weight="700" font-style="italic" class="t-muted" xml:space="preserve">Illustrative shape,</text><text x="130" y="90" font-size="13" text-anchor="middle" font-weight="700" font-style="italic" class="t-muted" xml:space="preserve">not data</text><path d="M228,44.80000000000001 L228,36.80000000000001 L452,36.80000000000001 L452,44.80000000000001 M340,36.80000000000001 L340,28.80000000000001" class="s-orange" stroke-width="1.5" fill="none"/><text x="340" y="22.8" font-size="13" text-anchor="middle" class="t-orange" xml:space="preserve">nearly equal</text><rect x="520" y="20" width="310" height="220" rx="8" class="fs-grey"/><text x="538" y="46" font-size="14" font-weight="700" class="t-ink" xml:space="preserve">What was measured</text><text x="538" y="78" font-size="13" class="t-ink" xml:space="preserve">Swapping correct labels for random:</text><text x="538" y="104" font-size="18" font-weight="700" class="t-orange" xml:space="preserve">0 to 5 points lower</text><text x="538" y="124" font-size="12.5" class="t-muted" xml:space="preserve">across 12 models up to GPT-3</text><text x="538" y="160" font-size="13" class="t-ink" xml:space="preserve">Average drop: 2.6 points classification,</text><text x="538" y="178" font-size="13" class="t-ink" xml:space="preserve">1.7 multiple choice</text><text x="538" y="212" font-size="13" class="t-ink" xml:space="preserve">Worst case: nearly 14 points</text><text x="538" y="230" font-size="12.5" class="t-muted" xml:space="preserve">(one dataset, GPT-J)</text></g>
<text x="24" y="347" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from Min et al. (2022), Figure 3. Bar heights are not the paper's; the numbers on the right are.</text>
