<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 830 540" width="830" height="540" role="img" aria-labelledby="fig-3sz58j-t fig-3sz58j-d">
<title id="fig-3sz58j-t">DeepSeek-R1-Zero during RL: longer answers, higher scores</title>
<desc id="fig-3sz58j-d">Two charts over DeepSeek-R1-Zero's 10,400 RL training steps. Top: AIME 2024 accuracy went from 15.6% at the start to 77.9% after training. Bottom: average response length grew over the same steps, from hundreds to thousands of tokens (shape only). A marker at step 8.2k shows where the length limit was raised and both jumped.</desc>
<style>
