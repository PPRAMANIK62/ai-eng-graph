<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">DeepSeek-R1-Zero during RL: longer answers, higher scores</text>
<g transform="translate(0 44)"><text x="90" y="16" font-size="13.5" font-weight="700" class="t-ink" xml:space="preserve">AIME 2024 accuracy (measured start and end only)</text><line x1="90" y1="200" x2="710" y2="200" class="grid" stroke-width="1"/><text x="82" y="200" font-size="11.5" text-anchor="end" dominant-baseline="central" class="t-muted" xml:space="preserve">0%</text><line x1="90" y1="157.5" x2="710" y2="157.5" class="grid" stroke-width="1"/><text x="82" y="157.5" font-size="11.5" text-anchor="end" dominant-baseline="central" class="t-muted" xml:space="preserve">25%</text><line x1="90" y1="115" x2="710" y2="115" class="grid" stroke-width="1"/><text x="82" y="115" font-size="11.5" text-anchor="end" dominant-baseline="central" class="t-muted" xml:space="preserve">50%</text><line x1="90" y1="72.5" x2="710" y2="72.5" class="grid" stroke-width="1"/><text x="82" y="72.5" font-size="11.5" text-anchor="end" dominant-baseline="central" class="t-muted" xml:space="preserve">75%</text><line x1="90" y1="30" x2="710" y2="30" class="grid" stroke-width="1"/><text x="82" y="30" font-size="11.5" text-anchor="end" dominant-baseline="central" class="t-muted" xml:space="preserve">100%</text><line x1="90" y1="200" x2="710" y2="200" class="axis" stroke-width="1.5"/><line x1="90" y1="173.48" x2="710" y2="173.48" class="s-grey" stroke-width="1" stroke-dasharray="5 4"/><circle cx="90" cy="173.48" r="6" class="f-blue"/><circle cx="710" cy="67.57" r="6" class="f-blue"/><text x="102" y="191.48" font-size="13" font-weight="700" class="t-blue" xml:space="preserve">15.6% at the start</text><text x="698" y="55.57" font-size="13" text-anchor="end" font-weight="700" class="t-blue" xml:space="preserve">77.9% after RL</text><line x1="724" y1="173.48" x2="724" y2="75.57" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><text x="730" y="120.53" font-size="12.5" font-weight="700" dominant-baseline="central" class="t-blue" xml:space="preserve">+62.3 points</text><text x="340.38" y="118.4" font-size="12" text-anchor="middle" font-style="italic" class="t-muted" xml:space="preserve">The paper's text gives only the start and end values,</text><text x="340.38" y="135.4" font-size="12" text-anchor="middle" font-style="italic" class="t-muted" xml:space="preserve">so the path between them isn't drawn.</text><text x="90" y="256" font-size="13.5" font-weight="700" class="t-ink" xml:space="preserve">Average response length</text><rect x="300" y="240" width="170" height="22" rx="4" class="fs-grey s-grey" stroke-width="1.5"/><text x="385" y="251" font-size="12" text-anchor="middle" font-style="italic" dominant-baseline="central" class="t-muted" xml:space="preserve">illustrative shape, not data</text><text x="78" y="282" font-size="12" text-anchor="end" class="t-muted" xml:space="preserve">longer</text><text x="78" y="416" font-size="12" text-anchor="end" class="t-muted" xml:space="preserve">shorter</text><path d="M90,408C129.744,402.125,169.487,396.25,209.231,390C248.974,383.75,288.718,376.75,328.462,370.5C368.205,364.25,407.949,357.896,447.692,352.5C489.423,346.834,531.154,342.167,572.885,337.5" class="s-orange" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/><path d="M584.808,307.5C604.679,303.816,624.551,300.132,644.423,297C666.282,293.555,688.141,290.777,710,288" class="s-orange" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/><text x="364.23" y="327" font-size="12.5" text-anchor="middle" font-weight="600" class="t-orange" xml:space="preserve">grows to hundreds, then thousands of tokens</text><line x1="90" y1="420" x2="710" y2="420" class="axis" stroke-width="1.5"/><line x1="90" y1="420" x2="90" y2="425" class="axis" stroke-width="1.5"/><text x="90" y="439" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">0</text><line x1="209.23" y1="420" x2="209.23" y2="425" class="axis" stroke-width="1.5"/><text x="209.23" y="439" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">2,000</text><line x1="328.46" y1="420" x2="328.46" y2="425" class="axis" stroke-width="1.5"/><text x="328.46" y="439" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">4,000</text><line x1="447.69" y1="420" x2="447.69" y2="425" class="axis" stroke-width="1.5"/><text x="447.69" y="439" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">6,000</text><line x1="566.92" y1="420" x2="566.92" y2="425" class="axis" stroke-width="1.5"/><text x="566.92" y="439" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">8,000</text><line x1="710" y1="420" x2="710" y2="425" class="axis" stroke-width="1.5"/><text x="710" y="439" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">10,400</text><text x="400" y="460" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">RL training steps</text><line x1="578.85" y1="30" x2="578.85" y2="420" class="s-purple" stroke-width="1.5" stroke-dasharray="5 4"/><text x="570.85" y="44" font-size="12" text-anchor="end" class="t-purple" xml:space="preserve">step 8.2k: length limit raised</text><text x="570.85" y="60" font-size="12" text-anchor="end" class="t-purple" xml:space="preserve">from 32,768 to 65,536 tokens;</text><text x="570.85" y="76" font-size="12" text-anchor="end" class="t-purple" xml:space="preserve">accuracy and length both jump</text></g>
<text x="24" y="529" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from figure 1 of the DeepSeek-R1 paper (DeepSeek-AI, 2025). Only the labelled numbers are data.</text>
</svg>
