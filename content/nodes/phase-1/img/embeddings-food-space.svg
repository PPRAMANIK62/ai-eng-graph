<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 1000 466" width="1000" height="466" role="img" aria-labelledby="fig-1yl3l6z-t fig-1yl3l6z-d">
<title id="fig-1yl3l6z-t">A list of numbers is a position: more numbers, more room to tell things apart</title>
<desc id="fig-1yl3l6z-d">Three views of the same foods. First, one line for sandwichness, from borscht, salad and pizza up to hot dog and shawarma. Second, a flat map that adds dessertness: hot dog at (0.2, –0.5) sits near shawarma, and apple strudel at (0.5, 0.3) is up in the dessert corner. Third, a cube that adds liquidness, where borscht moves away from everything else.</desc>
