<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">A list of numbers is a position: more numbers, more room to tell things apart</text>
<g transform="translate(0 44)"><text x="24" y="8" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">1. One number per food</text><text x="24" y="26" font-size="12.5" class="t-muted" xml:space="preserve">sandwichness only</text><line x1="34" y1="150" x2="310" y2="150" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><circle cx="60" cy="150" r="5" class="s-grey" fill="none" stroke-width="1.5"/><text x="60" y="136" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">borscht</text><circle cx="116" cy="150" r="5" class="s-grey" fill="none" stroke-width="1.5"/><text x="116" y="174" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">salad</text><circle cx="172" cy="150" r="5" class="s-grey" fill="none" stroke-width="1.5"/><text x="172" y="136" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">pizza</text><circle cx="228" cy="150" r="5" class="s-blue" fill="none" stroke-width="1.5"/><text x="228" y="174" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">hot dog</text><circle cx="284" cy="150" r="5" class="s-blue" fill="none" stroke-width="1.5"/><text x="284" y="136" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">shawarma</text><text x="34" y="208" font-size="12" class="t-muted" xml:space="preserve">less of a sandwich</text><text x="310" y="208" font-size="12" text-anchor="end" class="t-muted" xml:space="preserve">more of a sandwich</text><text x="174" y="240" font-size="12.5" text-anchor="middle" class="t-muted" xml:space="preserve">Apple strudel would land between hot dog</text><text x="174" y="258" font-size="12.5" text-anchor="middle" class="t-muted" xml:space="preserve">and shawarma, which hides that it's a dessert.</text><text x="350" y="8" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">2. Two numbers per food</text><text x="350" y="26" font-size="12.5" class="t-muted" xml:space="preserve">+ dessertness</text><rect x="396" y="66" width="220" height="220" rx="2" class="s-grey" fill="none" stroke-width="1"/><line x1="396" y1="176" x2="616" y2="176" class="axis" stroke-width="1"/><line x1="506" y1="66" x2="506" y2="286" class="axis" stroke-width="1"/><text x="616" y="304" font-size="12" text-anchor="end" class="t-muted" xml:space="preserve">sandwichness</text><text x="386" y="66" font-size="12" text-anchor="end" transform="rotate(-90 386 66)" class="t-muted" xml:space="preserve">dessertness</text><text x="610" y="82" font-size="12" text-anchor="end" font-style="italic" class="t-muted" xml:space="preserve">dessert corner</text><circle cx="418" cy="214.5" r="5" class="s-grey" fill="none" stroke-width="1.5"/><text x="418" y="202.5" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">borscht</text><circle cx="451" cy="253" r="5" class="s-grey" fill="none" stroke-width="1.5"/><text x="451" y="273" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">salad</text><circle cx="484" cy="209" r="5" class="s-grey" fill="none" stroke-width="1.5"/><text x="484" y="197" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">pizza</text><circle cx="528" cy="231" r="5.5" class="f-blue"/><rect class="bg" x="490" y="238" width="76" height="34" opacity="0.85"/><text x="528" y="251" font-size="13" text-anchor="middle" font-weight="600" class="t-ink" xml:space="preserve">hot dog</text><text x="528" y="267" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">(0.2, –0.5)</text><circle cx="577.5" cy="242" r="5" class="s-blue" fill="none" stroke-width="1.5"/><text x="577.5" y="230" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">shawarma</text><circle cx="561" cy="143" r="5.5" class="f-orange"/><rect class="bg" x="523" y="104" width="76" height="34" opacity="0.85"/><text x="561" y="117" font-size="13" text-anchor="middle" font-weight="600" class="t-ink" xml:space="preserve">apple strudel</text><text x="561" y="133" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">(0.5, 0.3)</text><text x="676" y="8" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">3. Three numbers per food</text><text x="676" y="26" font-size="12.5" class="t-muted" xml:space="preserve">+ liquidness</text><line x1="766" y1="170" x2="946" y2="170" class="grid" stroke-width="1" stroke-dasharray="5 4"/><line x1="766" y1="170" x2="766" y2="40" class="grid" stroke-width="1" stroke-dasharray="5 4"/><line x1="706" y1="260" x2="766" y2="170" class="grid" stroke-width="1" stroke-dasharray="5 4"/><line x1="706" y1="260" x2="886" y2="260" class="axis" stroke-width="1"/><line x1="706" y1="260" x2="706" y2="130" class="axis" stroke-width="1"/><line x1="886" y1="260" x2="886" y2="130" class="axis" stroke-width="1"/><line x1="706" y1="130" x2="886" y2="130" class="axis" stroke-width="1"/><line x1="886" y1="260" x2="946" y2="170" class="axis" stroke-width="1"/><line x1="886" y1="130" x2="946" y2="40" class="axis" stroke-width="1"/><line x1="706" y1="130" x2="766" y2="40" class="axis" stroke-width="1"/><line x1="946" y1="170" x2="946" y2="40" class="axis" stroke-width="1"/><line x1="766" y1="40" x2="946" y2="40" class="axis" stroke-width="1"/><text x="886" y="278" font-size="12" text-anchor="end" class="t-muted" xml:space="preserve">sandwichness</text><text x="696" y="170" font-size="12" text-anchor="middle" transform="rotate(-90 696 170)" class="t-muted" xml:space="preserve">dessertness</text><text x="926" y="219" font-size="12" transform="rotate(-56 926 219)" class="t-muted" xml:space="preserve">liquidness</text><line x1="781" y1="132.25" x2="781" y2="174.5" class="grid" stroke-width="1" stroke-dasharray="5 4"/><circle cx="781" cy="132.25" r="5" class="s-purple" fill="none" stroke-width="1.5"/><text x="791" y="124.25" font-size="13" font-weight="600" class="t-purple" xml:space="preserve">borscht</text><line x1="763" y1="222.5" x2="763" y2="242" class="grid" stroke-width="1" stroke-dasharray="5 4"/><circle cx="763" cy="222.5" r="5" class="s-grey" fill="none" stroke-width="1.5"/><line x1="787" y1="201" x2="787" y2="246.5" class="grid" stroke-width="1" stroke-dasharray="5 4"/><circle cx="787" cy="201" r="5" class="s-grey" fill="none" stroke-width="1.5"/><line x1="820" y1="218.5" x2="820" y2="251" class="grid" stroke-width="1" stroke-dasharray="5 4"/><circle cx="820" cy="218.5" r="5" class="s-blue" fill="none" stroke-width="1.5"/><line x1="860.5" y1="225" x2="860.5" y2="251" class="grid" stroke-width="1" stroke-dasharray="5 4"/><circle cx="860.5" cy="225" r="5" class="s-blue" fill="none" stroke-width="1.5"/><line x1="853" y1="157.5" x2="853" y2="242" class="grid" stroke-width="1" stroke-dasharray="5 4"/><circle cx="853" cy="157.5" r="5" class="s-orange" fill="none" stroke-width="1.5"/><text x="853" y="145.5" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">apple strudel</text><text x="826" y="304" font-size="12.5" text-anchor="middle" class="t-muted" xml:space="preserve">Borscht is the liquid one, so it</text><text x="826" y="322" font-size="12.5" text-anchor="middle" class="t-muted" xml:space="preserve">moves away from the rest.</text><line x1="24" y1="334" x2="976" y2="334" class="grid" stroke-width="1"/><circle cx="30" cy="356" r="5.5" class="f-ink"/><text x="42" y="356" font-size="12.5" dominant-baseline="central" class="t-muted" xml:space="preserve">coordinates given in the course</text><circle cx="254" cy="356" r="5" class="s-ink" fill="none" stroke-width="1.5"/><text x="266" y="356" font-size="12.5" dominant-baseline="central" class="t-muted" xml:space="preserve">placed by us in the course's order (illustrative, not data)</text><text x="24" y="380" font-size="12.5" font-weight="600" class="t-ink" xml:space="preserve">Real embeddings have hundreds or thousands of axes, and the axes have no names.</text></g>
<text x="24" y="455" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from Google's Machine Learning Crash Course, Embeddings (Figures 3-5).</text>
