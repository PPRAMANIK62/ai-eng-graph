<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 1018 254" width="1018" height="254" role="img" aria-labelledby="fig-15pctcn-t fig-15pctcn-d">
<title id="fig-15pctcn-t">GPT-2 cuts numbers into clumps that ignore place value</title>
<desc id="fig-15pctcn-d">Six numbers as GPT-2 tokens. 127 is one token. 677 is space-6 plus 77, 804 is space-8 plus 04, 1275 is 12 plus 75, 6773 is space-6 plus 773, and 8041 is space-8 plus 041. Each piece has its own id underneath.</desc>
