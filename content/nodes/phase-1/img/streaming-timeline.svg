<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 980 466" width="980" height="466" role="img" aria-labelledby="fig-8e67h2-t fig-8e67h2-d">
<title id="fig-8e67h2-t">One POST, then the reply arrives as a series of events</title>
<desc id="fig-8e67h2-d">A timeline of one streamed Claude reply. Your app sends one POST. The API sends back events over time: message_start, content_block_start, a ping, a text delta &quot;Hello&quot;, a text delta &quot;!&quot;, content_block_stop, message_delta with stop reason end_turn, and message_stop. Below, the text on screen goes from empty to &quot;Hello&quot; to &quot;Hello!&quot;. The gap before the first text delta is the time to first text; the whole span takes as long as it would without streaming.</desc>
<style>
.fig{--bg:var(--t-surface,#ffffff);--ink:var(--t-ink,#0d1117);--muted:var(--t-ink-2,#4a5261);--line:var(--t-ink-3,#8a93a0);--grid:var(--t-rule,#dde1e7);--blue:var(--line-1,#0065bd);--orange:var(--line-3,#f26b1d);--green:var(--line-2,#00a650);--red:var(--line-0,#e4002b);--purple:var(--line-4,#8a3fa0);--grey:var(--t-ink-3,#8a93a0);--blue-soft:var(--line-1-soft,#dcebf8);--orange-soft:var(--line-3-soft,#fde6d8);--green-soft:var(--line-2-soft,#d6f2e2);--red-soft:var(--line-0-soft,#fbd9df);--purple-soft:var(--line-4-soft,#eedff3);--grey-soft:var(--t-panel,#f3f5f8);--ink-soft:var(--t-panel,#f3f5f8);--muted-soft:var(--t-panel,#f3f5f8)}
