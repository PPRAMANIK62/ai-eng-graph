text x="522" y="142" font-size="11.5" text-anchor="end" dominant-baseline="central" class="t-muted" xml:space="preserve">15</text><line x1="530" y1="100" x2="890" y2="100" class="grid" stroke-width="1"/><text x="522" y="100" font-size="11.5" text-anchor="end" dominant-baseline="central" class="t-muted" xml:space="preserve">20</text><line x1="530" y1="58" x2="890" y2="58" class="grid" stroke-width="1"/><text x="522" y="58" font-size="11.5" text-anchor="end" dominant-baseline="central" class="t-muted" xml:space="preserve">25</text><rect x="550.38" y="255.4" width="47.55" height="12.6" rx="2" class="f-grey"/><text x="574.15" y="249.4" font-size="12.5" text-anchor="middle" font-weight="600" class="t-grey" xml:space="preserve">1.50</text><text x="574.15" y="286" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">Greedy</text><rect x="618.3" y="255.57" width="47.55" height="12.43" rx="2" class="f-grey"/><text x="642.08" y="249.57" font-size="12.5" text-anchor="middle" font-weight="600" class="t-grey" xml:space="preserve">1.48</text><text x="642.08" y="286" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">Beam</text><rect x="686.23" y="77.07" width="47.55" height="190.93" rx="2" class="f-grey"/><text x="710" y="71.07" font-size="12.5" text-anchor="middle" font-weight="600" class="t-grey" xml:space="preserve">22.73</text><text x="710" y="286" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">Pure</text><rect x="754.15" y="157.71" width="47.55" height="110.29" rx="2" class="f-blue"/><text x="777.92" y="151.71" font-size="12.5" text-anchor="middle" font-weight="600" class="t-blue" xml:space="preserve">13.13</text><text x="777.92" y="286" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">Top-p</text><rect x="822.08" y="164.01" width="47.55" height="103.99" rx="2" class="f-green"/><text x="845.85" y="158.01" font-size="12.5" text-anchor="middle" font-weight="600" class="t-green" xml:space="preserve">12.38</text><text x="845.85" y="286" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">Human</text><line x1="530" y1="268" x2="890" y2="268" class="axis" stroke-width="1.5"/><line x1="530" y1="164.01" x2="890" y2="164.01" class="s-green" stroke-width="1.5" stroke-dasharray="5 4"/><text x="896" y="164.01" font-size="12" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">human</text><text x="70" y="316" font-size="12.5" class="t-muted" xml:space="preserve">Beam = beam search with 16 beams. Pure = sampling from the full list. Top-p = sampling from the smallest set covering 95% of the probability.</text></g>
<text x="24" y="389" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Data: Holtzman et al., &quot;The Curious Case of Neural Text Degeneration&quot; (2020), Table 1. GPT-2 Large, 2019.</text>
