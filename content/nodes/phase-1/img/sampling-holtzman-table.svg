<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="fig-lvm3or-t fig-lvm3or-d">
<title id="fig-lvm3or-t">Too predictable, too random, or close to human: 5,000 GPT-2 Large passages</title>
<desc id="fig-lvm3or-d">Two bar charts from Holtzman et al. on GPT-2 Large. Share of passages stuck repeating: greedy 73.66%, beam search 28.94%, pure sampling 0.22%, top-p 0.36%, human text 0.28%. Perplexity: greedy 1.50, beam 1.48, pure sampling 22.73, top-p 13.13, against human text at 12.38. Only top-p lands near the human value on both.</desc>
<style>
