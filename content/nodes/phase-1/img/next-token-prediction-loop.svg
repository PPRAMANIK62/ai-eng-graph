<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 959 424" width="959" height="424" role="img" aria-labelledby="fig-1198lcn-t fig-1198lcn-d">
<title id="fig-1198lcn-t">Generation is one step on repeat: predict, pick, append</title>
<desc id="fig-1198lcn-d">The generation loop. The text so far, The best thing about AI is its ability to, goes into the model. The model gives a probability to every token in the vocabulary: learn 4.5%, predict 3.5%, make 3.2%, understand 3.1%, do 2.9%. One token, learn, is picked and appended to the text, and the longer text goes back into the model for the next step.</desc>
<style>
