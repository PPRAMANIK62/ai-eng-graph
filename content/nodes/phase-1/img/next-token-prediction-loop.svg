<g transform="translate(0 44)"><text x="24" y="12" font-size="13" font-weight="600" class="t-muted" xml:space="preserve">1. Text so far (prompt + everything written already)</text><rect x="24" y="26" width="42.08" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="45.04" y="43" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">The</text><rect x="72.08" y="26" width="48.24" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="96.2" y="43" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">best</text><rect x="126.32" y="26" width="52.72" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="152.68" y="43" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">thing</text><rect x="185.04" y="26" width="55.8" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="212.94" y="43" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">about</text><rect x="246.84" y="26" width="35.92" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="264.8" y="43" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">AI</text><rect x="288.76" y="26" width="30.04" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="303.78" y="43" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">is</text><rect x="324.8" y="26" width="37.6" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="343.6" y="43" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">its</text><rect x="368.4" y="26" width="61.68" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="399.24" y="43" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">ability</text><rect x="436.08" y="26" width="33.12" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="452.64" y="43" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">to</text><rect x="479.2" y="26" width="56.72" height="34" rx="6" class="fs-blue s-blue" stroke-width="1.5" stroke-dasharray="5 4"/><text x="507.56" y="43" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">learn</text><text x="545.92" y="43" font-size="13" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">5. appended</text><line x1="119" y1="66" x2="119" y2="144" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="24" y="150" width="190" height="110" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="119" y="195.9" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">2. The model</text><text x="119" y="214.1" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">scores every token</text><line x1="222" y1="205" x2="290" y2="205" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="300" y="114" font-size="13" font-weight="600" class="t-muted" xml:space="preserve">3. One probability for every token in the vocabulary</text><text x="300" y="132" font-size="12.5" class="t-muted" xml:space="preserve">top 5 shown</text><text x="390" y="170.85" font-size="14" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">learn</text><rect x="400" y="159.62" width="234" height="22.45" rx="2" class="f-blue"/><text x="642" y="170.85" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">4.5%</text><text x="390" y="202.92" font-size="14" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">predict</text><rect x="400" y="191.7" width="182" height="22.45" rx="2" class="f-grey"/><text x="590" y="202.92" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-grey" xml:space="preserve">3.5%</text><text x="390" y="235" font-size="14" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">make</text><rect x="400" y="223.77" width="166.4" height="22.45" rx="2" class="f-grey"/><text x="574.4" y="235" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-grey" xml:space="preserve">3.2%</text><text x="390" y="267.08" font-size="14" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">understand</text><rect x="400" y="255.85" width="161.2" height="22.45" rx="2" class="f-grey"/><text x="569.2" y="267.08" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-grey" xml:space="preserve">3.1%</text><text x="390" y="299.15" font-size="14" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">do</text><rect x="400" y="287.92" width="150.8" height="22.45" rx="2" class="f-grey"/><text x="558.8" y="299.15" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-grey" xml:space="preserve">2.9%</text><line x1="400" y1="150" x2="400" y2="320" class="axis" stroke-width="1.5"/><text x="400" y="338" font-size="12.5" font-style="italic" class="t-muted" xml:space="preserve">…and every other token: 82.8% spread thin across the rest</text><rect x="306" y="154.62" width="414" height="32.45" rx="6" class="s-blue" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="732" y="161.85" font-size="13" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">4. picked this time</text><text x="732" y="179.85" font-size="12.5" dominant-baseline="central" class="t-blue" xml:space="preserve">(at random, by weight)</text><path d="M904,170.84905660377356 L935,170.84905660377356 L935,94 L507.56000000000006,94 L507.56000000000006,66" class="s-blue" stroke-width="1.8" fill="none" marker-end="url(#ah-blue)"/><text x="927" y="134.81" font-size="12.5" text-anchor="end" font-style="italic" class="t-blue" xml:space="preserve">repeat</text></g>
<text x="24" y="413" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">GPT-2 probabilities from Stephen Wolfram, What Is ChatGPT Doing … and Why Does It Work? (2023).</text>
