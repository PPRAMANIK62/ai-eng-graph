<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="948" height="460"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">RLHF in two steps: learn a scorer, then chase its score on a leash</text>
<g transform="translate(0 44)"><rect x="24" y="0" width="430" height="380" rx="6" class="s-orange" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="42" y="28" font-size="12.5" font-weight="700" class="t-orange" xml:space="preserve">STEP 1</text><text x="42" y="48" font-size="15" font-weight="700" class="t-ink" xml:space="preserve">Train a reward model on comparisons</text><rect x="42" y="70" width="190" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="137" y="87" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Prompt</text><rect x="42" y="118" width="88" height="44" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="86" y="140" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Answer A</text><rect x="144" y="118" width="88" height="44" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="188" y="140" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Answer B</text><text x="137" y="184" font-size="12.5" text-anchor="middle" font-weight="600" class="t-green" xml:space="preserve">A person picks the better one: B</text><rect x="294" y="86" width="150" height="88" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><rect x="288" y="80" width="150" height="88" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><rect x="282" y="74" width="150" height="88" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="296" y="104" font-size="13" class="t-ink" xml:space="preserve">prompt</text><text x="296" y="123" font-size="13" class="t-ink" xml:space="preserve">winner: B</text><text x="296" y="142" font-size="13" class="t-ink" xml:space="preserve">loser: A</text><line x1="238" y1="140" x2="276" y2="130" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="42" y="214" font-size="12" class="t-muted" xml:space="preserve">Repeat for ~33,000 prompts, each with</text><text x="42" y="230" font-size="12" class="t-muted" xml:space="preserve">4 to 9 answers ranked (InstructGPT, 2022)</text><line x1="363" y1="178" x2="363" y2="260" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="42" y="262" width="394" height="48" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="239" y="286" font-size="15" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Reward model</text><text x="239" y="336" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">Takes a prompt and any answer, returns one score.</text><text x="239" y="356" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">Trained to score the winner above the loser.</text><rect x="494" y="0" width="430" height="380" rx="6" class="s-blue" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="512" y="28" font-size="12.5" font-weight="700" class="t-blue" xml:space="preserve">STEP 2</text><text x="512" y="48" font-size="15" font-weight="700" class="t-ink" xml:space="preserve">Optimize the model against it (RL, PPO)</text><rect x="524" y="70" width="170" height="30" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="609" y="85" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Prompt</text><line x1="609" y1="100" x2="609" y2="108" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="524" y="110" width="170" height="56" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="609" y="138" font-size="14" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Language model</text><line x1="696" y1="138" x2="742" y2="138" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="744" y="116" width="150" height="44" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="819" y="138" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Its answer</text><line x1="819" y1="162" x2="819" y2="208" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="744" y="210" width="150" height="44" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="819" y="232" font-size="13.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Reward model</text><path d="M744,232 L604,232 L604,169" class="s-blue" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/><text x="734" y="224" font-size="12.5" text-anchor="end" font-weight="700" class="t-orange" xml:space="preserve">score</text><text x="734" y="254" font-size="12" text-anchor="end" class="t-blue" xml:space="preserve">update: make high-scoring</text><text x="734" y="270" font-size="12" text-anchor="end" class="t-blue" xml:space="preserve">answers more likely</text><rect x="524" y="316" width="170" height="44" rx="6" class="fs-grey s-grey" stroke-width="1.5" stroke-dasharray="5 4"/><text x="609" y="338" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Starting model (SFT)</text><line x1="552" y1="166" x2="552" y2="316" class="s-red" stroke-width="2.5" stroke-dasharray="5 4"/><text x="708" y="332" font-size="12.5" font-weight="600" class="t-red" xml:space="preserve">Leash: a penalty for drifting</text><text x="708" y="349" font-size="12.5" font-weight="600" class="t-red" xml:space="preserve">too far from the starting model</text></g>
<text x="24" y="449" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from figure 2 of the InstructGPT paper, Ouyang et al. (OpenAI), 2022.</text>
</svg>
