<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 948 460" width="948" height="460" role="img" aria-labelledby="fig-1p29y1w-t fig-1p29y1w-d">
<title id="fig-1p29y1w-t">RLHF in two steps: learn a scorer, then chase its score on a leash</title>
<desc id="fig-1p29y1w-d">The two steps of RLHF. Step 1: a person compares two answers to a prompt and picks B; many of these prompt, winner, loser triples (about 33,000 prompts for InstructGPT) train a reward model that gives any answer one score. Step 2: the language model writes an answer, the reward model scores it, and the score updates the language model, while a penalty keeps it close to the starting model.</desc>
<style>
.fig{--bg:var(--t-surface,#ffffff);--ink:var(--t-ink,#0d1117);--muted:var(--t-ink-2,#4a5261);--line:var(--t-ink-3,#8a93a0);--grid:var(--t-rule,#dde1e7);--blue:var(--line-1,#0065bd);--orange:var(--line-3,#f26b1d);--green:var(--line-2,#00a650);--red:var(--line-0,#e4002b);--purple:var(--line-4,#8a3fa0);--grey:var(--t-ink-3,#8a93a0);--blue-soft:var(--line-1-soft,#dcebf8);--orange-soft:var(--line-3-soft,#fde6d8);--green-soft:var(--line-2-soft,#d6f2e2);--red-soft:var(--line-0-soft,#fbd9df);--purple-soft:var(--line-4-soft,#eedff3);--grey-soft:var(--t-panel,#f3f5f8);--ink-soft:var(--t-panel,#f3f5f8);--muted-soft:var(--t-panel,#f3f5f8)}
