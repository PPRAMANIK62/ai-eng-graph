<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="870" height="426"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">From the raw web to a pretraining dataset: FineWeb (2024)</text>
<g transform="translate(0 44)"><text x="250" y="14" font-size="14" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">Common Crawl</text><text x="250" y="32" font-size="12" text-anchor="end" class="t-muted" xml:space="preserve">96 snapshots of raw web pages</text><rect x="280" y="0" width="460" height="38" rx="6" class="fs-grey s-grey" stroke-width="1.5" stroke-dasharray="5 4"/><text x="510" y="19" font-size="12.5" text-anchor="middle" font-style="italic" dominant-baseline="central" class="t-muted" xml:space="preserve">size not given</text><line x1="510" y1="39" x2="510" y2="55" class="s-muted" stroke-width="1.2" marker-end="url(#ah-muted)"/><text x="250" y="70" font-size="14" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">Extract text</text><text x="250" y="88" font-size="12" text-anchor="end" class="t-muted" xml:space="preserve">readable text pulled out of HTML</text><rect x="280" y="56" width="460" height="38" rx="6" class="fs-grey s-grey" stroke-width="1.5" stroke-dasharray="5 4"/><text x="510" y="75" font-size="12.5" text-anchor="middle" font-style="italic" dominant-baseline="central" class="t-muted" xml:space="preserve">size not given</text><line x1="510" y1="95" x2="510" y2="111" class="s-muted" stroke-width="1.2" marker-end="url(#ah-muted)"/><text x="250" y="126" font-size="14" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">Base filtering</text><text x="250" y="144" font-size="12" text-anchor="end" class="t-muted" xml:space="preserve">URL blocklist, English, quality rules</text><rect x="280" y="112" width="460" height="38" rx="4" class="fs-blue s-blue" stroke-width="1.5"/><text x="752" y="131" font-size="13.5" font-weight="700" dominant-baseline="central" class="t-blue" xml:space="preserve">~36T tokens</text><line x1="510" y1="151" x2="510" y2="167" class="s-muted" stroke-width="1.2" marker-end="url(#ah-muted)"/><text x="250" y="182" font-size="14" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">Dedup each snapshot</text><text x="250" y="200" font-size="12" text-anchor="end" class="t-muted" xml:space="preserve">repeated pages removed</text><rect x="382.22" y="168" width="255.56" height="38" rx="4" class="fs-blue s-blue" stroke-width="1.5"/><text x="649.78" y="187" font-size="13.5" font-weight="700" dominant-baseline="central" class="t-blue" xml:space="preserve">~20T tokens</text><line x1="510" y1="207" x2="510" y2="223" class="s-muted" stroke-width="1.2" marker-end="url(#ah-muted)"/><text x="250" y="238" font-size="14" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">Extra quality filters</text><text x="250" y="256" font-size="12" text-anchor="end" class="t-blue" xml:space="preserve">result: FineWeb</text><rect x="414.17" y="224" width="191.67" height="38" rx="4" class="fs-blue s-blue" stroke-width="1.5"/><text x="617.83" y="243" font-size="13.5" font-weight="700" dominant-baseline="central" class="t-blue" xml:space="preserve">15T tokens</text><line x1="510" y1="263" x2="510" y2="279" class="s-muted" stroke-width="1.2" marker-end="url(#ah-muted)"/><text x="250" y="294" font-size="14" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">Educational classifier</text><text x="250" y="312" font-size="12" text-anchor="end" class="t-green" xml:space="preserve">result: FineWeb-Edu</text><rect x="501.69" y="280" width="16.61" height="38" rx="4" class="fs-green s-green" stroke-width="1.5"/><text x="530.31" y="299" font-size="13.5" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">1.3T tokens</text><text x="510" y="344" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">Bar width = number of tokens (GPT-2 tokenizer), to scale.</text></g>
<text x="24" y="415" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from the FineWeb paper, Penedo et al. (Hugging Face), 2024.</text>
</svg>
