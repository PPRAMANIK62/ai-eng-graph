<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 870 426" width="870" height="426" role="img" aria-labelledby="fig-hlvwyc-t fig-hlvwyc-d">
<title id="fig-hlvwyc-t">From the raw web to a pretraining dataset: FineWeb (2024)</title>
<desc id="fig-hlvwyc-d">The FineWeb pipeline as a funnel. 96 Common Crawl snapshots go through text extraction and base filtering to about 36 trillion tokens, per-snapshot deduplication to about 20 trillion, extra filters to FineWeb at 15 trillion, and an educational classifier to FineWeb-Edu at 1.3 trillion.</desc>
<style>
.fig{--bg:var(--t-surface,#ffffff);--ink:var(--t-ink,#0d1117);--muted:var(--t-ink-2,#4a5261);--line:var(--t-ink-3,#8a93a0);--grid:var(--t-rule,#dde1e7);--blue:var(--line-1,#0065bd);--orange:var(--line-3,#f26b1d);--green:var(--line-2,#00a650);--red:var(--line-0,#e4002b);--purple:var(--line-4,#8a3fa0);--grey:var(--t-ink-3,#8a93a0);--blue-soft:var(--line-1-soft,#dcebf8);--orange-soft:var(--line-3-soft,#fde6d8);--green-soft:var(--line-2-soft,#d6f2e2);--red-soft:var(--line-0-soft,#fbd9df);--purple-soft:var(--line-4-soft,#eedff3);--grey-soft:var(--t-panel,#f3f5f8);--ink-soft:var(--t-panel,#f3f5f8);--muted-soft:var(--t-panel,#f3f5f8)}
@media (prefers-color-scheme: dark){.fig{--bg:var(--t-surface,#161b23);--ink:var(--t-ink,#eef1f5);--muted:var(--t-ink-2,#a9b2bf);--line:var(--t-ink-3,#6c7686);--grid:var(--t-rule,#2a313c);--blue:var(--line-1,#3f8dff);--orange:var(--line-3,#ff8a3d);--green:var(--line-2,#20c46b);--red:var(--line-0,#ff4458);--purple:var(--line-4,#b673d6);--grey:var(--t-ink-3,#6c7686);--blue-soft:var(--line-1-soft,#132a4a);--orange-soft:var(--line-3-soft,#3d2210);--green-soft:var(--line-2-soft,#0f3320);--red-soft:var(--line-0-soft,#40121a);--purple-soft:var(--line-4-soft,#2e1a3a);--grey-soft:var(--t-panel,#1b212b);--ink-soft:var(--t-panel,#1b212b);--muted-soft:var(--t-panel,#1b212b)}}
.fig .bg{fill:var(--bg)}
.fig text{font-family:var(--transit-text), 'Public Sans', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;fill:var(--ink)}
.fig .display{font-family:var(--transit-sign), Overpass, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif}
.fig .mono{font-family:'JetBrains Mono', 'Noto Sans Mono', Menlo, Consolas, monospace}
.fig .grid{stroke:var(--grid)}
.fig .axis{stroke:var(--line)}
.fig .f-ink{fill:var(--ink)}.fig .s-ink{stroke:var(--ink)}.fig .fs-ink{fill:var(--ink-soft)}.fig .t-ink{fill:var(--ink)}
.fig .f-muted{fill:var(--muted)}.fig .s-muted{stroke:var(--muted)}.fig .fs-muted{fill:var(--muted-soft)}.fig .t-muted{fill:var(--muted)}
.fig .f-blue{fill:var(--blue)}.fig .s-blue{stroke:var(--blue)}.fig .fs-blue{fill:var(--blue-soft)}.fig .t-blue{fill:var(--blue)}
.fig .f-orange{fill:var(--orange)}.fig .s-orange{stroke:var(--orange)}.fig .fs-orange{fill:var(--orange-soft)}.fig .t-orange{fill:var(--orange)}
.fig .f-green{fill:var(--green)}.fig .s-green{stroke:var(--green)}.fig .fs-green{fill:var(--green-soft)}.fig .t-green{fill:var(--green)}
.fig .f-red{fill:var(--red)}.fig .s-red{stroke:var(--red)}.fig .fs-red{fill:var(--red-soft)}.fig .t-red{fill:var(--red)}
.fig .f-purple{fill:var(--purple)}.fig .s-purple{stroke:var(--purple)}.fig .fs-purple{fill:var(--purple-soft)}.fig .t-purple{fill:var(--purple)}
