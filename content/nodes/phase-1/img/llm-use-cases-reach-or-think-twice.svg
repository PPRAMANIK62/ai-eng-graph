<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 992 426" width="992" height="426" role="img" aria-labelledby="fig-12044c0-t fig-12044c0-d">
<title id="fig-12044c0-t">Should an LLM do this job? The whole article on one card</title>
<desc id="fig-12044c0-d">A two-column summary card. Reach for an LLM for: messy text to structure, classifying with a clear label set, answering from text you give it, drafting and rewriting, and agents with a built-in check such as code or search. Think twice when: the output must be identical every run, it must be factually right with no source given, it's a long chain with no check between steps, or it's a high-volume narrow classification task with labelled data.</desc>
<style>
.fig{--bg:var(--t-surface,#ffffff);--ink:var(--t-ink,#0d1117);--muted:var(--t-ink-2,#4a5261);--line:var(--t-ink-3,#8a93a0);--grid:var(--t-rule,#dde1e7);--blue:var(--line-1,#0065bd);--orange:var(--line-3,#f26b1d);--green:var(--line-2,#00a650);--red:var(--line-0,#e4002b);--purple:var(--line-4,#8a3fa0);--grey:var(--t-ink-3,#8a93a0);--blue-soft:var(--line-1-soft,#dcebf8);--orange-soft:var(--line-3-soft,#fde6d8);--green-soft:var(--line-2-soft,#d6f2e2);--red-soft:var(--line-0-soft,#fbd9df);--purple-soft:var(--line-4-soft,#eedff3);--grey-soft:var(--t-panel,#f3f5f8);--ink-soft:var(--t-panel,#f3f5f8);--muted-soft:var(--t-panel,#f3f5f8)}
