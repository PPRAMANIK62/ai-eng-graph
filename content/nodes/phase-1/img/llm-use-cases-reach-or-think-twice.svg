<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Should an LLM do this job? The whole article on one card</text>
<g transform="translate(0 44)"><rect x="24" y="0" width="460" height="366" rx="8" class="s-green" fill="none" stroke-width="1.5"/><rect x="24" y="0" width="460" height="38" rx="8" class="fs-green"/><text x="42" y="19" font-size="16" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">Reach for it</text><text x="42" y="60" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">Messy text to structure</text><text x="42" y="80" font-size="12.5" class="t-muted" xml:space="preserve">One call replaces the regexes and hand-written rules</text><text x="466" y="60" font-size="12" text-anchor="end" class="t-blue" xml:space="preserve">see: Structured output</text><line x1="40" y1="102" x2="468" y2="102" class="grid" stroke-width="1"/><text x="42" y="122" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">Classifying with a clear label set</text><text x="42" y="142" font-size="12.5" class="t-muted" xml:space="preserve">The answer is one label from a list you give it</text><line x1="40" y1="164" x2="468" y2="164" class="grid" stroke-width="1"/><text x="42" y="184" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">Answering from text you give it</text><text x="42" y="204" font-size="12.5" class="t-muted" xml:space="preserve">Give it the document; don't rely on what it remembers</text><text x="466" y="184" font-size="12" text-anchor="end" class="t-blue" xml:space="preserve">see: Grounding</text><line x1="40" y1="226" x2="468" y2="226" class="grid" stroke-width="1"/><text x="42" y="246" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">Drafting and rewriting</text><text x="42" y="266" font-size="12.5" class="t-muted" xml:space="preserve">Drafts, summaries, translations, changes in tone</text><line x1="40" y1="288" x2="468" y2="288" class="grid" stroke-width="1"/><text x="42" y="308" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">Agents with a built-in check</text><text x="42" y="328" font-size="12.5" class="t-muted" xml:space="preserve">Coding and search: it runs the code or reads the results</text><rect x="508" y="0" width="460" height="366" rx="8" class="s-red" fill="none" stroke-width="1.5"/><rect x="508" y="0" width="460" height="38" rx="8" class="fs-red"/><text x="526" y="19" font-size="16" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">Think twice</text><text x="526" y="60" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">Must be identical every run</text><text x="526" y="80" font-size="12.5" class="t-muted" xml:space="preserve">1,000 runs at temperature 0 gave 80 different completions</text><text x="950" y="60" font-size="12" text-anchor="end" class="t-blue" xml:space="preserve">see: Temperature</text><line x1="524" y1="102" x2="952" y2="102" class="grid" stroke-width="1"/><text x="526" y="122" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">Must be right with no source given</text><text x="526" y="142" font-size="12.5" class="t-muted" xml:space="preserve">Factual errors in 5 to 10% of outputs, a 2024 baseline</text><text x="950" y="122" font-size="12" text-anchor="end" class="t-blue" xml:space="preserve">see: Hallucination</text><line x1="524" y1="164" x2="952" y2="164" class="grid" stroke-width="1"/><text x="526" y="184" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">Long chains with no check between steps</text><text x="526" y="204" font-size="12.5" class="t-muted" xml:space="preserve">95% per step, 20 steps in a row: about 36% finish</text><line x1="524" y1="226" x2="952" y2="226" class="grid" stroke-width="1"/><text x="526" y="246" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">High-volume, narrow, with labelled data</text><text x="526" y="266" font-size="12.5" class="t-muted" xml:space="preserve">A fine-tuned 400M model hit ROC-AUC 0.84 at under 5% of the cost</text><text x="950" y="246" font-size="12" text-anchor="end" class="t-blue" xml:space="preserve">see: Fine-tuning</text></g>

</svg>
