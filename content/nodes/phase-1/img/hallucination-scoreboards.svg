<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="fig-1la7isr-t fig-1la7isr-d">
<title id="fig-1la7isr-t">Ten questions, the model knows 3: the grading decides whether guessing pays</title>
<desc id="fig-1la7isr-d">Two scoreboards for the same ten questions, where the model truly knows 3 answers. The guesser answers all ten and gets 4 right and 6 wrong. The honest model answers 3 and says I don't know to 7. With binary grading the guesser scores 4 and the honest model 3, so guessing wins. With a penalty of 9 points per wrong answer the guesser scores 4 minus 54, which is minus 50, and the honest model still scores 3.</desc>
