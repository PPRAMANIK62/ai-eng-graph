<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 976 364" width="976" height="364" role="img" aria-labelledby="fig-1x855kf-t fig-1x855kf-d">
<title id="fig-1x855kf-t">Post-training recipes: the same building blocks in different orders</title>
<desc id="fig-1x855kf-d">Three post-training recipes drawn as pipelines from base model to assistant. InstructGPT (2022): SFT, reward model, RL with PPO. Tulu 3 (2024): SFT, DPO, RL with verifiable rewards. DeepSeek-R1 (2025): small SFT, RL on reasoning, more SFT, then RL for reasoning, helpfulness and safety. Same building blocks, different orders, and RL on checkable answers takes a bigger share over time.</desc>
