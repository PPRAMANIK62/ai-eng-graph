<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 760 354" width="760" height="354" role="img" aria-labelledby="fig-1lcroak-t fig-1lcroak-d">
<title id="fig-1lcroak-t">The lookup gives one vector; the layers after it move it depending on context</title>
<desc id="fig-1lcroak-d">Sketch, not real data. The looked-up vector for orange sits among colours like red, blue and yellow. In 'She wore an orange scarf' the layers after the lookup keep it among the colours. In 'He squeezed an orange for juice' they move it over near juice, lemon and apple.</desc>
