 markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="820" height="426"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">An expert role doesn't raise accuracy, and the wrong role can lower it</text>
<g transform="translate(0 44)"><text x="104" y="8" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">Persona in the prompt</text><text x="450" y="8" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">Accuracy vs. no persona</text><circle cx="58" cy="73" r="26" class="fs-grey s-grey" stroke-width="1.5"/><circle cx="58" cy="66" r="7" class="f-grey"/><path d="M46,87 Q58,69 70,87" class="f-grey"/><circle cx="77" cy="90" r="10" class="bg s-grey" stroke-width="1.5"/><path d="M72.5,90 L76,93.5 L82,86.5" class="s-grey" stroke-width="2" fill="none"/><text x="104" y="53" font-size="15" font-weight="700" class="t-ink" xml:space="preserve">Matching expert</text><text x="104" y="75" font-size="12.5" font-style="italic" class="t-muted" xml:space="preserve">&quot;You are a world-class expert in</text><text x="104" y="93" font-size="12.5" font-style="italic" class="t-muted" xml:space="preserve">physics...&quot; on physics questions</text><line x1="450" y1="73" x2="560" y2="73" class="s-muted" stroke-width="2.2" marker-end="url(#ah-muted)"/><text x="590" y="67" font-size="14" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">No significant change</text><text x="590" y="87" font-size="12.5" dominant-baseline="central" class="t-muted" xml:space="preserve">except Gemini 2.0 Flash</text><line x1="24" y1="116" x2="796" y2="116" class="grid" stroke-width="1"/><circle cx="58" cy="159" r="26" class="fs-orange s-orange" stroke-width="1.5"/><circle cx="58" cy="152" r="7" class="f-orange"/><path d="M46,173 Q58,155 70,173" class="f-orange"/><circle cx="77" cy="176" r="10" class="bg s-orange" stroke-width="1.5"/><text x="77" y="176.5" font-size="12" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-orange" xml:space="preserve">≠</text><text x="104" y="139" font-size="15" font-weight="700" class="t-ink" xml:space="preserve">Wrong-field expert</text><text x="104" y="161" font-size="12.5" font-style="italic" class="t-muted" xml:space="preserve">A physics expert on</text><text x="104" y="179" font-size="12.5" font-style="italic" class="t-muted" xml:space="preserve">law questions</text><line x1="450" y1="153" x2="560" y2="165" class="s-orange" stroke-width="2.2" marker-end="url(#ah-orange)"/><text x="590" y="153" font-size="14" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">Sometimes worse</text><text x="590" y="173" font-size="12.5" dominant-baseline="central" class="t-muted" xml:space="preserve">small differences</text><line x1="24" y1="202" x2="796" y2="202" class="grid" stroke-width="1"/><circle cx="58" cy="245" r="26" class="fs-red s-red" stroke-width="1.5"/><circle cx="58" cy="238" r="7" class="f-red"/><path d="M46,259 Q58,241 70,259" class="f-red"/><circle cx="77" cy="262" r="10" class="bg s-red" stroke-width="1.5"/><text x="77" y="262.5" font-size="12" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">?</text><text x="104" y="225" font-size="15" font-weight="700" class="t-ink" xml:space="preserve">Low-knowledge persona</text><text x="104" y="247" font-size="12.5" font-style="italic" class="t-muted" xml:space="preserve">&quot;You are a 4-year-old toddler who</text><text x="104" y="265" font-size="12.5" font-style="italic" class="t-muted" xml:space="preserve">thinks the moon is made of cheese.&quot;</text><line x1="450" y1="232" x2="560" y2="258" class="s-red" stroke-width="2.2" marker-end="url(#ah-red)"/><text x="590" y="246" font-size="14" font-weight="600" dominant-baseline="central" class="t-red" xml:space="preserve">Often worse</text><rect x="24" y="302" width="772" height="50" rx="6" class="fs-grey"/><text x="38" y="322" font-size="12.5" class="t-muted" xml:space="preserve">2025, GPQA Diamond and MMLU-Pro, 25 runs per question: GPT-4o, GPT-4o-mini, o3-mini, o4-mini,</text><text x="38" y="340" font-size="12.5" class="t-muted" xml:space="preserve">Gemini 2.0 Flash, Gemini 2.5 Flash. Arrows show direction only, not the size of the change.</text></g>
<text x="24" y="415" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Based on Basil et al. (Wharton), 2025, &quot;Playing Pretend&quot;.</text>
</svg>
