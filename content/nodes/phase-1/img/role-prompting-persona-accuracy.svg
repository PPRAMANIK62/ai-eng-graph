<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 820 426" width="820" height="426" role="img" aria-labelledby="fig-126xm36-t fig-126xm36-d">
<title id="fig-126xm36-t">An expert role doesn't raise accuracy, and the wrong role can lower it</title>
<desc id="fig-126xm36-d">Three personas and what they did to accuracy on hard multiple-choice questions in a 2025 study. A matching expert persona left accuracy flat. An expert from the wrong field sometimes made it slightly worse. A low-knowledge persona, a 4-year-old toddler, often made it worse.</desc>
<style>
.fig{--bg:var(--t-surface,#ffffff);--ink:var(--t-ink,#0d1117);--muted:var(--t-ink-2,#4a5261);--line:var(--t-ink-3,#8a93a0);--grid:var(--t-rule,#dde1e7);--blue:var(--line-1,#0065bd);--orange:var(--line-3,#f26b1d);--green:var(--line-2,#00a650);--red:var(--line-0,#e4002b);--purple:var(--line-4,#8a3fa0);--grey:var(--t-ink-3,#8a93a0);--blue-soft:var(--line-1-soft,#dcebf8);--orange-soft:var(--line-3-soft,#fde6d8);--green-soft:var(--line-2-soft,#d6f2e2);--red-soft:var(--line-0-soft,#fbd9df);--purple-soft:var(--line-4-soft,#eedff3);--grey-soft:var(--t-panel,#f3f5f8);--ink-soft:var(--t-panel,#f3f5f8);--muted-soft:var(--t-panel,#f3f5f8)}
