<g transform="translate(0 44)"><line x1="92.67" y1="231" x2="92.67" y2="241" class="axis" stroke-width="1.5"/><text x="92.67" y="256" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">2023</text><line x1="303.33" y1="231" x2="303.33" y2="241" class="axis" stroke-width="1.5"/><text x="303.33" y="256" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">2024</text><line x1="514" y1="231" x2="514" y2="241" class="axis" stroke-width="1.5"/><text x="514" y="256" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">2025</text><line x1="724.67" y1="231" x2="724.67" y2="241" class="axis" stroke-width="1.5"/><text x="724.67" y="256" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">2026</text><line x1="40" y1="236" x2="830" y2="236" class="axis" stroke-width="2"/><line x1="57.56" y1="162" x2="57.56" y2="236" class="s-grey" stroke-width="1"/><circle cx="57.56" cy="236" r="5" class="f-ink"/><text x="64.56" y="166" font-size="12.5" font-weight="700" class="t-ink" xml:space="preserve">2022-11</text><text x="64.56" y="183" font-size="12.5" class="t-ink" xml:space="preserve">ChatGPT's consumer product</text><text x="64.56" y="199" font-size="12.5" class="t-ink" xml:space="preserve">launches</text><line x1="391.11" y1="14" x2="391.11" y2="236" class="s-grey" stroke-width="1"/><circle cx="391.11" cy="236" r="5" class="f-ink"/><text x="398.11" y="18" font-size="12.5" font-weight="700" class="t-ink" xml:space="preserve">2024-06</text><text x="398.11" y="35" font-size="12.5" class="t-ink" xml:space="preserve">Practitioners: LLM apps are brittle; keep a</text><text x="398.11" y="51" font-size="12.5" class="t-ink" xml:space="preserve">human in charge, prefer fixed workflows over</text><text x="398.11" y="67" font-size="12.5" class="t-ink" xml:space="preserve">agents</text><line x1="443.78" y1="88" x2="443.78" y2="236" class="s-grey" stroke-width="1"/><circle cx="443.78" cy="236" r="5" class="f-ink"/><text x="450.78" y="92" font-size="12.5" font-weight="700" class="t-ink" xml:space="preserve">2024-09</text><text x="450.78" y="109" font-size="12.5" class="t-ink" xml:space="preserve">OpenAI's o1 starts the</text><text x="450.78" y="125" font-size="12.5" class="t-ink" xml:space="preserve">reasoning-model wave</text><line x1="531.56" y1="162" x2="531.56" y2="236" class="s-grey" stroke-width="1"/><circle cx="531.56" cy="236" r="5" class="f-ink"/><text x="538.56" y="166" font-size="12.5" font-weight="700" class="t-ink" xml:space="preserve">2025-02</text><text x="538.56" y="183" font-size="12.5" class="t-ink" xml:space="preserve">Claude Code released;</text><text x="538.56" y="199" font-size="12.5" class="t-ink" xml:space="preserve">coding agents take off</text><line x1="707.11" y1="14" x2="707.11" y2="236" class="s-grey" stroke-width="1"/><circle cx="707.11" cy="236" r="5" class="f-ink"/><text x="714.11" y="18" font-size="12.5" font-weight="700" class="t-ink" xml:space="preserve">2025-12</text><text x="714.11" y="35" font-size="12.5" class="t-ink" xml:space="preserve">Claude Code credited with</text><text x="714.11" y="51" font-size="12.5" class="t-ink" xml:space="preserve">$1bn run-rate revenue</text><line x1="812.44" y1="88" x2="812.44" y2="236" class="s-grey" stroke-width="1"/><circle cx="812.44" cy="236" r="5" class="f-ink"/><text x="819.44" y="92" font-size="12.5" font-weight="700" class="t-ink" xml:space="preserve">2026-06</text><text x="819.44" y="109" font-size="12.5" class="t-ink" xml:space="preserve">Claude sessions are</text><text x="819.44" y="125" font-size="12.5" class="t-ink" xml:space="preserve">more and more</text><text x="819.44" y="141" font-size="12.5" class="t-ink" xml:space="preserve">long-running agentic</text><text x="819.44" y="157" font-size="12.5" class="t-ink" xml:space="preserve">tasks</text><rect x="303.33" y="270" width="208.67" height="44" rx="4" class="fs-purple s-purple" stroke-width="1"/><text x="311.33" y="287" font-size="12" class="t-purple" xml:space="preserve">2024: cost of a given capability</text><text x="311.33" y="302" font-size="12" class="t-purple" xml:space="preserve">halves about every 6 months</text><rect x="514" y="270" width="208.67" height="44" rx="4" class="fs-purple s-purple" stroke-width="1"/><text x="522" y="287" font-size="12" class="t-purple" xml:space="preserve">2025: agents work for coding</text><text x="522" y="302" font-size="12" class="t-purple" xml:space="preserve">and search; multi-hour tasks</text><text x="40" y="328" font-size="12" font-style="italic" class="t-muted" xml:space="preserve">Rough eras (our summary of the sources)</text><rect x="57.56" y="336" width="331.56" height="48" rx="4" class="fs-grey s-grey" stroke-width="1"/><text x="67.56" y="364" font-size="12.5" font-weight="600" class="t-ink" xml:space="preserve">Mostly chat: a person asks, the model answers</text><rect x="391.11" y="336" width="138.44" height="48" rx="4" class="fs-blue s-blue" stroke-width="1"/><text x="401.11" y="356" font-size="12.5" font-weight="600" class="t-blue" xml:space="preserve">Fixed workflows,</text><text x="401.11" y="372" font-size="12.5" font-weight="600" class="t-blue" xml:space="preserve">human in charge</text><rect x="531.56" y="336" width="296.44" height="48" rx="4" class="fs-green s-green" stroke-width="1"/><text x="541.56" y="356" font-size="12.5" font-weight="600" class="t-green" xml:space="preserve">Agents, where each step</text><text x="541.56" y="372" font-size="12.5" font-weight="600" class="t-green" xml:space="preserve">can be checked (code, search)</text></g>
<text x="24" y="455" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Built from Willison (2025), Yan et al. (2024), Chatterji et al. (2025) and Anthropic (2026).</text>
