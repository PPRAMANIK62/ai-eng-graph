<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 1000 466" width="1000" height="466" role="img" aria-labelledby="fig-gz8vo8-t fig-gz8vo8-d">
<title id="fig-gz8vo8-t">What LLMs are “for” has a date on it</title>
<desc id="fig-gz8vo8-d">A timeline from 2022-11 to 2026-06. 2022-11: ChatGPT launches. 2024-06: practitioners call LLM apps brittle and advise fixed workflows with a human in charge. 2024-09: o1 starts the reasoning-model wave. 2025-02: Claude Code is released and coding agents take off. 2025-12: Claude Code is credited with $1bn run-rate revenue. 2026-06: Claude sessions are more and more long-running agentic tasks. Underneath, a band moves from chat, to fixed workflows with a human in charge, to agents.</desc>
<style>
