<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 940 288" width="940" height="288" role="img" aria-labelledby="fig-julan4-t fig-julan4-d">
<title id="fig-julan4-t">Why decode is memory-bound: it does too little math per byte</title>
<desc id="fig-julan4-d">A number line of operations per byte read from memory. Decode for Llama 2 7B sits at about 62. The NVIDIA A10 can do about 208 operations per byte. Everything left of 208 is memory-bound, waiting on memory; everything right is compute-bound, waiting on math. Prefill sits far off to the right.</desc>
