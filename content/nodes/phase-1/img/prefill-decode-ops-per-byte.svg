ddle" class="t-muted" xml:space="preserve">300</text><text x="450" y="190" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">operations per byte read from memory</text><line x1="609.35" y1="34" x2="609.35" y2="150" class="s-ink" stroke-width="2"/><text x="609.35" y="16" font-size="13" text-anchor="middle" font-weight="600" class="t-ink" xml:space="preserve">NVIDIA A10 can do about 208</text><line x1="209.47" y1="110" x2="209.47" y2="150" class="s-blue" stroke-width="3"/><text x="209.47" y="16" font-size="13" text-anchor="middle" font-weight="600" class="t-blue" xml:space="preserve">Decode, Llama 2 7B: about 62</text><line x1="209.47" y1="22" x2="209.47" y2="110" class="s-blue" stroke-width="1" stroke-dasharray="5 4"/><line x1="696" y1="126" x2="890" y2="126" class="s-orange" stroke-width="2.5" marker-end="url(#ah-orange)"/><text x="696" y="118" font-size="12.5" font-weight="600" class="t-orange" xml:space="preserve">Prefill: far to the right</text><path d="M209.46666666666664,134 L609.3533333333334,134" class="s-muted" stroke-width="1" fill="none" marker-end="url(#ah-muted)" marker-start="url(#as-muted)"/><text x="409.41" y="128" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">most of the A10's math sits idle</text></g></g>
<text x="24" y="277" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Numbers from Baseten, “A guide to LLM inference and performance” (2025): A10 at 125 TFLOPS and 600 GB/s. Prefill has no number here, only a direction.</text>
