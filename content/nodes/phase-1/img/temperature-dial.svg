<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 760 412" width="760" height="412" role="img" aria-labelledby="fig-120atfl-t fig-120atfl-d">
<title id="fig-120atfl-t">Temperature is a smooth dial: two tokens with scores 1 (A) and 3 (B)</title>
<desc id="fig-120atfl-d">Line chart of the chance of picking B, the token with the higher score (scores 1 and 3), as temperature goes from 0 to 2. It stays near 100% below about 0.3, then falls smoothly: 98% at 0.5, 88% at 1 and 73% at 2, heading toward the 50% of a coin flip.</desc>
