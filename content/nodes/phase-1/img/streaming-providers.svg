y="78" font-size="12" dominant-baseline="central" class="t-ink" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">data: {…&quot;delta&quot;:{&quot;content&quot;:&quot;Why&quot;}…}</text><rect x="814.4" y="89" width="119.2" height="19" rx="3" class="fs-blue s-blue" stroke-width="1.1"/><text x="694" y="100" font-size="12" dominant-baseline="central" class="t-ink" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">data: {…&quot;delta&quot;:{&quot;content&quot;:&quot; did&quot;}…}</text><text x="694" y="122" font-size="12" dominant-baseline="central" class="t-muted" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">…</text><text x="694" y="144" font-size="12" dominant-baseline="central" class="t-ink" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">data: [DONE]</text><text x="684" y="210" font-size="12.5" dominant-baseline="central" font-weight="600" class="t-blue" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">text in: choices[0].delta.content</text></g>
