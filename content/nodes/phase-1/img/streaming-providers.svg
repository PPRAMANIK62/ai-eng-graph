<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 1022 318" width="1022" height="318" role="img" aria-labelledby="fig-pola1c-t fig-pola1c-d">
<title id="fig-pola1c-t">Same SSE envelope, different contents inside</title>
<desc id="fig-pola1c-d">Three columns of raw stream lines. Claude sends named events, with event: and data: lines, and the text sits in a text_delta's text field. OpenAI's Responses API sends typed events such as response.created, response.output_text.delta and response.completed, with the text in a delta field. OpenAI's Chat Completions sends unnamed data: chunks with the text in the first choice's delta.content, and ends with data: [DONE]. The text-bearing field is highlighted in each.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
