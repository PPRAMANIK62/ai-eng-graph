<g transform="translate(0 44)"><line x1="38" y1="324" x2="38" y2="14" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="26" y="167" font-size="12.5" text-anchor="middle" transform="rotate(-90 26 167)" class="t-muted" xml:space="preserve">more authority</text><rect x="70" y="10" width="420" height="50" rx="8" class="fs-purple s-purple" stroke-width="1.5"/><text x="86" y="30" font-size="15" font-weight="700" class="t-purple" xml:space="preserve">Root</text><text x="86" y="48" font-size="12.5" class="t-muted" xml:space="preserve">the spec itself</text><text x="474" y="30" font-size="11.5" text-anchor="end" class="t-muted" xml:space="preserve">overridden by</text><text x="474" y="48" font-size="13" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">nothing</text><line x1="220" y1="61" x2="220" y2="75" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="230" y="68" font-size="11.5" dominant-baseline="central" class="t-muted" xml:space="preserve">overrides</text><rect x="70" y="76" width="420" height="50" rx="8" class="fs-purple s-purple" stroke-width="1.5"/><text x="86" y="96" font-size="15" font-weight="700" class="t-purple" xml:space="preserve">System</text><text x="86" y="114" font-size="12.5" class="t-muted" xml:space="preserve">OpenAI</text><text x="474" y="96" font-size="11.5" text-anchor="end" class="t-muted" xml:space="preserve">overridden by</text><text x="474" y="114" font-size="13" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">root</text><line x1="220" y1="127" x2="220" y2="141" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="70" y="142" width="420" height="50" rx="8" class="fs-blue s-blue" stroke-width="2.5"/><text x="86" y="162" font-size="15" font-weight="700" class="t-blue" xml:space="preserve">Developer</text><text x="86" y="180" font-size="12.5" class="t-muted" xml:space="preserve">you, the app builder</text><text x="474" y="162" font-size="11.5" text-anchor="end" class="t-muted" xml:space="preserve">overridden by</text><text x="474" y="180" font-size="13" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">root, system</text><line x1="220" y1="193" x2="220" y2="207" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="70" y="208" width="420" height="50" rx="8" class="fs-green s-green" stroke-width="1.5"/><text x="86" y="228" font-size="15" font-weight="700" class="t-green" xml:space="preserve">User</text><text x="86" y="246" font-size="12.5" class="t-muted" xml:space="preserve">the person chatting</text><text x="474" y="228" font-size="11.5" text-anchor="end" class="t-muted" xml:space="preserve">overridden by</text><text x="474" y="246" font-size="13" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">developer, system, root</text><line x1="220" y1="259" x2="220" y2="273" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="70" y="274" width="420" height="50" rx="8" class="fs-grey s-grey" stroke-width="1.5"/><text x="86" y="294" font-size="15" font-weight="700" class="t-ink" xml:space="preserve">Guideline</text><text x="86" y="312" font-size="12.5" class="t-muted" xml:space="preserve">defaults</text><text x="474" y="294" font-size="11.5" text-anchor="end" class="t-muted" xml:space="preserve">overridden by</text><text x="474" y="312" font-size="13" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">anyone, even implicitly</text><line x1="534" y1="167" x2="498" y2="167" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><text x="542" y="162" font-size="12.5" font-weight="600" class="t-blue" xml:space="preserve">your instructions go here</text><text x="542" y="180" font-size="12.5" class="t-blue" xml:space="preserve">(on Claude: the system field)</text><rect x="580" y="202" width="220" height="128" rx="8" class="s-red" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="596" y="226" font-size="15" font-weight="700" class="t-red" xml:space="preserve">Data</text><text x="596" y="248" font-size="13" class="t-ink" xml:space="preserve">quoted text, files,</text><text x="596" y="266" font-size="13" class="t-ink" xml:space="preserve">tool outputs, images</text><rect x="596" y="282" width="162" height="26" rx="13" class="fs-red"/><text x="677" y="295" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-red" xml:space="preserve">no authority by default</text><text x="784" y="226" font-size="12" text-anchor="end" class="t-muted" xml:space="preserve">not a level</text></g>
<text x="24" y="401" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from the OpenAI Model Spec (2026-08-18). Learned behavior, not enforced by the API.</text>
