<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 824 412" width="824" height="412" role="img" aria-labelledby="fig-1hj2dfr-t fig-1hj2dfr-d">
<title id="fig-1hj2dfr-t">Who can override whom: OpenAI's chain of command</title>
<desc id="fig-1hj2dfr-d">The chain of command from OpenAI's Model Spec as a ladder of five levels, from top to bottom: root (the spec itself), system (OpenAI), developer (you, the app builder), user (the person chatting) and guideline (defaults). Each level can be overridden only by the levels above it. Beside the ladder, a separate box for data such as quoted text, files, tool outputs and images, marked as having no authority by default.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
