<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 840 370" width="840" height="370" role="img" aria-labelledby="fig-10vb9wd-t fig-10vb9wd-d">
<title id="fig-10vb9wd-t">Softmax in two steps: exponentiate, then divide by the total</title>
<desc id="fig-10vb9wd-d">Three bar charts for the tokens learn, predict and make. Raw scores 3, 2, 1 become 20.09, 7.39, 2.72 after exponentiating, then 0.665, 0.245, 0.090 after dividing by their total, which sums to 1.</desc>
