<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 760 344" width="760" height="344" role="img" aria-labelledby="fig-1nfn7j5-t fig-1nfn7j5-d">
<title id="fig-1nfn7j5-t">Directions carry meaning: the same step leads to a similar place</title>
<desc id="fig-1nfn7j5-d">Sketch, not real data. Arrows from France to Paris and from Italy to Rome point the same way, and so do the arrows from big to biggest and from small to smallest. In real models these arrows are only roughly parallel.</desc>
