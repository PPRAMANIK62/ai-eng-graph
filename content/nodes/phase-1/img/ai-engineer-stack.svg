" y="166" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" style="fill:var(--bg)" xml:space="preserve">Most of the time</text><rect x="24" y="218" width="560" height="80" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="42" y="251" font-size="15" font-weight="600" class="t-ink" xml:space="preserve">Infrastructure</text><text x="42" y="275" font-size="12.5" class="t-muted" xml:space="preserve">model serving · managing data and compute · monitoring</text><rect x="620" y="218" width="150" height="80" rx="6" class="s-grey" fill="none" stroke-width="1" stroke-dasharray="5 4" opacity="0.6"/><rect x="790" y="218" width="150" height="80" rx="6" class="s-grey" fill="none" stroke-width="1" stroke-dasharray="5 4" opacity="0.6"/></g>
