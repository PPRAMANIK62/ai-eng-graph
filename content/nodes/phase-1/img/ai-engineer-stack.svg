<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 964 380" width="964" height="380" role="img" aria-labelledby="fig-19gcy6y-t fig-19gcy6y-d">
<title id="fig-19gcy6y-t">Same stack, different home: where AI and ML engineers spend their time</title>
<desc id="fig-19gcy6y-d">Three stacked layers: application development on top, model development in the middle, infrastructure at the bottom. The AI engineer spends most of their time in the top layer and sometimes reaches into the middle for fine-tuning. The ML engineer spends most of their time in the middle layer.</desc>
