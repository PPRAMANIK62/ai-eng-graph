<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 760 384" width="760" height="384" role="img" aria-labelledby="fig-7h6lgu-t fig-7h6lgu-d">
<title id="fig-7h6lgu-t">A good needle score says little about harder long-context tasks</title>
<desc id="fig-7h6lgu-d">An illustrative line chart of accuracy against input length. The needle-in-a-haystack line stays flat near the top. A second line for harder tasks, such as several facts at once or distractors, starts high and slopes down as the input gets longer. The shape is illustrative, not data.</desc>
