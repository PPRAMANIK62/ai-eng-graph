<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 332" width="900" height="332" role="img" aria-labelledby="fig-doaza6-t fig-doaza6-d">
<title id="fig-doaza6-t">One context window holds the whole request and the reply</title>
<desc id="fig-doaza6-d">One long bar standing for a 1M-token context window. From left to right: system prompt, tool definitions, earlier turns, the pasted document and the new question make up the input. Then the model's thinking and answer, then room reserved by max_tokens, then unused space. Input and output share the same window.</desc>
<style>
.fig{--bg:var(--t-surface,#ffffff);--ink:var(--t-ink,#0d1117);--muted:var(--t-ink-2,#4a5261);--line:var(--t-ink-3,#8a93a0);--grid:var(--t-rule,#dde1e7);--blue:var(--line-1,#0065bd);--orange:var(--line-3,#f26b1d);--green:var(--line-2,#00a650);--red:var(--line-0,#e4002b);--purple:var(--line-4,#8a3fa0);--grey:var(--t-ink-3,#8a93a0);--blue-soft:var(--line-1-soft,#dcebf8);--orange-soft:var(--line-3-soft,#fde6d8);--green-soft:var(--line-2-soft,#d6f2e2);--red-soft:var(--line-0-soft,#fbd9df);--purple-soft:var(--line-4-soft,#eedff3);--grey-soft:var(--t-panel,#f3f5f8);--ink-soft:var(--t-panel,#f3f5f8);--muted-soft:var(--t-panel,#f3f5f8)}
