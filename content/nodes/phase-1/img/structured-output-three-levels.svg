 markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="900" height="491"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">What each way of asking for JSON actually guarantees</text>
<g transform="translate(0 44)"><rect x="24" y="0" width="856" height="46" rx="6" class="fs-grey s-grey" stroke-width="1.1"/><text x="38" y="16" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-muted" xml:space="preserve">Same input for all three:</text><text x="38" y="33" font-size="12.5" font-style="italic" dominant-baseline="central" class="t-ink" xml:space="preserve">John Smith (john@example.com) is interested in our Enterprise plan and wants to schedule a demo for next Tuesday at 2pm.</text><rect x="24" y="66" width="236" height="119" rx="8" class="fs-red s-red" stroke-width="1.5"/><text x="38" y="90" font-size="15" font-weight="700" class="t-ink" xml:space="preserve">Just ask</text><text x="38" y="112" font-size="11.5" dominant-baseline="central" class="t-muted" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">&quot;Reply only with JSON like…&quot;</text><text x="246" y="169" font-size="15" text-anchor="end" font-weight="700" font-style="italic" class="t-red" xml:space="preserve">hopes</text><line x1="266" y1="125.5" x2="290" y2="125.5" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="296" y="66" width="330" height="119" rx="6" class="s-red" fill="none" stroke-width="1.5"/><text x="310" y="87.5" font-size="12.5" dominant-baseline="central" font-weight="700" class="t-red" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">```json</text><text x="310" y="106.5" font-size="12.5" dominant-baseline="central" class="t-ink" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">{&quot;name&quot;: &quot;John Smith&quot;,</text><text x="310" y="125.5" font-size="12.5" dominant-baseline="central" class="t-ink" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve"> &quot;email&quot;: &quot;john@example.com&quot;,</text><text x="310" y="144.5" font-size="12.5" dominant-baseline="central" class="t-ink" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve"> &quot;plan_interest&quot;: &quot;Enterprise&quot;}</text><text x="310" y="163.5" font-size="12.5" dominant-baseline="central" font-weight="700" class="t-red" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">```</text><text x="654" y="107.5" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">Wrapped in code fences,</text><text x="654" y="125.5" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">so it doesn't parse.</text><text x="654" y="143.5" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">demo_requested is missing.</text><rect x="24" y="201" width="236" height="100" rx="8" class="fs-orange s-orange" stroke-width="1.5"/><text x="38" y="225" font-size="15" font-weight="700" class="t-ink" xml:space="preserve">JSON mode</text><text x="38" y="247" font-size="11.5" dominant-baseline="central" class="t-muted" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">type: &quot;json_object&quot;</text><text x="246" y="285" font-size="15" text-anchor="end" font-weight="700" font-style="italic" class="t-orange" xml:space="preserve">parses</text><line x1="266" y1="251" x2="290" y2="251" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="296" y="201" width="330" height="100" rx="6" class="s-orange" fill="none" stroke-width="1.5"/><text x="310" y="232" font-size="12.5" dominant-baseline="central" font-weight="700" class="t-orange" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">{&quot;customer&quot;: &quot;John Smith&quot;,</text><text x="310" y="251" font-size="12.5" dominant-baseline="central" font-weight="700" class="t-orange" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve"> &quot;contact&quot;: &quot;john@example.com&quot;,</text><text x="310" y="270" font-size="12.5" dominant-baseline="central" font-weight="700" class="t-orange" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve"> &quot;wants_demo&quot;: &quot;yes&quot;}</text><text x="654" y="233" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">Valid JSON, but the keys</text><text x="654" y="251" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">and types are the model's</text><text x="654" y="269" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">choice, not yours.</text><rect x="24" y="317" width="236" height="100" rx="8" class="fs-green s-green" stroke-width="1.5"/><text x="38" y="341" font-size="15" font-weight="700" class="t-ink" xml:space="preserve">Strict schema</text><text x="38" y="363" font-size="11.5" dominant-baseline="central" class="t-muted" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">schema + strict mode</text><text x="246" y="401" font-size="15" text-anchor="end" font-weight="700" font-style="italic" class="t-green" xml:space="preserve">matches</text><line x1="266" y1="367" x2="290" y2="367" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="296" y="317" width="330" height="100" rx="6" class="s-green" fill="none" stroke-width="1.5"/><text x="310" y="338.5" font-size="12.5" dominant-baseline="central" class="t-ink" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">{&quot;name&quot;: &quot;John Smith&quot;,</text><text x="310" y="357.5" font-size="12.5" dominant-baseline="central" class="t-ink" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve"> &quot;email&quot;: &quot;john@example.com&quot;,</text><text x="310" y="376.5" font-size="12.5" dominant-baseline="central" class="t-ink" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve"> &quot;plan_interest&quot;: &quot;Enterprise&quot;,</text><text x="310" y="395.5" font-size="12.5" dominant-baseline="central" class="t-ink" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve"> &quot;demo_requested&quot;: true}</text><text x="654" y="349" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">Every required key,</text><text x="654" y="367" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">every type right.</text><text x="654" y="385" font-size="13" dominant-baseline="central" class="t-muted" xml:space="preserve">(Values can still be wrong.)</text></g>
<text x="24" y="480" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Example replies made up to show what each approach allows. Not recorded model output.</text>
</svg>
