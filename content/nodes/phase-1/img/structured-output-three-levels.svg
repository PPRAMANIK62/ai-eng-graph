<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 491" width="900" height="491" role="img" aria-labelledby="fig-10wtaau-t fig-10wtaau-d">
<title id="fig-10wtaau-t">What each way of asking for JSON actually guarantees</title>
<desc id="fig-10wtaau-d">The same sales email sent three ways. Just asking in the prompt can return JSON wrapped in code fences with the demo_requested field missing. JSON mode returns valid JSON but with its own keys, like customer and wants_demo set to &quot;yes&quot;. A strict schema returns exactly the four fields: name, email, plan_interest and demo_requested as true. The labels read hopes, parses and matches.</desc>
<style>
