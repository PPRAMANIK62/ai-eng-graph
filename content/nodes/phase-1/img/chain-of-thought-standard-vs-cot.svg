<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="880" height="470"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">The only change is the worked reasoning in the example</text>
<g transform="translate(0 44)"><text x="24" y="14" font-size="15" font-weight="700" class="t-ink" xml:space="preserve">Standard prompting</text><rect x="24" y="30" width="400" height="178" rx="10" class="s-grey" fill="none" stroke-width="1.5"/><text x="38" y="48" font-size="11.5" font-weight="700" class="t-blue" xml:space="preserve">EXAMPLE + NEW QUESTION (INPUT)</text><text x="38" y="69" font-size="13.5" class="t-ink" xml:space="preserve">Q: Roger has 5 tennis balls. He buys 2 more cans of</text><text x="38" y="88" font-size="13.5" class="t-ink" xml:space="preserve">tennis balls. Each can has 3 tennis balls. How many</text><text x="38" y="107" font-size="13.5" class="t-ink" xml:space="preserve">tennis balls does he have now?</text><text x="38" y="136" font-size="13.5" class="t-ink" xml:space="preserve">A: The answer is 11.</text><text x="38" y="165" font-size="13.5" class="t-ink" xml:space="preserve">Q: The cafeteria had 23 apples. If they used 20 to make</text><text x="38" y="184" font-size="13.5" class="t-ink" xml:space="preserve">lunch and bought 6 more, how many apples do they have?</text><rect x="24" y="268" width="400" height="63" rx="10" class="s-red" fill="none" stroke-width="1.5"/><text x="38" y="286" font-size="11.5" font-weight="700" class="t-muted" xml:space="preserve">MODEL OUTPUT</text><text x="38" y="307" font-size="13.5" class="t-ink" xml:space="preserve">A: The answer is 27.</text><text x="410" y="286" font-size="13" text-anchor="end" font-weight="700" class="t-red" xml:space="preserve">wrong</text><text x="456" y="14" font-size="15" font-weight="700" class="t-ink" xml:space="preserve">Chain-of-thought prompting</text><rect x="456" y="30" width="400" height="216" rx="10" class="s-grey" fill="none" stroke-width="1.5"/><text x="470" y="48" font-size="11.5" font-weight="700" class="t-blue" xml:space="preserve">EXAMPLE + NEW QUESTION (INPUT)</text><text x="470" y="69" font-size="13.5" class="t-ink" xml:space="preserve">Q: Roger has 5 tennis balls. He buys 2 more cans of</text><text x="470" y="88" font-size="13.5" class="t-ink" xml:space="preserve">tennis balls. Each can has 3 tennis balls. How many</text><text x="470" y="107" font-size="13.5" class="t-ink" xml:space="preserve">tennis balls does he have now?</text><rect x="466" y="122" width="380" height="19" rx="2" class="fs-blue"/><text x="470" y="136" font-size="13.5" class="t-ink" xml:space="preserve">A: Roger started with 5 balls. 2 cans of 3 tennis balls</text><rect x="466" y="141" width="380" height="19" rx="2" class="fs-blue"/><text x="470" y="155" font-size="13.5" class="t-ink" xml:space="preserve">each is 6 tennis balls. 5 + 6 = 11.</text><text x="470" y="174" font-size="13.5" class="t-ink" xml:space="preserve">The answer is 11.</text><text x="470" y="203" font-size="13.5" class="t-ink" xml:space="preserve">Q: The cafeteria had 23 apples. If they used 20 to make</text><text x="470" y="222" font-size="13.5" class="t-ink" xml:space="preserve">lunch and bought 6 more, how many apples do they have?</text><rect x="456" y="268" width="400" height="120" rx="10" class="s-green" fill="none" stroke-width="1.5"/><text x="470" y="286" font-size="11.5" font-weight="700" class="t-muted" xml:space="preserve">MODEL OUTPUT</text><rect x="466" y="293" width="380" height="19" rx="2" class="fs-green"/><text x="470" y="307" font-size="13.5" class="t-ink" xml:space="preserve">A: The cafeteria had 23 apples originally. They used 20</text><rect x="466" y="312" width="380" height="19" rx="2" class="fs-green"/><text x="470" y="326" font-size="13.5" class="t-ink" xml:space="preserve">to make lunch. So they had 23 - 20 = 3. They bought 6</text><rect x="466" y="331" width="380" height="19" rx="2" class="fs-green"/><text x="470" y="345" font-size="13.5" class="t-ink" xml:space="preserve">more apples, so they have 3 + 6 = 9.</text><text x="470" y="364" font-size="13.5" class="t-ink" xml:space="preserve">The answer is 9.</text><text x="842" y="286" font-size="13" text-anchor="end" font-weight="700" class="t-green" xml:space="preserve">right</text></g>
<text x="24" y="459" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from figure 1 of Wei et al. (Google), 2022. Highlights mark the added reasoning.</text>
</svg>
