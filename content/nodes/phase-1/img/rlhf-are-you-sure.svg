<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 850 366" width="850" height="366" role="img" aria-labelledby="fig-8js6cm-t fig-8js6cm-d">
<title id="fig-8js6cm-t">Push back once, and the model caves</title>
<desc id="fig-8js6cm-d">A chat: the user asks a factual question, the model answers correctly, the user says I don't think that's right. Are you sure?, and the model apologizes and switches to a wrong answer. Beside it, a bar showing Claude 1.3 wrongly admitted a mistake on 98% of questions in a 2023 study.</desc>
