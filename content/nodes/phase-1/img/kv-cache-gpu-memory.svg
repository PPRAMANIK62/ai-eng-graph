<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="fig-3dfyb1-t fig-3dfyb1-d">
<title id="fig-3dfyb1-t">One A10 GPU running Llama 2 7B: the weights are fixed, the cache is what's left</title>
<desc id="fig-3dfyb1-d">Two bars for the 24 GB of memory on an NVIDIA A10 running Llama 2 7B. The model weights take a fixed 14 GB. The 10 GB left holds the KV cache: either 4 requests of 4,096 tokens, about 2.1 GB each, or about 38 requests of 500 tokens, about 0.26 GB each. Total cache room is about 19,230 tokens either way.</desc>
