<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 1030 438" width="1030" height="438" role="img" aria-labelledby="fig-1kt5x6f-t fig-1kt5x6f-d">
<title id="fig-1kt5x6f-t">Attention works across tokens. The MLP works on each token alone.</title>
<desc id="fig-1kt5x6f-d">One transformer block drawn as a column per token. In the attention band, arrows run from earlier tokens to later ones, never backward. In the MLP band above it, each column has its own identical box and nothing crosses between columns.</desc>
