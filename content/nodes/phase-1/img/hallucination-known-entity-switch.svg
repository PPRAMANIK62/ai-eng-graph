<g transform="translate(0 44)"><text x="24" y="12" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">Question about…</text><text x="280" y="12" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">“Known entity” feature</text><text x="520" y="12" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">“Can't answer” circuit</text><text x="740" y="12" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">What the model does</text><text x="24" y="36" font-size="12.5" font-weight="700" class="t-green" xml:space="preserve">Known name</text><rect x="24" y="44" width="200" height="64" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="124" y="67.22" font-size="13.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">“Michael Jordan”</text><text x="124" y="84.78" font-size="13.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">(the basketball player)</text><line x1="230" y1="76" x2="274" y2="76" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="280" y="44" width="160" height="64" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="360" y="67.22" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">Known entity</text><text x="360" y="84.78" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">ON</text><line x1="446" y1="76" x2="514" y2="76" class="s-green" stroke-width="2"/><line x1="514" y1="67" x2="514" y2="85" class="s-green" stroke-width="3"/><rect x="520" y="44" width="170" height="64" rx="6" class="s-grey" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="605" y="67.22" font-size="13.5" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-muted" xml:space="preserve">Can't answer</text><text x="605" y="84.78" font-size="13.5" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-muted" xml:space="preserve">switched OFF</text><line x1="696" y1="76" x2="734" y2="76" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="740" y="44" width="210" height="64" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="845" y="67.22" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">Answers:</text><text x="845" y="84.78" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">basketball</text><text x="24" y="140" font-size="12.5" font-weight="700" class="t-muted" xml:space="preserve">Unknown name</text><rect x="24" y="148" width="200" height="64" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="124" y="171.23" font-size="13.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">“Michael Batkin”</text><text x="124" y="188.78" font-size="13.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">(no one it knows)</text><line x1="230" y1="180" x2="274" y2="180" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="280" y="148" width="160" height="64" rx="6" class="s-grey" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="360" y="171.23" font-size="13.5" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-muted" xml:space="preserve">Known entity</text><text x="360" y="188.78" font-size="13.5" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-muted" xml:space="preserve">OFF</text><line x1="446" y1="180" x2="514" y2="180" class="s-grey" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="520" y="148" width="170" height="64" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="605" y="171.23" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">Can't answer</text><text x="605" y="188.78" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">stays ON (default)</text><line x1="696" y1="180" x2="734" y2="180" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="740" y="148" width="210" height="64" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="845" y="171.23" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">Declines:</text><text x="845" y="188.78" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">not enough information</text><text x="24" y="244" font-size="12.5" font-weight="700" class="t-red" xml:space="preserve">Hallucination</text><rect x="24" y="252" width="200" height="64" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="124" y="275.23" font-size="13.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">A name it recognizes</text><text x="124" y="292.78" font-size="13.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">but knows nothing about</text><line x1="230" y1="284" x2="274" y2="284" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="280" y="252" width="160" height="64" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="360" y="275.23" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-red" xml:space="preserve">Known entity</text><text x="360" y="292.78" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-red" xml:space="preserve">fires by mistake</text><line x1="446" y1="284" x2="514" y2="284" class="s-red" stroke-width="2"/><line x1="514" y1="275" x2="514" y2="293" class="s-red" stroke-width="3"/><rect x="520" y="252" width="170" height="64" rx="6" class="s-grey" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="605" y="275.23" font-size="13.5" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-muted" xml:space="preserve">Can't answer</text><text x="605" y="292.78" font-size="13.5" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-muted" xml:space="preserve">switched OFF</text><line x1="696" y1="284" x2="734" y2="284" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="740" y="252" width="210" height="64" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="845" y="275.23" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-red" xml:space="preserve">Makes up a plausible,</text><text x="845" y="292.78" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-red" xml:space="preserve">confident, false answer</text><line x1="24" y1="342" x2="58" y2="342" class="s-ink" stroke-width="2"/><line x1="58" y1="333" x2="58" y2="351" class="s-ink" stroke-width="3"/><text x="68" y="342" font-size="12.5" dominant-baseline="central" class="t-muted" xml:space="preserve">turns off</text><line x1="154" y1="342" x2="188" y2="342" class="s-grey" stroke-width="1.2" stroke-dasharray="5 4"/><text x="198" y="342" font-size="12.5" dominant-baseline="central" class="t-muted" xml:space="preserve">nothing happens</text><text x="334" y="342" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Declining is the default: something has to switch “can't answer” off.</text></g>
<text x="24" y="419" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from Anthropic, “Tracing the thoughts of a large language model” (2025), on Claude 3.5 Haiku. Simplified.</text>
