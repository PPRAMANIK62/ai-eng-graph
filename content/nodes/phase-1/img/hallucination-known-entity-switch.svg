<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 974 430" width="974" height="430" role="img" aria-labelledby="fig-1j5qmbm-t fig-1j5qmbm-d">
<title id="fig-1j5qmbm-t">A hallucination is a switch flipping the wrong way</title>
<desc id="fig-1j5qmbm-d">Three rows showing a switch inside Claude 3.5 Haiku. By default a “can't answer” circuit is on. For Michael Jordan, a known-entity feature turns on and switches it off, so the model answers basketball. For Michael Batkin, nothing is recognized, the default stays on, and the model declines. In the red row, a name the model recognizes but knows nothing about makes the known-entity feature fire by mistake, the “can't answer” circuit is switched off, and the model makes up a confident, false answer.</desc>
<style>
