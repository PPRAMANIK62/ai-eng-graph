<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 404" width="900" height="404" role="img" aria-labelledby="fig-141nmr1-t fig-141nmr1-d">
<title id="fig-141nmr1-t">Greedy takes the top word at each step and misses a better sentence</title>
<desc id="fig-141nmr1-d">A probability tree. After &quot;The&quot;, the model gives nice 0.5, dog 0.4 and car 0.1. After &quot;nice&quot; the best word is woman at 0.4; after &quot;dog&quot; it is has at 0.9. Greedy follows The, nice, woman for a total of 0.2. The path The, dog, has totals 0.36 but greedy never sees it. A dashed path shows random sampling sometimes picking car.</desc>
