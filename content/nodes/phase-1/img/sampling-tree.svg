x="6" class="s-purple" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="536" y="290" font-size="15" text-anchor="middle" dominant-baseline="central" class="t-purple" xml:space="preserve">…</text><text x="612" y="16" font-size="14" font-weight="600" class="t-orange" xml:space="preserve">Greedy: The nice woman</text><text x="612" y="35" font-size="13" class="t-muted" xml:space="preserve">0.5 × 0.4 = 0.20</text><text x="612" y="136" font-size="14" font-weight="600" class="t-blue" xml:space="preserve">Better: The dog has</text><text x="612" y="155" font-size="13" class="t-muted" xml:space="preserve">0.4 × 0.9 = 0.36, greedy never sees it</text><text x="612" y="283" font-size="14" font-weight="600" class="t-purple" xml:space="preserve">Sampling: sometimes The car …</text><text x="612" y="302" font-size="13" class="t-muted" xml:space="preserve">a weighted die picks car 1 time in 10</text></g>
<text x="24" y="393" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from the probability tree in Hugging Face's &quot;How to generate text&quot; (von Platen, 2020). Toy probabilities.</text>
