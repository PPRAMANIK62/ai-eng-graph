<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 860 462" width="860" height="462" role="img" aria-labelledby="fig-bsxpmr-t fig-bsxpmr-d">
<title id="fig-bsxpmr-t">Output costs 5× input on every model, while base prices span 100×</title>
