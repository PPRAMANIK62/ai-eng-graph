<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">A prompt change goes through the same path as a code change</text>
<g transform="translate(0 44)"><rect x="28" y="8" width="208" height="240" rx="10" class="s-blue" fill="none" stroke-width="1.5"/><rect x="28" y="8" width="208" height="40" rx="10" class="fs-blue s-blue" stroke-width="1.5"/><rect x="28.75" y="38" width="206.5" height="10" rx="0" class="fs-blue"/><line x1="28" y1="48" x2="236" y2="48" class="s-blue" stroke-width="1.5"/><circle cx="50" cy="28" r="11" class="f-blue"/><text x="50" y="28" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="bg" xml:space="preserve">1</text><text x="70" y="28" font-size="14.5" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Prompt in the repo</text><text x="46" y="74" font-size="13.5" class="t-muted mono" xml:space="preserve">prompts/</text><text x="46" y="95" font-size="13.5" class="t-ink mono" xml:space="preserve">  ticket_triage.py</text><text x="46" y="126" font-size="12.5" class="t-ink mono" xml:space="preserve">def triage_prompt(</text><text x="46" y="147" font-size="12.5" class="t-ink mono" xml:space="preserve">    ticket, product)</text><text x="46" y="178" font-size="12.5" class="t-muted" xml:space="preserve">Typed inputs, one module</text><text x="46" y="199" font-size="12.5" class="t-muted" xml:space="preserve">next to the feature</text><line x1="244" y1="128" x2="266" y2="128" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="274" y="8" width="208" height="240" rx="10" class="s-purple" fill="none" stroke-width="1.5"/><rect x="274" y="8" width="208" height="40" rx="10" class="fs-purple s-purple" stroke-width="1.5"/><rect x="274.75" y="38" width="206.5" height="10" rx="0" class="fs-purple"/><line x1="274" y1="48" x2="482" y2="48" class="s-purple" stroke-width="1.5"/><circle cx="296" cy="28" r="11" class="f-purple"/><text x="296" y="28" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="bg" xml:space="preserve">2</text><text x="316" y="28" font-size="14.5" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Pull request</text><text x="292" y="74" font-size="12.5" class="t-muted" xml:space="preserve">system prompt, 1 line</text><rect x="286" y="90" width="184" height="21" rx="3" class="fs-red"/><text x="292" y="105" font-size="12" class="t-red mono" xml:space="preserve">- Answer questions.</text><rect x="286" y="111" width="184" height="21" rx="3" class="fs-green"/><text x="292" y="126" font-size="12" class="t-green mono" xml:space="preserve">+ Reply with label only.</text><text x="292" y="157" font-size="12.5" class="t-muted" xml:space="preserve">Someone reviews the diff</text><text x="292" y="178" font-size="12.5" class="t-muted" xml:space="preserve">like any other change</text><line x1="490" y1="128" x2="512" y2="128" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="520" y="8" width="208" height="240" rx="10" class="s-orange" fill="none" stroke-width="1.5"/><rect x="520" y="8" width="208" height="40" rx="10" class="fs-orange s-orange" stroke-width="1.5"/><rect x="520.75" y="38" width="206.5" height="10" rx="0" class="fs-orange"/><line x1="520" y1="48" x2="728" y2="48" class="s-orange" stroke-width="1.5"/><circle cx="542" cy="28" r="11" class="f-orange"/><text x="542" y="28" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="bg" xml:space="preserve">3</text><text x="562" y="28" font-size="14.5" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Eval run</text><text x="538" y="74" font-size="12.5" class="t-muted" xml:space="preserve">Real tickets with the</text><text x="538" y="95" font-size="12.5" class="t-muted" xml:space="preserve">labels you expect</text><rect x="532" y="126" width="86" height="62" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="575" y="146" font-size="12.5" text-anchor="middle" class="t-muted" xml:space="preserve">score</text><text x="575" y="168" font-size="14" text-anchor="middle" font-weight="600" class="t-orange" xml:space="preserve">before</text><rect x="630" y="126" width="86" height="62" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="673" y="146" font-size="12.5" text-anchor="middle" class="t-muted" xml:space="preserve">score</text><text x="673" y="168" font-size="14" text-anchor="middle" font-weight="600" class="t-orange" xml:space="preserve">after</text><text x="538" y="216" font-size="12.5" class="t-muted" xml:space="preserve">Ship only if the score</text><text x="538" y="235" font-size="12.5" class="t-muted" xml:space="preserve">holds up</text><line x1="736" y1="128" x2="758" y2="128" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="766" y="8" width="208" height="240" rx="10" class="s-green" fill="none" stroke-width="1.5"/><rect x="766" y="8" width="208" height="40" rx="10" class="fs-green s-green" stroke-width="1.5"/><rect x="766.75" y="38" width="206.5" height="10" rx="0" class="fs-green"/><line x1="766" y1="48" x2="974" y2="48" class="s-green" stroke-width="1.5"/><circle cx="788" cy="28" r="11" class="f-green"/><text x="788" y="28" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="bg" xml:space="preserve">4</text><text x="808" y="28" font-size="14.5" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Deploy</text><text x="784" y="74" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">Behind a feature flag</text><text x="784" y="95" font-size="12.5" class="t-muted" xml:space="preserve">for a staged release</text><text x="784" y="126" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">Model snapshot pinned</text><text x="784" y="147" font-size="12.5" class="t-muted" xml:space="preserve">in the same place,</text><text x="784" y="168" font-size="12.5" class="t-muted" xml:space="preserve">changed together</text><text x="501" y="278" font-size="13.5" text-anchor="middle" class="t-muted" xml:space="preserve">The same path a code change takes: version control, review, tests, deploy.</text></g>

