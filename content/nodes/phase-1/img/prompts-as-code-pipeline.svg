<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 1002 348" width="1002" height="348" role="img" aria-labelledby="fig-1880en2-t fig-1880en2-d">
<title id="fig-1880en2-t">A prompt change goes through the same path as a code change</title>
<desc id="fig-1880en2-d">A prompt change moving left to right through four steps: the prompt lives in a file in the repo, a pull request changes one line of the system prompt, an eval run compares the score before and after the change, and the change deploys behind a feature flag with the model snapshot pinned.</desc>
