<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 986 414" width="986" height="414" role="img" aria-labelledby="fig-wrnbqs-t fig-wrnbqs-d">
<title id="fig-wrnbqs-t">The model remembers nothing: every call resends the whole list</title>
<desc id="fig-wrnbqs-d">Three request bodies for the same chat, side by side. Call 1 sends one user message and uses 12 input tokens. Call 2 sends that message again, plus the reply &quot;Hello!&quot; and a new question, and uses 30 input tokens. Call 3 sends all of that again plus the next reply and message, so its input is bigger still. Older messages are grey, new ones are highlighted.</desc>
<style>
