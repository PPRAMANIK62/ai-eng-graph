<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 866 426" width="866" height="426" role="img" aria-labelledby="fig-1mggx0m-t fig-1mggx0m-d">
<title id="fig-1mggx0m-t">Few-shot examples are just more text the model continues</title>
<desc id="fig-1mggx0m-d">A few-shot prompt drawn as a stack: an instruction to sort tickets into billing, bug or account, then three example tickets each followed by its one-word answer, then the real ticket with an empty answer and a question mark. Arrows run from the three example answers to the empty one, labelled: format, labels and length are copied from here.</desc>
