<g transform="translate(0 44)"><rect x="24" y="8" width="560" height="42" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="304" y="29" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Sort each support ticket into billing, bug or account.</text><text x="24" y="74" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">Examples (earlier turns you write yourself)</text><text x="34" y="96" font-size="12" class="t-muted mono" xml:space="preserve">user</text><text x="474" y="96" font-size="12" class="t-muted mono" xml:space="preserve">assistant</text><rect x="24" y="106" width="400" height="44" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="224" y="128" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">I was charged twice this month.</text><line x1="430" y1="128" x2="458" y2="128" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="464" y="106" width="120" height="44" rx="6" class="fs-green s-green" stroke-width="2"/><text x="524" y="128" font-size="14.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink mono" xml:space="preserve">billing</text><rect x="24" y="164" width="400" height="44" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="224" y="186" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">The export button does nothing.</text><line x1="430" y1="186" x2="458" y2="186" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="464" y="164" width="120" height="44" rx="6" class="fs-green s-green" stroke-width="2"/><text x="524" y="186" font-size="14.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink mono" xml:space="preserve">bug</text><rect x="24" y="222" width="400" height="44" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="224" y="244" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">How do I change my login email?</text><line x1="430" y1="244" x2="458" y2="244" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="464" y="222" width="120" height="44" rx="6" class="fs-green s-green" stroke-width="2"/><text x="524" y="244" font-size="14.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink mono" xml:space="preserve">account</text><line x1="24" y1="294" x2="584" y2="294" class="grid" stroke-width="1"/><rect x="24" y="316" width="400" height="44" rx="6" class="fs-blue s-blue" stroke-width="2"/><text x="224" y="338" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">The app crashes when I upload a PNG.</text><text x="24" y="309" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">The real ticket</text><line x1="430" y1="338" x2="458" y2="338" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="464" y="316" width="120" height="44" rx="6" class="s-orange" fill="none" stroke-width="2" stroke-dasharray="5 4"/><text x="524" y="338" font-size="22" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-orange" xml:space="preserve">?</text><path d="M588,128 L620,128" class="s-orange" stroke-width="1.5" fill="none"/><path d="M588,186 L620,186" class="s-orange" stroke-width="1.5" fill="none"/><path d="M588,244 L620,244" class="s-orange" stroke-width="1.5" fill="none"/><path d="M620,128 L620,338 L592,338" class="s-orange" stroke-width="2" fill="none" marker-end="url(#ah-orange)"/><text x="636" y="178" font-size="13.5" font-weight="700" class="t-orange" xml:space="preserve">Copied from here:</text><text x="636" y="198" font-size="13" class="t-ink" xml:space="preserve">• format (one lowercase word)</text><text x="636" y="217" font-size="13" class="t-ink" xml:space="preserve">• labels (one of three)</text><text x="636" y="236" font-size="13" class="t-ink" xml:space="preserve">• length (short)</text></g>

