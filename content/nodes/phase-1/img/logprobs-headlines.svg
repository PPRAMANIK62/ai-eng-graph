<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 332" width="900" height="332" role="img" aria-labelledby="fig-h1abeo-t fig-h1abeo-d">
<title id="fig-h1abeo-t">Same answers, two scales: the percentage and the logprob</title>
<desc id="fig-h1abeo-d">Two headlines classified by gpt-4o-mini. For the tennis headline, Art gets 97.2% (logprob −0.028) and Sports 1.4% (logprob −4.28). For a clear tech headline, Technology gets 100% (logprob 0.0). A logprob near 0 means the model was sure; a big negative number means it wasn't.</desc>
