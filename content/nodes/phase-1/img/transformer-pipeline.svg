<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 990 410" width="990" height="410" role="img" aria-labelledby="fig-wfz569-t fig-wfz569-d">
<title id="fig-wfz569-t">One trip through GPT-2 small: text in, one next token out</title>
<desc id="fig-wfz569-d">GPT-2 small from left to right. The prompt Data visualization empowers users to is split into tokens, each token becomes a vector of 768 numbers, all vectors go through 12 blocks of attention then MLP, only the last token's vector goes on to become 50,257 probabilities, one token is picked and appended to the text, and the loop starts again.</desc>
