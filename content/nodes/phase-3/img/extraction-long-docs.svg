<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 950 359" width="950" height="359" role="img" aria-labelledby="fig-1y9mxwz-t fig-1y9mxwz-d">
<title id="fig-1y9mxwz-t">Long documents: split, extract more than once, keep the offsets</title>
<desc id="fig-1y9mxwz-d">Extraction over a long document. The document is split into chunks. Each chunk goes through the extraction model more than once, in parallel. The results are merged and duplicates are removed. Every extracted item keeps the character offsets of the text it came from, so you can highlight it in the original and check that the text is really there.</desc>
<style>
