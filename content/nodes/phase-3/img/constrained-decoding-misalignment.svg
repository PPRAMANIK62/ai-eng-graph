.8" y="58" width="28" height="30" rx="4" class="fs-orange s-orange" stroke-width="1.5"/><text x="711.8" y="73" font-size="13.5" dominant-baseline="central" text-anchor="middle" class="t-ink" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">e</text><rect x="730.8" y="58" width="28" height="30" rx="4" class="fs-orange s-orange" stroke-width="1.5"/><text x="744.8" y="73" font-size="13.5" dominant-baseline="central" text-anchor="middle" class="t-ink" style="font-family:'Noto Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace" xml:space="preserve">&quot;</text><text x="210" y="110" font-size="12" class="t-muted" xml:space="preserve">· = space   ↵ = newline   ⇥ = tab (a token the model would not have picked)</text><line x1="20" y1="138" x2="860" y2="138" class="grid" stroke-width="1"/><text x="20" y="158" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">Accuracy on GSM8K with answers as JSON (Mistral 7B, five-shot)</text><text x="200" y="190" font-size="13" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">unconstrained</text><rect x="210" y="178" width="431.6" height="24" rx="2" class="f-blue"/><text x="649.6" y="190" font-size="13" font-weight="700" dominant-baseline="central" class="t-blue" xml:space="preserve">41.5%</text><text x="200" y="226" font-size="13" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">naive constraining</text><rect x="210" y="214" width="320.32" height="24" rx="2" class="f-red"/><text x="538.32" y="226" font-size="13" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">30.8%</text><text x="200" y="262" font-size="13" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">token-aligned (DOMINO)</text><rect x="210" y="250" width="434.72" height="24" rx="2" class="f-green"/><text x="652.72" y="262" font-size="13" font-weight="700" dominant-baseline="cen