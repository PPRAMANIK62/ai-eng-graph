<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="fig-ks9ucb-t fig-ks9ucb-d">
<title id="fig-ks9ucb-t">A naive engine forces odd tokens, and accuracy drops</title>
<desc id="fig-ks9ucb-d">Two ways to constrain the same JSON. Top, the tokens a model writes on its own after an opening brace: a space-quote token, name, quote-colon, space-quote, John. Middle, a naive engine that only allows a lone quote or whitespace next: the model writes a tab, a lone quote, name, a lone quote, a tab, a colon, a tab. Bottom, a bar chart of accuracy on a JSON version of GSM8K: unconstrained 41.5%, naive constraining 30.8%, token-aligned constraining 41.8%.</desc>
