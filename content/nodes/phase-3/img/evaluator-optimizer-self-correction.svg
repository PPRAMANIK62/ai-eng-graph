<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 744 398" width="744" height="398" role="img" aria-labelledby="fig-c0sc6i-t fig-c0sc6i-d">
<title id="fig-c0sc6i-t">Reviewing its own answer with no outside feedback didn't help</title>
<desc id="fig-c0sc6i-d">Line chart of accuracy after each round of self-correction with no outside feedback. GPT-3.5 on GSM8K: 75.9, 75.1, 74.7. GPT-3.5 on CommonSenseQA: 75.8, 38.1, 41.8. GPT-4 on GSM8K: 95.5, 91.5, 89.0. GPT-4 on CommonSenseQA: 82.0, 79.5, 80.0. For comparison, when the correct answer was used to decide when to stop, GPT-3.5 reached 84.3 on GSM8K and 89.7 on CommonSenseQA.</desc>
