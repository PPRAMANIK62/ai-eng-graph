<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 780 358" width="780" height="358" role="img" aria-labelledby="fig-5ygrl-t fig-5ygrl-d">
<title id="fig-5ygrl-t">Orchestrator-workers: a model writes the plan, code runs it</title>
<desc id="fig-5ygrl-d">The orchestrator-workers pattern on a docs question. The orchestrator call reads the question and returns a list of subtasks; how many and which ones are decided at run time. Code calls one worker per subtask, with the original question and that subtask. A synthesizer call combines the worker outputs into one answer. The orchestrator plans once and the workers each answer once; code runs the loop.</desc>
