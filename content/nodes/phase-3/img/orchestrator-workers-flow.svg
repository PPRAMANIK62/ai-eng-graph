<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Orchestrator-workers: a model writes the plan, code runs it</text>
<g transform="translate(0 44)"><rect x="16" y="78" width="116" height="54" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="74" y="96.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">“How do I build</text><text x="74" y="113.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">a RAG chatbot?”</text><line x1="132" y1="105" x2="150" y2="105" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="152" y="78" width="120" height="54" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="212" y="96.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">orchestrator</text><text x="212" y="113.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">makes a plan</text><line x1="272" y1="105" x2="292" y2="105" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="294" y="20" width="164" height="172" rx="6" class="fs-orange s-orange" stroke-width="1.5" stroke-dasharray="5 4"/><text x="376" y="40" font-size="12.5" text-anchor="middle" font-weight="700" class="t-orange" xml:space="preserve">the plan</text><text x="308" y="70" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">1. explain chunking</text><text x="308" y="104" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">2. explain embeddings</text><text x="308" y="138" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">3. explain vector index</text><text x="308" y="172" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">4. explain testing</text><line x1="458" y1="70" x2="490" y2="70" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="492" y="56" width="90" height="28" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="537" y="70" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">worker</text><line x1="582" y1="70" x2="628" y2="105" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="458" y1="104" x2="490" y2="104" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="492" y="90" width="90" height="28" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="537" y="104" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">worker</text><line x1="582" y1="104" x2="628" y2="105" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="458" y1="138" x2="490" y2="138" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="492" y="124" width="90" height="28" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="537" y="138" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">worker</text><line x1="582" y1="138" x2="628" y2="105" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="458" y1="172" x2="490" y2="172" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="492" y="158" width="90" height="28" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="537" y="172" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">worker</text><line x1="582" y1="172" x2="628" y2="105" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="630" y="78" width="134" height="54" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="697" y="96.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">synthesizer</text><text x="697" y="113.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">one answer</text><line x1="697" y1="132" x2="697" y2="166" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="652" y="168" width="90" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="697" y="184" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">answer</text><text x="376" y="216" font-size="12" text-anchor="middle" class="t-orange" xml:space="preserve">how many, and which:</text><text x="376" y="233" font-size="12" text-anchor="middle" class="t-orange" xml:space="preserve">chosen by the model</text><text x="537" y="216" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">one call each, with the</text><text x="537" y="233" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">question + its subtask</text><text x="16" y="270" font-size="12.5" class="t-ink" xml:space="preserve">Plan once, fan out, combine once. Your code runs every step, so it's a workflow, not an agent.</text></g>
<text x="24" y="347" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from Anthropic, “Building effective agents” (2024) and its orchestrator-workers cookbook.</text>
</svg>
