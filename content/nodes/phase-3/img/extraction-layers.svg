<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 898 354" width="898" height="354" role="img" aria-labelledby="fig-rd4tuf-t fig-rd4tuf-d">
<title id="fig-rd4tuf-t">A valid object can still be wrong: what catches each error</title>
<desc id="fig-rd4tuf-d">What catches each kind of extraction error, for the invoice email. A strict schema catches invalid JSON, a missing required key, a wrong type and an enum value that isn't on the list. Your validation code catches rule breaks the schema can't express, like a negative amount or a due date before the invoice date, and a value whose quoted evidence doesn't appear in the email. Only a labelled test set catches a wrong value that is still plausible, like a valid date with the wrong year guessed for 15 October. In one 2026 benchmark, wrong values were the most common error under every prompting setup.</desc>
<style>
