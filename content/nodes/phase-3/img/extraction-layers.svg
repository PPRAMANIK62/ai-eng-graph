<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">A valid object can still be wrong: what catches each error</text>
<g transform="translate(0 44)"><rect x="20" y="0" width="270" height="220" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="36" y="26" font-size="15" font-weight="700" class="t-blue display" xml:space="preserve">Strict schema</text><text x="36" y="46" font-size="12.5" font-style="italic" class="t-muted" xml:space="preserve">guaranteed by the API</text><text x="36" y="76" font-size="13" font-weight="700" class="t-blue" xml:space="preserve">•</text><text x="50" y="76" font-size="13" class="t-ink" xml:space="preserve">Invalid JSON</text><text x="36" y="108" font-size="13" font-weight="700" class="t-blue" xml:space="preserve">•</text><text x="50" y="108" font-size="13" class="t-ink" xml:space="preserve">Missing required key</text><text x="36" y="140" font-size="13" font-weight="700" class="t-blue" xml:space="preserve">•</text><text x="50" y="140" font-size="13" class="t-ink" xml:space="preserve">Wrong type (&quot;4,300&quot; as text)</text><text x="36" y="172" font-size="13" font-weight="700" class="t-blue" xml:space="preserve">•</text><text x="50" y="172" font-size="13" class="t-ink" xml:space="preserve">Enum value not on the list</text><line x1="293" y1="110" x2="311" y2="110" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="314" y="0" width="270" height="220" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="330" y="26" font-size="15" font-weight="700" class="t-orange display" xml:space="preserve">Your validation code</text><text x="330" y="46" font-size="12.5" font-style="italic" class="t-muted" xml:space="preserve">rules the schema can't express</text><text x="330" y="76" font-size="13" font-weight="700" class="t-orange" xml:space="preserve">•</text><text x="344" y="76" font-size="13" class="t-ink" xml:space="preserve">Amount below zero</text><text x="330" y="108" font-size="13" font-weight="700" class="t-orange" xml:space="preserve">•</text><text x="344" y="108" font-size="13" class="t-ink" xml:space="preserve">Due date before the invoice date</text><text x="330" y="140" font-size="13" font-weight="700" class="t-orange" xml:space="preserve">•</text><text x="344" y="140" font-size="13" class="t-ink" xml:space="preserve">Quoted evidence not in the email</text><line x1="587" y1="110" x2="605" y2="110" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="608" y="0" width="270" height="220" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="624" y="26" font-size="15" font-weight="700" class="t-red display" xml:space="preserve">A labelled test set</text><text x="624" y="46" font-size="12.5" font-style="italic" class="t-muted" xml:space="preserve">the only thing that sees these</text><text x="624" y="76" font-size="13" font-weight="700" class="t-red" xml:space="preserve">•</text><text x="638" y="76" font-size="13" class="t-ink" xml:space="preserve">A plausible but wrong value: a valid</text><text x="638" y="94" font-size="13" class="t-ink" xml:space="preserve">date, but the wrong year guessed</text><text x="638" y="112" font-size="13" class="t-ink" xml:space="preserve">for &quot;15 October&quot;</text><text x="20" y="250" font-size="12.5" class="t-muted" xml:space="preserve">Each column catches what gets past the one before it. With a strict schema, the first column's errors never reach you;</text><text x="20" y="268" font-size="12.5" class="t-muted" xml:space="preserve">in LLMStructBench (2026), wrong values were the biggest source of errors under every prompting setup.</text></g>
<text x="24" y="343" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Conceptual, for the invoice example. Schema limits from Anthropic's structured outputs docs; finding from Tenckhoff et al. (2026).</text>
</svg>
