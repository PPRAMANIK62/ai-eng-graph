<g transform="translate(0 44)"><rect x="20" y="40" width="90" height="44" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="65" y="62" font-size="13.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">topic</text><line x1="110" y1="62" x2="136" y2="62" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="138" y="40" width="140" height="44" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="208" y="53.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">call 1</text><text x="208" y="70.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">write an outline</text><line x1="278" y1="62" x2="330" y2="62" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="304" y="50" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">outline</text><path d="M378,30 L424,62 L378,94 L332,62 Z" class="s-orange fs-orange" stroke-width="1.5"/><text x="378" y="57" font-size="13" text-anchor="middle" font-weight="700" class="t-orange" xml:space="preserve">gate</text><text x="378" y="73" font-size="12" text-anchor="middle" class="t-orange" xml:space="preserve">(code)</text><text x="378" y="116" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">required sections?</text><text x="378" y="132" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">under the length limit?</text><line x1="424" y1="62" x2="470" y2="62" class="s-green" stroke-width="1.5" marker-end="url(#ah-green)"/><text x="446" y="52" font-size="12" text-anchor="middle" class="t-green" xml:space="preserve">pass</text><rect x="472" y="40" width="160" height="44" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="552" y="53.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">call 2</text><text x="552" y="70.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">write the document</text><line x1="632" y1="62" x2="660" y2="62" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="662" y="40" width="96" height="44" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="710" y="62" font-size="13.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">document</text><line x1="378" y1="140" x2="378" y2="176" class="s-red" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-red)"/><text x="378" y="194" font-size="12.5" text-anchor="middle" class="t-red" xml:space="preserve">fail: stop or retry call 1</text><text x="20" y="194" font-size="12.5" class="t-ink" xml:space="preserve">Each step is its own API call:</text><text x="20" y="212" font-size="12.5" class="t-ink" xml:space="preserve">log, test or branch on any of them.</text></g>
<text x="24" y="287" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Example adapted from Anthropic, “Building effective agents” (2024).</text>
</svg>
