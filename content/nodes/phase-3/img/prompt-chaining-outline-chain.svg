<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 780 298" width="780" height="298" role="img" aria-labelledby="fig-1wlocwu-t fig-1wlocwu-d">
<title id="fig-1wlocwu-t">A prompt chain: each step feeds the next, with a check between</title>
<desc id="fig-1wlocwu-d">A three-step prompt chain. Call 1 writes an outline. A gate in code checks the outline against fixed rules; if it fails, the chain stops or retries. If it passes, call 2 writes the document from the outline. Each arrow carries the previous step's output as the next step's input.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
