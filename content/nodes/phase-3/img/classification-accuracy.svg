<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 700 430" width="700" height="430" role="img" aria-labelledby="fig-dgxoks-t fig-dgxoks-d">
<title id="fig-dgxoks-t">Retrieved examples did most of the work: 10 classes, 68 test tickets</title>
<desc id="fig-dgxoks-d">Bar chart of accuracy on 68 test tickets with 10 categories, from Anthropic's classification cookbook. Random guessing: about 10%. A prompt with category definitions only: about 70%. Adding the 5 most similar labelled tickets as examples: 94%. Adding step-by-step reasoning before the label: 97%. A separate re-run with Promptfoo gave 70.6%, 94.1% and 95.6% for the same three setups. The ticket-routing guide quotes the retrieval step as 71% to 93%.</desc>
<style>
