d" xml:space="preserve">(ticket-routing guide: 71% to 93%)</text></g>
<text x="24" y="419" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Data: Anthropic, “Classification with Claude” cookbook (Claude Haiku 4.5, insurance tickets). One ticket is about 1.5 points.</text>
