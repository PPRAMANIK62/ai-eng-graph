<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 880 279" width="880" height="279" role="img" aria-labelledby="fig-1f7rjj5-t fig-1f7rjj5-d">
<title id="fig-1f7rjj5-t">A batch: many ordinary requests, one job, results later</title>
<desc id="fig-1f7rjj5-d">How a batch runs. You build a list of ordinary requests, each with a custom_id such as ticket-1, ticket-2 and ticket-3. You submit it as one batch and poll its status. Most batches finish within an hour; anything not done in 24 hours expires. Results come back as a file in any order, for example ticket-3, ticket-1, ticket-2, and you match them to requests by custom_id. Each result is succeeded, errored, canceled or expired. Everything is billed at 50% of the normal price.</desc>
