<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">A batch: many ordinary requests, one job, results later</text>
<g transform="translate(0 44)"><text x="20" y="10" font-size="13.5" font-weight="700" class="t-blue" xml:space="preserve">1. Your requests</text><rect x="20" y="26" width="190" height="36" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="32" y="44" font-size="12" dominant-baseline="central" class="t-ink mono" xml:space="preserve">custom_id: ticket-1</text><rect x="20" y="70" width="190" height="36" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="32" y="88" font-size="12" dominant-baseline="central" class="t-ink mono" xml:space="preserve">custom_id: ticket-2</text><rect x="20" y="114" width="190" height="36" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="32" y="132" font-size="12" dominant-baseline="central" class="t-ink mono" xml:space="preserve">custom_id: ticket-3</text><text x="20" y="172" font-size="12" font-style="italic" class="t-muted" xml:space="preserve">each an ordinary request</text><line x1="214" y1="92" x2="262" y2="92" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="268" y="10" font-size="13.5" font-weight="700" class="t-orange" xml:space="preserve">2. One batch, run later</text><rect x="268" y="40" width="220" height="104" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="378" y="92" font-size="14" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve"></text><text x="378" y="66" font-size="13" text-anchor="middle" font-weight="600" class="t-ink" xml:space="preserve">submit, then poll</text><text x="378" y="92" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">most finish within 1 hour*</text><text x="378" y="114" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">not done in 24 hours: expires</text><text x="378" y="172" font-size="12" text-anchor="middle" font-style="italic" class="t-muted" xml:space="preserve">billed at 50% of the normal price</text><line x1="492" y1="92" x2="540" y2="92" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="546" y="10" font-size="13.5" font-weight="700" class="t-green" xml:space="preserve">3. Results, in any order</text><rect x="546" y="26" width="250" height="36" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="558" y="44" font-size="12" dominant-baseline="central" class="t-ink mono" xml:space="preserve">ticket-3</text><text x="784" y="44" font-size="12" text-anchor="end" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">succeeded</text><rect x="546" y="70" width="250" height="36" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="558" y="88" font-size="12" dominant-baseline="central" class="t-ink mono" xml:space="preserve">ticket-1</text><text x="784" y="88" font-size="12" text-anchor="end" font-weight="600" dominant-baseline="central" class="t-red" xml:space="preserve">errored</text><rect x="546" y="114" width="250" height="36" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="558" y="132" font-size="12" dominant-baseline="central" class="t-ink mono" xml:space="preserve">ticket-2</text><text x="784" y="132" font-size="12" text-anchor="end" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">succeeded</text><text x="546" y="172" font-size="12" font-style="italic" class="t-muted" xml:space="preserve">match on custom_id, never on position</text><text x="546" y="192" font-size="12" class="t-muted" xml:space="preserve">result types: succeeded, errored, canceled, expired</text></g>
<text x="24" y="268" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">From Anthropic's Message Batches and OpenAI's Batch API docs (both 50% off, 24-hour window). *Anthropic's figure.</text>
