<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="fig-1lv7aen-t fig-1lv7aen-d">
<title id="fig-1lv7aen-t">Five workflow patterns, and an agent for contrast</title>
<desc id="fig-1lv7aen-d">Five workflow patterns as small flow diagrams. Prompt chaining: call, gate, call in a line. Routing: a router sends the input to one of several specialist calls. Parallelization: several calls run at once and an aggregator combines them. Orchestrator-workers: one call decides the subtasks at run time and hands them to workers. Evaluator-optimizer: a generator and an evaluator in a loop until the output passes. For contrast, an agent: the model calls tools in a loop and decides when to stop.</desc>
