00" dominant-baseline="central" class="t-green" xml:space="preserve">1.49x</text><text x="244.65" y="124" font-size="12" dominant-baseline="central" class="t-muted" xml:space="preserve">87% of GPT-4's score</text><text x="98" y="171.67" font-size="13" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">MMLU</text><rect x="110" y="159.67" width="119.85" height="24" rx="2" class="f-green"/><text x="237.85" y="164.67" font-size="12.5" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">1.41x</text><text x="237.85" y="180.67" font-size="12" dominant-baseline="central" class="t-muted" xml:space="preserve">92%, only with ~1,500 MMLU labels added</text><line x1="110" y1="24" x2="110" y2="200" class="axis" stroke-width="1.5"/></g>
<text x="24" y="313" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Data: Ong et al., “RouteLLM” (2024), Table 6. Strong model GPT-4, weak model Mixtral-8x7B.</text>
