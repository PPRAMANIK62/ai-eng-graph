<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 740 324" width="740" height="324" role="img" aria-labelledby="fig-1mwjlwd-t fig-1mwjlwd-d">
<title id="fig-1mwjlwd-t">Routing easy questions to a cheap model saved 1.4x to 3.7x (2024)</title>
<desc id="fig-1mwjlwd-d">Bar chart of cost savings from RouteLLM's best routers, counted as how many fewer GPT-4 calls they needed than a random split to reach the same quality. MT Bench 3.66 times cheaper at 95% of GPT-4's score. GSM8K 1.49 times at 87%. MMLU 1.41 times at 92%, but only after adding about 1,500 labeled MMLU examples: routers trained only on chat preference data did no better than random on MMLU.</desc>
