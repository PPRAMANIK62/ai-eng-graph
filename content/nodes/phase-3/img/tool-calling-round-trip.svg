<g transform="translate(0 44)"><rect x="40" y="0" width="220" height="38" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="150" y="19" font-size="14" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Your app</text><rect x="580" y="0" width="220" height="38" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="690" y="19" font-size="14" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Model (via the API)</text><line x1="150" y1="38" x2="150" y2="470" class="grid" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="690" y1="38" x2="690" y2="470" class="grid" stroke-width="1.5" stroke-dasharray="5 4"/><text x="24" y="70" font-size="18" font-weight="700" class="t-muted display" xml:space="preserve">1</text><line x1="156" y1="80" x2="682" y2="80" class="s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><text x="420" y="70" font-size="13" text-anchor="middle" font-weight="700" class="t-blue" xml:space="preserve">Request 1: messages + tools</text><text x="420" y="100" font-size="12.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">user: &quot;What's the weather in San Francisco?&quot;</text><text x="420" y="118" font-size="12.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">tools: [get_weather(location)]</text><text x="24" y="168" font-size="18" font-weight="700" class="t-muted display" xml:space="preserve">2</text><line x1="684" y1="178" x2="158" y2="178" class="s-orange" stroke-width="2" marker-end="url(#ah-orange)"/><text x="420" y="168" font-size="13" text-anchor="middle" font-weight="700" class="t-orange" xml:space="preserve">Reply: stop_reason &quot;tool_use&quot;</text><text x="420" y="198" font-size="12.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">tool_use: get_weather</text><text x="420" y="216" font-size="12.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">{&quot;location&quot;: &quot;San Francisco, CA&quot;}</text><rect x="20" y="236" width="260" height="62" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="150" y="258" font-size="13" text-anchor="middle" font-weight="700" class="t-green" xml:space="preserve">Your code runs get_weather</text><text x="150" y="280" font-size="12" text-anchor="middle" class="t-ink mono" xml:space="preserve">&quot;15 degrees Celsius, partly cloudy&quot;</text><text x="24" y="272" font-size="18" font-weight="700" class="t-muted display" xml:space="preserve">3</text><text x="690" y="266" font-size="12.5" text-anchor="middle" font-style="italic" class="t-muted" xml:space="preserve">the model waits:</text><text x="690" y="284" font-size="12.5" text-anchor="middle" font-style="italic" class="t-muted" xml:space="preserve">it can't run your code</text><text x="24" y="334" font-size="18" font-weight="700" class="t-muted display" xml:space="preserve">4</text><line x1="156" y1="344" x2="682" y2="344" class="s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><text x="420" y="334" font-size="13" text-anchor="middle" font-weight="700" class="t-blue" xml:space="preserve">Request 2: whole history + tool_result</text><text x="420" y="364" font-size="12.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">tool_result (same id as the call):</text><text x="420" y="382" font-size="12.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">&quot;15 degrees Celsius, partly cloudy&quot;</text><text x="24" y="432" font-size="18" font-weight="700" class="t-muted display" xml:space="preserve">5</text><line x1="684" y1="442" x2="158" y2="442" class="s-orange" stroke-width="2" marker-end="url(#ah-orange)"/><text x="420" y="432" font-size="13" text-anchor="middle" font-weight="700" class="t-orange" xml:space="preserve">Reply: stop_reason &quot;end_turn&quot;</text><text x="420" y="462" font-size="12.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">&quot;The current weather in San Francisco is</text><text x="420" y="480" font-size="12.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">15 degrees Celsius with partly cloudy skies.&quot;</text></g>
