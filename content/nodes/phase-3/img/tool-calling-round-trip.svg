<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 860 574" width="860" height="574" role="img" aria-labelledby="fig-u4jxy1-t fig-u4jxy1-d">
<title id="fig-u4jxy1-t">A tool call is a round trip through your code</title>
<desc id="fig-u4jxy1-d">The tool-calling round trip for one question. Request 1: your app sends the user's message and the get_weather tool definition. The model replies with stop_reason tool_use and a tool_use block naming get_weather with location San Francisco, CA. Your code runs the lookup and gets &quot;15 degrees Celsius, partly cloudy&quot;. Request 2: your app sends the whole history plus a tool_result block with that text, linked by the call's id. The model replies with end_turn and the answer in plain words. The model never runs the function; your code does.</desc>
