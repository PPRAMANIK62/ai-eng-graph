<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="930" height="384"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">How codec-based text-to-speech works</text>
<g transform="translate(0 44)"><text x="20" y="10" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">Predict codec codes like text tokens, then decode them to sound</text><rect x="20" y="40" width="150" height="30" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="95" y="55" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">text to say</text><rect x="20" y="80" width="150" height="30" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="95" y="95" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">3-second voice sample</text><line x1="172" y1="55" x2="208" y2="85" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="172" y1="95" x2="208" y2="95" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="210" y="60" width="170" height="52" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="295" y="77.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">model 1: first code</text><text x="295" y="94.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">of each frame, in order</text><line x1="382" y1="86" x2="412" y2="86" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="414" y="60" width="170" height="52" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="499" y="77.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">model 2: fills in</text><text x="499" y="94.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">the other 7 codes</text><line x1="586" y1="86" x2="616" y2="86" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="618" y="60" width="120" height="52" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="678" y="86" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">codec decoder</text><line x1="740" y1="86" x2="770" y2="86" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><path d="M772,86 L772.0,85.0 L774.6,93.6 L777.2,73.9 L779.8,99.2 L782.4,75.1 L785.0,92.5 L787.6,84.0 L790.2,88.8 L792.8,82.8 L795.4,87.6 L798.0,83.3 L800.6,89.9 L803.2,83.2 L805.8,88.8 L808.4,78.3 L811.0,97.9 L813.6,72.4 L816.2,97.8 L818.8,79.2 L821.4,88.0 L824.0,77.6 L826.6,98.2 L829.2,73.4 L831.8,95.8 L834.4,80.6 L837.0,87.4 L839.6,83.3 L842.2,88.4 L844.8,84.3 L847.4,89.8 L850.0,81.6 L852.6,88.5 L855.2,82.3 L857.8,94.8 L860.4,73.2 L863.0,99.9 L865.6,74.6 L868.2,91.8 L870.8,82.9 L873.4,95.0 L876.0,73.9 L878.6,97.8 L881.2,77.3 L883.8,90.4 L886.4,85.0 L889.0,88.4 L891.6,84.6 L894.2,88.9 L896.8,81.2 L899.4,90.8 L902.0,83.9" class="s-grey" fill="none" stroke-width="1.2"/><text x="837" y="124" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">waveform</text><line x1="20" y1="138" x2="910" y2="138" class="grid" stroke-width="1"/><text x="20" y="158" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">Why: ten seconds of speech, counted two ways</text><text x="238" y="201" font-size="12.5" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">raw 24 kHz samples</text><rect x="250" y="190" width="640" height="22" rx="2" class="fs-grey s-grey" stroke-width="1.5"/><text x="260" y="201" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">240,000 values, each 1 of 65,536</text><text x="238" y="251" font-size="12.5" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">codec frames (75 a second)</text><rect x="250" y="240" width="3" height="22" rx="2" class="f-blue"/><text x="263" y="251" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">750 frames × 8 codes = 6,000 codes, each 1 of 1,024</text><text x="250" y="300" font-size="12" class="t-muted" xml:space="preserve">320 times fewer time steps in the sequence the model predicts</text></g>
<text x="24" y="373" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from Wang et al., “Neural Codec Language Models are Zero-Shot Text to Speech Synthesizers” (VALL-E, Microsoft, 2023).</text>
</svg>
