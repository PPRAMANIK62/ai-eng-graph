<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Page images are what make a PDF expensive</text>
<g transform="translate(0 44)"><line x1="254" y1="0" x2="254" y2="204" class="grid" stroke-width="1"/><text x="254" y="220" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">0</text><line x1="368.29" y1="0" x2="368.29" y2="204" class="grid" stroke-width="1"/><text x="368.29" y="220" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">2,000</text><line x1="482.57" y1="0" x2="482.57" y2="204" class="grid" stroke-width="1"/><text x="482.57" y="220" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">4,000</text><line x1="596.86" y1="0" x2="596.86" y2="204" class="grid" stroke-width="1"/><text x="596.86" y="220" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">6,000</text><text x="244" y="19" font-size="12.5" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">Claude on Bedrock, text only</text><rect x="254" y="6" width="57.14" height="26" rx="2" class="f-grey"/><text x="319.14" y="12" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-grey" xml:space="preserve">~1,000</text><text x="319.14" y="27" font-size="11.5" dominant-baseline="central" class="t-muted" xml:space="preserve">can't see charts or layout</text><text x="244" y="57" font-size="12.5" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">Claude on Bedrock, text + images</text><rect x="254" y="44" width="400" height="26" rx="2" class="f-orange"/><text x="662" y="50" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">~7,000</text><text x="662" y="65" font-size="11.5" dominant-baseline="central" class="t-muted" xml:space="preserve">sees charts and layout</text><text x="244" y="105" font-size="12.5" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">Gemini 3, low</text><rect x="254" y="92" width="48" height="26" rx="2" class="f-blue"/><text x="310" y="98" font-