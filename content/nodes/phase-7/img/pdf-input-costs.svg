<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 844 348" width="844" height="348" role="img" aria-labelledby="fig-a8xnrn-t fig-a8xnrn-d">
<title id="fig-a8xnrn-t">Page images are what make a PDF expensive</title>
<desc id="fig-a8xnrn-d">Bar chart of input tokens for a 3-page PDF. Claude on Amazon Bedrock, text only: about 1,000 tokens, and the model can't see charts. Claude, text plus page images: about 7,000. Gemini 3, page images at low resolution: 840; default: 1,680; high: 3,360. On Gemini 3 the PDF's own text is read but not charged.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
