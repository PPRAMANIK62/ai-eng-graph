<text x="24" y="337" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">As of 2026-09. Claude: Anthropic PDF docs (Amazon Bedrock modes). Gemini: media resolution docs, 3 pages × per-page tokens.</text>
