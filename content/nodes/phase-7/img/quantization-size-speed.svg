<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 870 370" width="870" height="370" role="img" aria-labelledby="fig-4kct1u-t fig-4kct1u-d">
<title id="fig-4kct1u-t">Fewer bits: a smaller file and faster decode</title>
<desc id="fig-4kct1u-d">Two bar charts for Llama 3.1 8B in llama.cpp at five quantization levels. File size: F16 14.96 GiB, Q8_0 7.95, Q6_K 6.14, Q4_K_M 4.58, Q2_K 2.95. Text generation speed: F16 29 tokens per second, Q8_0 51, Q6_K 59, Q4_K_M 72, Q2_K 80. Prompt processing barely changes, from 923 tokens per second at F16 to between 784 and 865 for the quantized types.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
