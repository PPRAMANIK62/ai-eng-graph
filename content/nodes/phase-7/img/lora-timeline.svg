<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 730 274" width="730" height="274" role="img" aria-labelledby="fig-cde5vz-t fig-cde5vz-d">
<title id="fig-cde5vz-t">Does LoRA match full fine-tuning? The answer changed</title>
<desc id="fig-cde5vz-d">A timeline of findings on LoRA versus full fine-tuning. 2021, the LoRA paper: on par or better on RoBERTa, DeBERTa, GPT-2 and GPT-3. 2024, LoRA Learns Less and Forgets Less: on code and math, with about 100,000 instruction pairs or 20 billion tokens of continued pretraining, LoRA substantially underperformed, but forgot less outside the target domain. 2025, LoRA Without Regret: with LoRA on all layers and about a 10 times higher learning rate, it matched full fine-tuning on post-training-sized data and in reinforcement learning, and still fell short only when the data was too big for the adapter.</desc>
