<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 376" width="900" height="376" role="img" aria-labelledby="fig-n8jpg3-t fig-n8jpg3-d">
<title id="fig-n8jpg3-t">A conversation past the context window loses its oldest messages</title>
<desc id="fig-n8jpg3-d">Diagram of a long conversation sent to a model loaded with Ollama's default context window of 4,096 tokens. The messages run from oldest to newest. The conversation is longer than the window, so the oldest messages are dropped from the front and only the newest ones that fit are kept. The request still returns an answer, with no error and no field in the response saying anything was cut.</desc>
<style>
