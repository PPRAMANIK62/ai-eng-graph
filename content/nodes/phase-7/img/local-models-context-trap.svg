preserve">turn 5</text><rect x="27" y="76" width="339" height="58" rx="6" class="s-red" fill="none" stroke-width="2" stroke-dasharray="5 4"/><path d="M30,142 L30,150 L366,150 L366,142 M198,150 L198,158" class="s-red" stroke-width="1.5" fill="none"/><text x="198" y="172" font-size="12.5" text-anchor="middle" class="t-red" xml:space="preserve">oldest messages dropped from the front</text><path d="M370,76 L370,68 L870,68 L870,76 M620,68 L620,60" class="s-green" stroke-width="1.5" fill="none"/><text x="620" y="54" font-size="12.5" text-anchor="middle" class="t-green" xml:space="preserve">what the model sees: the newest messages that fit</text><line x1="30" y1="188" x2="870" y2="188" class="grid" stroke-width="1"/><text x="30" y="210" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">What comes back</text><rect x="30" y="224" width="250" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="155" y="244" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">an answer</text><rect x="300" y="224" width="250" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="425" y="244" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">no error</text><rect x="570" y="224" width="300" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="720" y="244" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">no field saying anything was cut</text><text x="30" y="290" font-size="12.5" class="t-muted" xml:space="preserve">The model answers without the earliest turns. Fix: set the context length and check it.</text></g>
