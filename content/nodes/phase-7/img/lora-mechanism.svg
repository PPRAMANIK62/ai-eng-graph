<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 720 600" width="720" height="600" role="img" aria-labelledby="fig-nylo6f-t fig-nylo6f-d">
<title id="fig-nylo6f-t">LoRA: freeze W, train a thin correction beside it</title>
<desc id="fig-nylo6f-d">Diagram of one LoRA layer. The input goes through the frozen weight matrix W, N by N, and also through two small trainable matrices, A (r by N) then B (N by r), whose output is scaled and added to W's output. Below, parameter counts from Thinking Machines for Llama-3.1-8B: LoRA on all layers at rank 256 trains 0.70 billion parameters, attention-only at rank 256 trains 0.25 billion, against all of the roughly 8 billion for full fine-tuning. The original LoRA paper reports 10,000 times fewer trainable parameters than full fine-tuning of GPT-3 175B.</desc>
