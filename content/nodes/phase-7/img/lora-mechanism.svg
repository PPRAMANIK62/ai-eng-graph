<g transform="translate(0 44)"><rect x="20" y="95" width="80" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="60" y="115" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">input x</text><rect x="170" y="20" width="150" height="150" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="245" y="85" font-size="22" text-anchor="middle" font-weight="700" class="t-ink display" xml:space="preserve">W</text><text x="245" y="110" font-size="12.5" text-anchor="middle" class="t-muted" xml:space="preserve">N × N, frozen</text><line x1="100" y1="115" x2="168" y2="95" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="170" y="200" width="150" height="22" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="245" y="211" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">A  (r × N)</text><rect x="350" y="180" width="22" height="150" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="361" y="345" font-size="12.5" text-anchor="middle" font-weight="600" class="t-blue" xml:space="preserve">B</text><text x="361" y="361" font-size="12" text-anchor="middle" class="t-blue" xml:space="preserve">(N × r)</text><text x="245" y="244" font-size="12" text-anchor="middle" class="t-blue" xml:space="preserve">trainable, rank r is small</text><text x="245" y="260" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">B starts at zero</text><line x1="100" y1="120" x2="168" y2="208" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="320" y1="211" x2="348" y2="211" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><circle cx="460" cy="115" r="16" class="s-ink" fill="none" stroke-width="1.5"/><text x="460" y="116" font-size="18" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">+</text><line x1="320" y1="95" x2="442" y2="110" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="372" y1="250" x2="448" y2="128" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><text x="420" y="205" font-size="13" font-weight="600" class="t-blue" xml:space="preserve">× γ</text><line x1="476" y1="115" x2="530" y2="115" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="532" y="95" width="90" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="577" y="115" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">output</text><text x="577" y="170" font-size="14" text-anchor="middle" font-weight="600" class="t-ink mono" xml:space="preserve">W′ = W + γBA</text><line x1="20" y1="376" x2="700" y2="376" class="grid" stroke-width="1"/><text x="20" y="396" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">How many parameters get trained</text><text x="290" y="425" font-size="12.5" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">Llama-3.1-8B, all layers, rank 256</text><rect x="300" y="416" width="26.25" height="18" rx="2" class="f-blue"/><text x="334.25" y="425" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">0.70B</text><text x="290" y="453" font-size="12.5" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">Llama-3.1-8B, attention only, rank 256</text><rect x="300" y="444" width="9.38" height="18" rx="2" class="f-grey"/><text x="317.38" y="453" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-grey" xml:space="preserve">0.25B</text><text x="290" y="481" font-size="12.5" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">full fine-tuning of the same model</text><rect x="300" y="472" width="300" height="18" rx="2" class="f-muted"/><text x="608" y="481" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-muted" xml:space="preserve">all ~8B</text><text x="20" y="516" font-size="12.5" class="t-muted" xml:space="preserve">On GPT-3 175B (2021), LoRA trained 10,000 times fewer parameters than full fine-tuning.</text></g>
<text x="24" y="589" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Parameter counts: Thinking Machines, “LoRA Without Regret” (2025). 10,000×: Hu et al. (2021).</text>
</svg>
