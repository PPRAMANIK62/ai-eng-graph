<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 314" width="900" height="314" role="img" aria-labelledby="fig-1x2ihhl-t fig-1x2ihhl-d">
<title id="fig-1x2ihhl-t">An image becomes tokens the LLM reads next to your text</title>
<desc id="fig-1x2ihhl-d">The path from an image to an answer. A photo is cut into a grid of square patches. Each patch goes through the vision encoder, a transformer, and comes out as a vector. A projection maps each vector to the size of the LLM's word embeddings, making it a visual token. The visual tokens sit in one sequence with the text tokens of the question, and the LLM reads them all together to write the answer. Example: a 1000×1000 image in 28-pixel patches is 36×36 = 1,296 visual tokens.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
