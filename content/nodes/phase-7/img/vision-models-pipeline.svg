<g transform="translate(0 44)"><text x="24" y="12" font-size="14" font-weight="700" class="t-blue" xml:space="preserve">1. Cut into patches</text><rect x="24" y="40" width="22" height="22" rx="0" class="fs-blue s-blue" stroke-width="1"/><rect x="46" y="40" width="22" height="22" rx="0" class="fs-orange s-orange" stroke-width="1"/><rect x="68" y="40" width="22" height="22" rx="0" class="fs-green s-green" stroke-width="1"/><rect x="90" y="40" width="22" height="22" rx="0" class="fs-purple s-purple" stroke-width="1"/><rect x="112" y="40" width="22" height="22" rx="0" class="fs-blue s-blue" stroke-width="1"/><rect x="134" y="40" width="22" height="22" rx="0" class="fs-orange s-orange" stroke-width="1"/><rect x="24" y="62" width="22" height="22" rx="0" class="fs-orange s-orange" stroke-width="1"/><rect x="46" y="62" width="22" height="22" rx="0" class="fs-green s-green" stroke-width="1"/><rect x="68" y="62" width="22" height="22" rx="0" class="fs-purple s-purple" stroke-width="1"/><rect x="90" y="62" width="22" height="22" rx="0" class="fs-blue s-blue" stroke-width="1"/><rect x="112" y="62" width="22" height="22" rx="0" class="fs-orange s-orange" stroke-width="1"/><rect x="134" y="62" width="22" height="22" rx="0" class="fs-green s-green" stroke-width="1"/><rect x="24" y="84" width="22" height="22" rx="0" class="fs-green s-green" stroke-width="1"/><rect x="46" y="84" width="22" height="22" rx="0" class="fs-purple s-purple" stroke-width="1"/><rect x="68" y="84" width="22" height="22" rx="0" class="fs-blue s-blue" stroke-width="1"/><rect x="90" y="84" width="22" height="22" rx="0" class="fs-orange s-orange" stroke-width="1"/><rect x="112" y="84" width="22" height="22" rx="0" class="fs-green s-green" stroke-width="1"/><rect x="134" y="84" width="22" height="22" rx="0" class="fs-purple s-purple" stroke-width="1"/><rect x="24" y="106" width="22" height="22" rx="0" class="fs-purple s-purple" stroke-width="1"/><rect x="46" y="106" width="22" height="22" rx="0" class="fs-blue s-blue" stroke-width="1"/><rect x="68" y="106" width="22" height="22" rx="0" class="fs-orange s-orange" stroke-width="1"/><rect x="90" y="106" width="22" height="22" rx="0" class="fs-green s-green" stroke-width="1"/><rect x="112" y="106" width="22" height="22" rx="0" class="fs-purple s-purple" stroke-width="1"/><rect x="134" y="106" width="22" height="22" rx="0" class="fs-blue s-blue" stroke-width="1"/><rect x="24" y="128" width="22" height="22" rx="0" class="fs-blue s-blue" stroke-width="1"/><rect x="46" y="128" width="22" height="22" rx="0" class="fs-orange s-orange" stroke-width="1"/><rect x="68" y="128" width="22" height="22" rx="0" class="fs-green s-green" stroke-width="1"/><rect x="90" y="128" width="22" height="22" rx="0" class="fs-purple s-purple" stroke-width="1"/><rect x="112" y="128" width="22" height="22" rx="0" class="fs-blue s-blue" stroke-width="1"/><rect x="134" y="128" width="22" height="22" rx="0" class="fs-orange s-orange" stroke-width="1"/><rect x="24" y="150" width="22" height="22" rx="0" class="fs-orange s-orange" stroke-width="1"/><rect x="46" y="150" width="22" height="22" rx="0" class="fs-green s-green" stroke-width="1"/><rect x="68" y="150" width="22" height="22" rx="0" class="fs-purple s-purple" stroke-width="1"/><rect x="90" y="150" width="22" height="22" rx="0" class="fs-blue s-blue" stroke-width="1"/><rect x="112" y="150" width="22" height="22" rx="0" class="fs-orange s-orange" stroke-width="1"/><rect x="134" y="150" width="22" height="22" rx="0" class="fs-green s-green" stroke-width="1"/><text x="24" y="194" font-size="12.5" class="t-muted" xml:space="preserve">1000×1000 image,</text><text x="24" y="212" font-size="12.5" class="t-muted" xml:space="preserve">28-px patches: 36×36</text><text x="24" y="230" font-size="12.5" class="t-muted" xml:space="preserve">= 1,296 patches</text><line x1="164" y1="106" x2="194" y2="106" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="200" y="12" font-size="14" font-weight="700" class="t-orange" xml:space="preserve">2. Vision encoder</text><rect x="200" y="46" width="150" height="120" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="275" y="81.63" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">flatten + linear</text><text x="275" y="97.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">layer, add</text><text x="275" y="114.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">position, then a</text><text x="275" y="130.38" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">transformer</text><text x="200" y="190" font-size="12.5" class="t-muted" xml:space="preserve">one vector per patch</text><line x1="356" y1="106" x2="394" y2="106" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="400" y="12" font-size="14" font-weight="700" class="t-purple" xml:space="preserve">3. Projection</text><rect x="400" y="76" width="120" height="60" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="460" y="97.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">maps to word-</text><text x="460" y="114.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">embedding size</text><line x1="526" y1="106" x2="564" y2="106" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="570" y="12" font-size="14" font-weight="700" class="t-green" xml:space="preserve">4. One sequence into the LLM</text><rect x="570" y="90" width="26" height="32" rx="3" class="fs-purple s-purple" stroke-width="1.2"/><rect x="600" y="90" width="26" height="32" rx="3" class="fs-purple s-purple" stroke-width="1.2"/><rect x="630" y="90" width="26" height="32" rx="3" class="fs-purple s-purple" stroke-width="1.2"/><rect x="660" y="90" width="26" height="32" rx="3" class="fs-purple s-purple" stroke-width="1.2"/><rect x="690" y="90" width="26" height="32" rx="3" class="fs-purple s-purple" stroke-width="1.2"/><text x="722" y="106" font-size="14" dominant-baseline="central" class="t-muted" xml:space="preserve">…</text><rect x="740" y="90" width="54" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="767" y="106" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">What's</text><rect x="798" y="90" width="28" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="812" y="106" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">in</text><rect x="830" y="90" width="46" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="853" y="106" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">this?</text><text x="570" y="144" font-size="12.5" class="t-purple" xml:space="preserve">visual tokens</text><text x="740" y="144" font-size="12.5" class="t-muted" xml:space="preserve">text tokens</text><line x1="720" y1="156" x2="720" y2="182" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="630" y="186" width="180" height="36" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="720" y="204" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">LLM writes the answer</text></g>
<text x="24" y="303" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Mechanism from ViT (Dosovitskiy et al., 2020) and LLaVA (Liu et al., 2023). Patch count from Anthropic's vision docs.</text>
</svg>
