<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 820 404" width="820" height="404" role="img" aria-labelledby="fig-1xcssyo-t fig-1xcssyo-d">
<title id="fig-1xcssyo-t">At 4 bits the method matters a little; at 3 bits it matters a lot</title>
<desc id="fig-1xcssyo-d">Grouped bar chart of WikiText2 perplexity for LLaMA3-8B, lower is better. The 16-bit model scores 6.1. At 4 bits: round-to-nearest 8.5, GPTQ 6.5, AWQ 6.6. At 3 bits: round-to-nearest 27.9, GPTQ 8.2, AWQ 8.2. At 2 bits all three are far off the chart: round-to-nearest about 1,900, GPTQ about 210, AWQ about 1.7 million.</desc>
