<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 740 264" width="740" height="264" role="img" aria-labelledby="fig-148f3al-t fig-148f3al-d">
<title id="fig-148f3al-t">Distilling from a big model beat RL on the small one</title>
<desc id="fig-148f3al-d">Bar chart of AIME 2024 pass@1 accuracy for 32B-parameter models, from the DeepSeek-R1 paper (January 2025). Qwen-32B trained with large-scale reinforcement learning scored 47.0%. QwQ-32B-Preview scored 50.0%. Qwen-32B distilled from DeepSeek-R1 with supervised fine-tuning only scored 72.6%.</desc>
<style>
