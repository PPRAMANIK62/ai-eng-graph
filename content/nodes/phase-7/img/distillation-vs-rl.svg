<g transform="translate(0 44)"><text x="20" y="8" font-size="12.5" class="t-muted" xml:space="preserve">AIME 2024 accuracy (pass@1), same model size</text><text x="220" y="58.85" font-size="13" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">Qwen-32B + large-scale RL</text><rect x="230" y="41.54" width="252.63" height="34.62" rx="2" class="f-grey"/><text x="490.63" y="58.85" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-grey" xml:space="preserve">47.0%</text><text x="220" y="105" font-size="13" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">QwQ-32B-Preview</text><rect x="230" y="87.69" width="268.75" height="34.62" rx="2" class="f-grey"/><text x="506.75" y="105" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-grey" xml:space="preserve">50.0%</text><text x="220" y="151.15" font-size="13" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">Qwen-32B distilled from R1</text><rect x="230" y="133.85" width="390.22" height="34.62" rx="2" class="f-blue"/><text x="628.22" y="151.15" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">72.6%</text><line x1="230" y1="30" x2="230" y2="180" class="axis" stroke-width="1.5"/></g>
