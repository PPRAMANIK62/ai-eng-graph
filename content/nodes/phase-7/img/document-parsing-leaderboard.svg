<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 874 442" width="874" height="442" role="img" aria-labelledby="fig-gu0dlq-t fig-gu0dlq-d">
<title id="fig-gu0dlq-t">On OmniDocBench, small specialized models lead</title>
<desc id="fig-gu0dlq-d">Bar chart of OmniDocBench overall scores as of 2026-09. Specialized vision models: TeleOCR 96.91, PaddleOCR-VL 94.18, olmOCR 85.74, Mistral OCR (the 2025 model) 85.66. General vision models: Gemini 3 Pro 92.91, GPT-5.2 86.59. Pipeline tools: MinerU pipeline 86.47, Marker 78.44. Mistral OCR 4's self-reported 93.07 is shown separately as a dashed outline, because it isn't on the leaderboard.</desc>
