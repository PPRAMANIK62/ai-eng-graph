<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 870 392" width="870" height="392" role="img" aria-labelledby="fig-1p97rwv-t fig-1p97rwv-d">
<title id="fig-1p97rwv-t">Choosing between prompting, RAG and fine-tuning</title>
<desc id="fig-1p97rwv-d">A decision flow for choosing between prompting, RAG and fine-tuning. Start by measuring the task with evals. If the model is missing facts, use RAG. If the output is wrong in format, labels or style, first try instructions and few-shot examples. If that works, stop. If it still fails, or the prompt got long and costly at high volume, and you have enough good labeled examples, fine-tune. Each path ends in running the evals again.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
