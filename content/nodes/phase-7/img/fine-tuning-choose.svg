<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="870" height="392"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Choosing between prompting, RAG and fine-tuning</text>
<g transform="translate(0 44)"><rect x="20" y="110" width="140" height="50" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="90" y="126.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Measure the task</text><text x="90" y="143.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">with evals</text><text x="90" y="180" font-size="12.5" text-anchor="middle" class="t-muted" xml:space="preserve">What's wrong?</text><line x1="160" y1="125" x2="218" y2="60" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="160" y1="145" x2="218" y2="210" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="226" y="20" font-size="12.5" font-weight="600" class="t-orange" xml:space="preserve">It's missing facts</text><rect x="220" y="34" width="180" height="50" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="310" y="50.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Use RAG: put the</text><text x="310" y="67.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">documents in the prompt</text><text x="226" y="176" font-size="12.5" font-weight="600" class="t-blue" xml:space="preserve">Wrong format, labels or style</text><rect x="220" y="190" width="180" height="50" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="310" y="206.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Instructions plus</text><text x="310" y="223.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">few-shot examples</text><line x1="400" y1="215" x2="448" y2="215" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="450" y="190" width="120" height="50" rx="6" class="s-grey" fill="none" stroke-width="1.5"/><text x="510" y="206.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Passes</text><text x="510" y="223.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">the evals?</text><line x1="510" y1="190" x2="510" y2="150" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="518" y="172" font-size="12" class="t-muted" xml:space="preserve">yes</text><rect x="450" y="100" width="120" height="50" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="510" y="125" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Ship the prompt</text><line x1="570" y1="215" x2="688" y2="215" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="580" y="205" font-size="11.5" class="t-muted" xml:space="preserve">no, or too</text><text x="580" y="236" font-size="11.5" class="t-muted" xml:space="preserve">costly at volume</text><rect x="690" y="190" width="160" height="50" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="770" y="206.88" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Fine-tune on</text><text x="770" y="223.13" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">labeled examples</text><text x="770" y="262" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">needs a set of clean,</text><text x="770" y="278" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">labeled input-output pairs</text><line x1="20" y1="305" x2="850" y2="305" class="grid" stroke-width="1"/><text x="20" y="326" font-size="12.5" class="t-ink" xml:space="preserve">Every path ends the same way: run the evals again. The paths also combine: a fine-tuned model can still read retrieved documents.</text></g>

</svg>
