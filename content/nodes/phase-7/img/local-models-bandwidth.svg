<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 860 454" width="860" height="454" role="img" aria-labelledby="fig-1lq5sm2-t fig-1lq5sm2-d">
<title id="fig-1lq5sm2-t">Decode speed follows memory bandwidth</title>
<desc id="fig-1lq5sm2-d">Scatter chart of text generation speed against memory bandwidth for Apple M-series chips running Llama 2 7B with llama.cpp. At 4-bit (Q4_0): M1 at 68 GB/s makes 14 tokens per second, M2 at 100 GB/s 22, M4 at 120 GB/s 24, M3 Pro at 150 GB/s 31, M2 Pro at 200 GB/s 38, M4 Pro at 273 GB/s 51, M2 Max at 400 GB/s 61, M4 Max at 546 GB/s 83, M2 Ultra at 800 GB/s 94. At 16-bit (F16) every chip is much slower: M2 Ultra 41, M4 Max 32, M2 Max 24, M2 Pro 12. Speed rises with bandwidth in both cases.</desc>
