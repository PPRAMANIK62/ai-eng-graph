<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 336" width="900" height="336" role="img" aria-labelledby="fig-u585q7-t fig-u585q7-d">
<title id="fig-u585q7-t">Where the time goes in one voice agent turn</title>
<desc id="fig-u585q7-d">The time from the caller finishing speaking to hearing the first word of the reply, in one typical chained voice agent: about 114 ms to capture and send the audio, 300 ms for transcription and deciding the turn is over, 650 ms for the LLM's first token, 20 ms to collect a sentence, 120 ms for the first text-to-speech audio, and 89 ms to send and play it. Total 1,293 ms. A typical human reply comes after about 500 ms; 1,500 ms is the suggested target for a voice agent.</desc>
