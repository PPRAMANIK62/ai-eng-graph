<g transform="translate(0 44)"><rect x="30" y="60" width="58.35" height="44" rx="2" class="fs-grey s-grey" stroke-width="1.8"/><text x="59.93" y="30" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">audio in</text><text x="59.93" y="45" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">114 ms</text><rect x="89.85" y="60" width="156" height="44" rx="2" class="fs-blue s-blue" stroke-width="1.8"/><text x="168.6" y="82" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">300 ms</text><text x="168.6" y="122" font-size="12" text-anchor="middle" class="t-blue" xml:space="preserve">speech-to-text</text><text x="168.6" y="137" font-size="12" text-anchor="middle" class="t-blue" xml:space="preserve">+ end of turn</text><rect x="247.35" y="60" width="339.75" height="44" rx="2" class="fs-orange s-orange" stroke-width="1.8"/><text x="417.98" y="82" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">650 ms</text><text x="417.98" y="30" font-size="12" text-anchor="middle" class="t-orange" xml:space="preserve">LLM time to</text><text x="417.98" y="45" font-size="12" text-anchor="middle" class="t-orange" xml:space="preserve">first token</text><rect x="588.6" y="60" width="9" height="44" rx="2" class="fs-grey s-grey" stroke-width="1.8"/><text x="593.85" y="122" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">sentence</text><text x="593.85" y="137" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">20 ms</text><rect x="599.1" y="60" width="61.5" height="44" rx="2" class="fs-purple s-purple" stroke-width="1.8"/><text x="630.6" y="30" font-size="12" text-anchor="middle" class="t-purple" xml:space="preserve">TTS first audio</text><text x="630.6" y="45" font-size="12" text-anchor="middle" class="t-purple" xml:space="preserve">120 ms</text><rect x="662.1" y="60" width="45.23" height="44" rx="2" class="fs-grey s-grey" stroke-width="1.8"/><text x="718.83" y="75" font-size="12" dominant-baseline="central" class="t-muted" xml:space="preserve">audio out</text><text x="718.83" y="90" font-size="12" dominant-baseline="central" class="t-muted" xml:space="preserve">89 ms</text><line x1="292.5" y1="56" x2="292.5" y2="154" class="s-green" stroke-width="1.3" stroke-dasharray="5 4"/><text x="286.5" y="166" font-size="12.5" text-anchor="end" font-weight="600" class="t-green" xml:space="preserve">500 ms: a typical human reply</text><line x1="708.83" y1="104" x2="708.83" y2="172" class="axis" stroke-width="1.3" stroke-dasharray="5 4"/><text x="702.83" y="184" font-size="12.5" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">1,293 ms: this agent</text><line x1="817.5" y1="56" x2="817.5" y2="190" class="s-red" stroke-width="1.3" stroke-dasharray="5 4"/><text x="811.5" y="202" font-size="12.5" text-anchor="end" font-weight="600" class="t-red" xml:space="preserve">1,500 ms: target</text><line x1="30" y1="232" x2="870" y2="232" class="axis" stroke-width="1.5"/><line x1="30" y1="232" x2="30" y2="237" class="axis" stroke-width="1.5"/><text x="30" y="252" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">0</text><line x1="161.25" y1="232" x2="161.25" y2="237" class="axis" stroke-width="1.5"/><text x="161.25" y="252" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">250 ms</text><line x1="292.5" y1="232" x2="292.5" y2="237" class="axis" stroke-width="1.5"/><text x="292.5" y="252" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">500 ms</text><line x1="423.75" y1="232" x2="423.75" y2="237" class="axis" stroke-width="1.5"/><text x="423.75" y="252" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">750 ms</text><line x1="555" y1="232" x2="555" y2="237" class="axis" stroke-width="1.5"/><text x="555" y="252" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">1,000 ms</text><line x1="686.25" y1="232" x2="686.25" y2="237" class="axis" stroke-width="1.5"/><text x="686.25" y="252" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">1,250 ms</text><line x1="817.5" y1="232" x2="817.5" y2="237" class="axis" stroke-width="1.5"/><text x="817.5" y="252" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">1,500 ms</text><text x="30" y="10" font-size="13" class="t-muted" xml:space="preserve">From the caller going quiet to hearing the first word back</text></g>
<text x="24" y="325" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Data: Kramer et al., “Voice AI &amp; Voice Agents: An Illustrated Primer” (Pipecat, 2025, revised 2026). One typical setup.</text>
