<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 850 474" width="850" height="474" role="img" aria-labelledby="fig-1qveo9b-t fig-1qveo9b-d">
<title id="fig-1qveo9b-t">Quantizing a block of weights by rounding</title>
<desc id="fig-1qveo9b-d">Diagram of round-to-nearest quantization on one block of eight example weights. The weights, such as 0.021, −0.118 and 0.074, are divided by a single block scale and rounded to the nearest of 16 levels, giving small integers from −8 to 7. To use them, each integer is multiplied back by the scale. The rebuilt values are close to the originals but not equal; the difference is the rounding error. A second row shows the same block with one large outlier weight: the scale stretches to fit it, and the other weights collapse onto just a few levels, so their error grows.</desc>
