ml:space="preserve">one fine-tuned vision model</text><text x="541" y="154.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">writes the page out</text><line x1="757" y1="146" x2="779" y2="146" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="782" y="118" width="86" height="56" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="825" y="137.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Markdown</text><text x="825" y="154.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">text</text><line x1="24" y1="222" x2="900" y2="222" class="grid" stroke-width="1"/><text x="24" y="254" font-size="14.5" font-weight="700" class="t-purple" xml:space="preserve">Hybrid</text><text x="24" y="274" font-size="12.5" class="t-muted" xml:space="preserve">Marker</text><rect x="140" y="236" width="170" height="56" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="225" y="255.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">PDF text,</text><text x="225" y="272.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">in reading order</text><line x1="313" y1="264" x2="335" y2="264" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="338" y="236" width="90" height="56" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="383" y="255.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">layout</text><text x="383" y="272.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">detection</text><line x1="431" y1="264" x2="453" y2="264" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="456" y="236" width="110" height="56" rx="6" class="fs-purp