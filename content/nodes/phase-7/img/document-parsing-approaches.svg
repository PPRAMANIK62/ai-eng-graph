<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 920 376" width="920" height="376" role="img" aria-labelledby="fig-2kld5o-t fig-2kld5o-d">
<title id="fig-2kld5o-t">Three ways to turn a PDF page into text</title>
<desc id="fig-2kld5o-d">Three ways to parse a PDF page. Pipeline (Docling): the PDF's text with positions and a page image go through a layout model, a table model and optional OCR, then reading order is worked out and the parts are assembled. Vision model (olmOCR): the page image, plus the PDF's own text and positions as an anchor, go into one fine-tuned vision model that writes the page out as text. Hybrid (Marker): the PDF's own text is used where it's usable; only garbled or scanned pages and uncertain tables go to a vision model.</desc>
<style>
