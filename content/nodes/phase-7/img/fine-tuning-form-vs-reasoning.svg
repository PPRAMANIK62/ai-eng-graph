<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 710 352" width="710" height="352" role="img" aria-labelledby="fig-lebrv6-t fig-lebrv6-d">
<title id="fig-lebrv6-t">Fine-tuning fixed the format task, and only partly helped with math</title>
<desc id="fig-lebrv6-d">Bar chart of Llama-2-13B accuracy before and after full fine-tuning, from Anyscale's 2023 case study. On a structured-output task (ViGGO), accuracy went from 58% to 98%. On grade-school math (GSM8k), it went from 28% to 47%. Fine-tuning closed the gap on the format task and only partly helped on the reasoning task, where the model stayed behind GPT-4.</desc>
<style>
