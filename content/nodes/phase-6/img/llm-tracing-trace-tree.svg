<g transform="translate(0 44)"><text x="20" y="8" font-size="12" font-weight="600" class="t-muted" xml:space="preserve">span</text><text x="270" y="8" font-size="12" class="t-muted" xml:space="preserve">time, left to right (illustrative, not data)</text><text x="20" y="37" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">request: “How do I rotate my API key?”</text><line x1="270" y1="37" x2="870" y2="37" class="grid" stroke-width="1"/><rect x="270" y="27" width="600" height="20" rx="3" class="fs-grey s-grey" stroke-width="1.5"/><text x="36" y="71" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">retrieval (search the docs)</text><line x1="270" y1="71" x2="870" y2="71" class="grid" stroke-width="1"/><rect x="282" y="61" width="60" height="20" rx="3" class="f-green"/><text x="36" y="105" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">model call 1: asks for a tool</text><line x1="270" y1="105" x2="870" y2="105" class="grid" stroke-width="1"/><rect x="348" y="95" width="186" height="20" rx="3" class="f-blue"/><text x="36" y="139" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">execute_tool get_account_settings</text><line x1="270" y1="139" x2="870" y2="139" class="grid" stroke-width="1"/><rect x="540" y="129" width="60" height="20" rx="3" class="f-orange"/><text x="36" y="173" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">model call 2: streams the answer</text><line x1="270" y1="173" x2="870" y2="173" class="grid" stroke-width="1"/><rect x="606" y="163" width="252" height="20" rx="3" class="f-blue"/><line x1="626" y1="183" x2="626" y2="212" class="s-blue" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="350" y="212" width="520" height="156" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="364" y="230" font-size="12.5" font-weight="700" class="t-blue" xml:space="preserve">fields on the model call 2 span</text><text x="364" y="252" font-size="12.5" class="t-ink mono" xml:space="preserve">gen_ai.request.model: claude-sonnet-5</text><text x="364" y="273" font-size="12.5" class="t-ink mono" xml:space="preserve">gen_ai.usage.input_tokens: 6000   (includes cached)</text><text x="364" y="294" font-size="12.5" class="t-ink mono" xml:space="preserve">gen_ai.usage.cache_read.input_tokens: 5000</text><text x="364" y="315" font-size="12.5" class="t-ink mono" xml:space="preserve">gen_ai.usage.output_tokens: 400</text><text x="364" y="336" font-size="12.5" class="t-ink mono" xml:space="preserve">gen_ai.prompt.version: 7</text><text x="364" y="357" font-size="12.5" class="t-ink mono" xml:space="preserve">feature: docs-assistant   (your own tag)</text><text x="20" y="232" font-size="12.5" font-weight="600" class="t-ink" xml:space="preserve">One trace = one request.</text><text x="20" y="252" font-size="12.5" class="t-ink" xml:space="preserve">Each step is a span with a</text><text x="20" y="270" font-size="12.5" class="t-ink" xml:space="preserve">start, an end and a parent.</text></g>
<text x="24" y="441" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Field names from the OpenTelemetry GenAI semantic conventions (status: Development). Example request is our own.</text>
