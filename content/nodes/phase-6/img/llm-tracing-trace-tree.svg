<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 890 452" width="890" height="452" role="img" aria-labelledby="fig-xshk7c-t fig-xshk7c-d">
<title id="fig-xshk7c-t">One question, one trace: every step is a span</title>
<desc id="fig-xshk7c-d">A trace for one question to a docs assistant, drawn as a waterfall. The request span runs the whole time. Under it, in order: a retrieval span, a first model call that asks for a tool, a tool span for get_account_settings, and a second model call that streams the answer. The second model call's fields are shown: the model, 6,000 input tokens of which 5,000 were read from the cache, 400 output tokens, and the prompt version. Timings are illustrative.</desc>
