<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 940 364" width="940" height="364" role="img" aria-labelledby="fig-vyhf0w-t fig-vyhf0w-d">
<title id="fig-vyhf0w-t">A semantic cache answers from memory when a question is close enough</title>
<desc id="fig-vyhf0w-d">The semantic cache flow. A new question is embedded and compared with past questions in the cache, filtered by tenant, locale and model version. If the nearest one is closer than the threshold, the stored answer is returned in tens of milliseconds and the model isn't called. If not, the model answers, and the question, embedding and answer are stored with an expiry time. Two example pairs: &quot;Which city is Canada's capital?&quot; and &quot;What is the capital of Canada?&quot; should share an answer; two questions can sit just as close in embedding space and still need different answers.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
