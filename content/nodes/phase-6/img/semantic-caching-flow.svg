<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="940" height="364"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">A semantic cache answers from memory when a question is close enough</text>
<g transform="translate(0 44)"><rect x="20" y="40" width="130" height="46" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="85" y="54.55" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">new</text><text x="85" y="71.45" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">question</text><line x1="150" y1="63" x2="178" y2="63" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="180" y="40" width="110" height="46" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="235" y="63" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">embed</text><line x1="290" y1="63" x2="318" y2="63" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="320" y="34" width="190" height="58" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="415" y="46.75" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">nearest past question</text><text x="415" y="63" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">same tenant, locale,</text><text x="415" y="79.25" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">model version</text><line x1="510" y1="63" x2="538" y2="63" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="540" y="40" width="130" height="46" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="605" y="54.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">closer than</text><text x="605" y="71.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">threshold?</text><line x1="670" y1="63" x2="718" y2="63" class="s-green" stroke-width="1.5" marker-end="url(#ah-green)"/><text x="694" y="53" font-size="12" text-anchor="middle" font-weight="600" class="t-green" xml:space="preserve">yes</text><rect x="720" y="40" width="200" height="46" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="820" y="54.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">return stored answer</text><text x="820" y="71.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">tens of ms, no model call</text><line x1="605" y1="86" x2="605" y2="136" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><text x="615" y="114" font-size="12" font-weight="600" class="t-orange" xml:space="preserve">no</text><rect x="520" y="138" width="170" height="46" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="605" y="152.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">call the model</text><text x="605" y="169.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">seconds, full token cost</text><line x1="690" y1="161" x2="718" y2="161" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="720" y="138" width="200" height="46" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="820" y="152.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">store question, embedding,</text><text x="820" y="169.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">answer, with an expiry</text><line x1="20" y1="206" x2="920" y2="206" class="grid" stroke-width="1"/><text x="20" y="226" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">What the threshold has to tell apart</text><text x="20" y="252" font-size="12.5" font-weight="600" class="t-green" xml:space="preserve">Should hit:</text><text x="120" y="252" font-size="12.5" class="t-ink" xml:space="preserve">“Which city is Canada’s capital?”  and  “What is the capital of Canada?”  (same answer)</text><text x="20" y="276" font-size="12.5" font-weight="600" class="t-red" xml:space="preserve">Can go wrong:</text><text x="120" y="276" font-size="12.5" class="t-ink" xml:space="preserve">two questions just as close in embedding space that need different answers</text></g>
<text x="24" y="353" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Flow after Redis's semantic cache docs; example pair from Schroeder et al., vCache (2026).</text>
</svg>
