"central" class="t-ink" xml:space="preserve">Production (probe first)</text><rect x="210" y="139" width="11.38" height="22" rx="2" class="f-green"/><text x="229.38" y="150" font-size="13" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">3.5</text><line x1="210" y1="10" x2="210" y2="170" class="axis" stroke-width="1.5"/><text x="20" y="232" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">The production cascade, on real traffic</text><rect x="20" y="250" width="150" height="44" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="95" y="272" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">every exchange</text><line x1="172" y1="272" x2="206" y2="272" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="208" y="250" width="190" height="44" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="303" y="263.88" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">cheap probe on the</text><text x="303" y="280.13" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">model's activations</text><line x1="400" y1="272" x2="470" y2="272" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="435" y="262" font-size="12.5" text-anchor="middle" font-weight="700" class="t-orange" xml:space="preserve">~5.5%</text><rect x="472" y="250" width="170" height="44" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="557" y="272" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">larger classifier</text><line x1="644" y1="272" x2="700" y2="272" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="702" y="250" width="170" height="44" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="787" y="272" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">0.05% refused</text><text x="305" y="312" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">the rest (~94.5%) pass without the big classifier</text></g>
