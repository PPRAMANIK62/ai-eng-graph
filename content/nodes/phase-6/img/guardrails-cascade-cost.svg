<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 396" width="900" height="396" role="img" aria-labelledby="fig-1enf81e-t fig-1enf81e-d">
<title id="fig-1enf81e-t">A cheap first stage made the classifiers far cheaper</title>
<desc id="fig-1enf81e-d">Bar chart of compute overhead for four Constitutional Classifier setups, relative to the first-generation system at 100. A single exchange classifier that reads output together with its input: 150. A two-stage cascade: 27.8. The production system, with a cheap probe on the model's activations as the first stage: 3.5. Below, the production cascade: every exchange goes to the probe, about 5.5% is escalated to a larger classifier, and 0.05% of real traffic ends up refused.</desc>
