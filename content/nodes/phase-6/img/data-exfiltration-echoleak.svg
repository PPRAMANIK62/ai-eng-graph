<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 974 284" width="974" height="284" role="img" aria-labelledby="fig-158rbte-t fig-158rbte-d">
<title id="fig-158rbte-t">EchoLeak: four steps, each past one barrier</title>
<desc id="fig-158rbte-d">The EchoLeak attack chain against Microsoft 365 Copilot (CVE-2025-32711), four steps, each getting past one barrier. 1: a crafted email is retrieved as context; it reads like a normal request, so the XPIA prompt injection classifier misses it. 2: Copilot's reply contains a reference-style markdown link, which the link redaction filter misses. 3: the link becomes a reference-style image, which the client loads automatically, so no click is needed. 4: the image URL points to a Microsoft Teams preview service that is on the content security policy allowlist and fetches the attacker's URL with the secret in it. Fixed server-side in May 2025.</desc>
