nt-size="13.5" font-weight="700" class="t-red" xml:space="preserve">Step 3</text><rect x="424" y="22" width="176" height="58" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="512" y="42.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Reference-style image,</text><text x="512" y="59.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">loaded automatically</text><line x1="602" y1="51" x2="624" y2="51" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="424" y="106" font-size="12" class="t-muted" xml:space="preserve">gets past:</text><rect x="424" y="114" width="176" height="34" rx="6" class="s-green" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="512" y="131" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">needing a user click</text><text x="626" y="10" font-size="13.5" font-weight="700" class="t-red" xml:space="preserve">Step 4</text><rect x="626" y="22" width="176" height="58" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="714" y="42.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Image URL on Teams</text><text x="714" y="59.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">preview service</text><text x="626" y="106" font-size="12" class="t-muted" xml:space="preserve">gets past:</text><rect x="626" y="114" width="176" height="34" rx="6" class="s-green" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="714" y="131" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">domain allowlist (CSP)</text><line x1="804" y1="51" x2="832" y2="51" class="s-red" stroke-width="1.5" marker-end="url(#ah-red)"/><rect x="834" y="22" width="120" height="58" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="894" y="34.75" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">attacker's</text><text x="894" y="51" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">server gets</text><text x="894" y="67.25" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">the secret</text><text x="20" y="182" font-size="12.5" class="t-ink" xml:space="preserve">Zero clicks. To the victim it looked like a broken image. Found by Aim Security; fixed server-side in May 2025,</text><text x="20" y="200" font-size="12.5" class="t-ink" xml:space="preserve">disclosed 2025-06-11, no sign of use in the wild.</text></g>
