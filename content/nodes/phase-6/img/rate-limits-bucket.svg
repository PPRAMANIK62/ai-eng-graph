<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 780 404" width="780" height="404" role="img" aria-labelledby="fig-1abx8c5-t fig-1abx8c5-d">
<title id="fig-1abx8c5-t">Rate limits refill continuously; bursts drain them</title>
<desc id="fig-1abx8c5-d">A token bucket for a limit of 60 requests per minute. The bucket holds up to the limit and refills continuously at about one per second. A burst of requests drains it, and requests arriving while it's empty get a 429 with a retry-after header saying how long to wait. Below, a second kind of 429: the monthly spend cap. It has no retry-after header, and retrying fails until the next month or a higher tier.</desc>
