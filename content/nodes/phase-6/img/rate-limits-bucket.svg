<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Rate limits refill continuously; bursts drain them</text>
<g transform="translate(0 44)"><rect x="20" y="20" width="170" height="46" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="105" y="34.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">refills continuously</text><text x="105" y="51.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">about 1 per second</text><line x1="190" y1="43" x2="258" y2="70" class="s-green" stroke-width="1.5" marker-end="url(#ah-green)"/><path d="M260,50 L272,200 L398,200 L410,50" class="s-blue" stroke-width="2.5" fill="none"/><rect x="276" y="160" width="118" height="36" rx="2" class="fs-blue"/><text x="335" y="178" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-blue" xml:space="preserve">a little left</text><line x1="254" y1="56" x2="416" y2="56" class="grid" stroke-width="1" stroke-dasharray="5 4"/><text x="335" y="76" font-size="12.5" text-anchor="middle" class="t-muted" xml:space="preserve">holds up to the limit</text><text x="335" y="222" font-size="12.5" text-anchor="middle" font-weight="600" class="t-ink" xml:space="preserve">limit: 60 requests per minute</text><rect x="20" y="120" width="170" height="46" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="105" y="134.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">a burst of requests</text><text x="105" y="151.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">in the same second</text><line x1="190" y1="143" x2="268" y2="160" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="410" y1="140" x2="488" y2="70" class="s-green" stroke-width="1.5" marker-end="url(#ah-green)"/><rect x="490" y="46" width="250" height="46" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="615" y="60.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">while there's capacity:</text><text x="615" y="77.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">the request goes through</text><line x1="410" y1="170" x2="488" y2="160" class="s-red" stroke-width="1.5" marker-end="url(#ah-red)"/><rect x="490" y="136" width="250" height="58" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="615" y="156.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">once it's empty: HTTP 429</text><text x="615" y="173.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">with retry-after: seconds to wait</text><line x1="20" y1="236" x2="760" y2="236" class="grid" stroke-width="1"/><text x="20" y="256" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">A 429 that isn't a rate limit</text><rect x="20" y="272" width="250" height="46" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="145" y="286.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">monthly spend cap reached</text><text x="145" y="303.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">enforced_spend_limit_reached</text><line x1="270" y1="295" x2="298" y2="295" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="300" y="272" width="440" height="46" rx="6" class="s-orange" fill="none" stroke-width="1.5"/><text x="520" y="286.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">no retry-after header: retrying fails until</text><text x="520" y="303.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">the next month or a higher tier</text></g>
<text x="24" y="393" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Mechanism from Anthropic's rate limits docs (2026). Illustrative bucket, not measured data.</text>
</svg>
