<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 800 394" width="800" height="394" role="img" aria-labelledby="fig-zf2j4k-t fig-zf2j4k-d">
<title id="fig-zf2j4k-t">Caching cut the wait for the first token most on the longest prompt</title>
<desc id="fig-zf2j4k-d">Paired bars of time to first token without and with prompt caching, from Anthropic's 2024 launch. Chat with a book (100,000-token cached prompt): 11.5 s without, 2.4 s with, 79% faster, 90% cheaper. Multi-turn conversation (10 turns, long system prompt): about 10 s without, about 2.5 s with, 75% faster, 53% cheaper. Many-shot prompting (10,000-token prompt): 1.6 s without, 1.1 s with, 31% faster, 86% cheaper.</desc>
