<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 970 386" width="970" height="386" role="img" aria-labelledby="fig-1p1nf32-t fig-1p1nf32-d">
<title id="fig-1p1nf32-t">Guardrails sit in the request path; evaluators sit beside it</title>
<desc id="fig-1p1nf32-d">One request through a support agent, with guardrails inline. The user message goes through an input guardrail before the model runs. Each tool call is wrapped by a tool guardrail that checks arguments and results, and a side effect like cancelling an order waits for human approval. The answer goes through an output guardrail before the user sees it. Any failed check trips a wire and stops the run. Off to the side, after the answer is sent, an online evaluator scores a sample of traces for dashboards; it never blocks anything.</desc>
