<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="800" height="330"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Where one message with personal data can end up</text>
<g transform="translate(0 44)"><rect x="20" y="20" width="250" height="96" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="34" y="42" font-size="12.5" font-weight="700" class="t-muted" xml:space="preserve">user message</text><text x="34" y="66" font-size="13" class="t-ink" xml:space="preserve">“I'm Priya Shah, my card</text><text x="34" y="86" font-size="13" class="t-ink" xml:space="preserve">4111 1111 1111 1111 was</text><text x="34" y="106" font-size="13" class="t-ink" xml:space="preserve">charged twice.”</text><rect x="320" y="48" width="110" height="40" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="375" y="68" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">your app</text><line x1="272" y1="68" x2="316" y2="68" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="520" y="0" width="250" height="40" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="645" y="20" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">model provider (the prompt)</text><text x="530" y="58" font-size="12" class="t-orange" xml:space="preserve">full text; kept per the provider's policy</text><line x1="432" y1="60" x2="516" y2="22" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><rect x="470" y="104" width="80" height="36" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="510" y="122" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">mask</text><line x1="432" y1="78" x2="466" y2="114" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="590" y="104" width="180" height="36" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="680" y="122" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">trace store</text><line x1="552" y1="122" x2="586" y2="122" class="s-green" stroke-width="1.5" marker-end="url(#ah-green)"/><text x="470" y="162" font-size="12" class="t-green" xml:space="preserve">“... my card [REDACTED CREDIT CARD] ...”</text><text x="470" y="180" font-size="12" class="t-muted" xml:space="preserve">(names need a detector; a regex misses them)</text><rect x="590" y="204" width="180" height="36" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="680" y="222" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">eval sets, reviews</text><line x1="755" y1="142" x2="755" y2="200" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="20" y="170" font-size="12.5" font-weight="600" class="t-ink" xml:space="preserve">Message capture on LLM spans</text><text x="20" y="188" font-size="12.5" class="t-ink" xml:space="preserve">is opt-in: off by default.</text><text x="20" y="224" font-size="12.5" font-weight="600" class="t-ink" xml:space="preserve">The mask cleans the trace,</text><text x="20" y="242" font-size="12.5" font-weight="600" class="t-ink" xml:space="preserve">not what the provider got.</text></g>
<text x="24" y="319" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Based on Langfuse masking docs, the OpenTelemetry GenAI spans spec and OpenAI data controls. Message is our example.</text>
</svg>
