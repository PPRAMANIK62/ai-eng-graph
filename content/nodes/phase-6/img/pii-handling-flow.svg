<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="fig-ndjk7t-t fig-ndjk7t-d">
<title id="fig-ndjk7t-t">Where one message with personal data can end up</title>
<desc id="fig-ndjk7t-d">One user message with a name and a card number, and the three places it can go: to the model provider in the prompt, where retention depends on the provider's policy; to your trace store, where a masking function can replace the card number with a placeholder before export; and on into eval sets built from traces. The mask protects the trace, not what the provider received.</desc>
<style>
