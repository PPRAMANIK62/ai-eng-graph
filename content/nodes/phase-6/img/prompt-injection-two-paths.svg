<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 820 386" width="820" height="386" role="img" aria-labelledby="fig-1q1p0qq-t fig-1q1p0qq-d">
<title id="fig-1q1p0qq-t">Two ways untrusted text reaches the model</title>
<desc id="fig-1q1p0qq-d">Two ways untrusted text gets into the prompt. Direct: a user types an instruction into the app's input box. Indirect: an attacker plants an instruction in a web page, email or document, and the app later fetches it through search or a tool. Either way, the developer's system prompt, the user's message and the fetched content are joined into one sequence of tokens, and the model reads all of it as possible instructions.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
