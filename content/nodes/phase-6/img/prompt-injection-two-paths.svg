<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="820" height="386"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Two ways untrusted text reaches the model</text>
<g transform="translate(0 44)"><text x="20" y="10" font-size="14.5" font-weight="700" class="t-orange" xml:space="preserve">Direct</text><rect x="20" y="26" width="250" height="58" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="145" y="46.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">User types into your app:</text><text x="145" y="63.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">“Ignore the above directions…”</text><text x="20" y="124" font-size="14.5" font-weight="700" class="t-red" xml:space="preserve">Indirect</text><rect x="20" y="140" width="250" height="58" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="145" y="160.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Attacker plants text in a</text><text x="145" y="177.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">web page, email or document</text><rect x="20" y="220" width="250" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="145" y="240" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">your app fetches it (search, tool)</text><line x1="145" y1="198" x2="145" y2="218" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="340" y="10" font-size="14.5" font-weight="700" class="t-ink" xml:space="preserve">One sequence of tokens</text><rect x="340" y="26" width="250" height="50" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="465" y="42.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">System prompt</text><text x="465" y="59.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">from you, the developer</text><rect x="340" y="82" width="250" height="50" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="465" y="98.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">User message</text><text x="465" y="115.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">may contain instructions</text><rect x="340" y="138" width="250" height="50" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="465" y="154.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Fetched content</text><text x="465" y="171.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">may contain instructions</text><rect x="332" y="20" width="266" height="174" rx="6" class="s-grey" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="270" y1="55" x2="330" y2="100" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><line x1="270" y1="240" x2="330" y2="170" class="s-red" stroke-width="1.5" marker-end="url(#ah-red)"/><rect x="680" y="82" width="110" height="50" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="735" y="107" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">model</text><line x1="600" y1="107" x2="678" y2="107" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="680" y="158" font-size="12.5" class="t-muted" xml:space="preserve">reads it all as text;</text><text x="680" y="176" font-size="12.5" class="t-muted" xml:space="preserve">no reliable way to tell</text><text x="680" y="194" font-size="12.5" class="t-muted" xml:space="preserve">the job from the data</text><line x1="20" y1="280" x2="800" y2="280" class="grid" stroke-width="1"/><text x="20" y="302" font-size="12.5" class="t-ink" xml:space="preserve">Like SQL injection, but with no parameterized query: there's no slot the model treats as data only.</text></g>
<text x="24" y="375" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Based on Willison (2022), Greshake et al. (2023) and OWASP LLM01 (2025).</text>
</svg>
