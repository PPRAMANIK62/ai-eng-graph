<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 800 364" width="800" height="364" role="img" aria-labelledby="fig-1rfinvb-t fig-1rfinvb-d">
<title id="fig-1rfinvb-t">The cost of one model call, and how it rolls up</title>
<desc id="fig-1rfinvb-d">How one model call's cost is built. Three bars: 1,000 uncached input tokens at $2 per million cost $0.0020, 5,000 cached input tokens at $0.20 per million cost $0.0010, and 400 output tokens at $10 per million cost $0.0040, for a total of $0.0070. Output is 6% of the tokens and 57% of the cost. Below, the roll-up: call costs add up to a request, requests group by a feature tag, and features sum to a daily total.</desc>
<style>
