<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 998 364" width="998" height="364" role="img" aria-labelledby="fig-7gqu59-t fig-7gqu59-d">
<title id="fig-7gqu59-t">Prompt caching reuses an exact prefix</title>
<desc id="fig-7gqu59-d">A request laid out as a prefix, left to right: tool definitions, system prompt, reference documents, earlier conversation turns, then the new user message. A cache breakpoint sits after the earlier turns. Everything before it is read from the cache at about 0.1 times the input price; the new message is processed at full price. Below, three changes and what they break: editing a tool definition invalidates everything; putting a timestamp in the system prompt invalidates the system prompt and all messages; appending a new turn at the end keeps the whole prefix cached.</desc>
