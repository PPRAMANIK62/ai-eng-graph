r="middle" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">cached</text><rect x="366" y="194" width="150" height="28" rx="4" class="f-red"/><text x="441" y="208" font-size="12" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">changed</text><rect x="522" y="194" width="140" height="28" rx="4" class="fs-red"/><text x="592" y="208" font-size="12" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-red" xml:space="preserve">recomputed</text><rect x="668" y="194" width="170" height="28" rx="4" class="fs-red"/><text x="753" y="208" font-size="12" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-red" xml:space="preserve">recomputed</text><rect x="844" y="194" width="130" height="28" rx="4" class="fs-grey"/><text x="909" y="208" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-muted" xml:space="preserve">new</text><text x="236" y="248" font-size="12.5" text-anchor="end" dominant-baseline="central" class="t-ink" xml:space="preserve">Append a new turn at the end</text><rect x="250" y="234" width="110" height="28" rx="4" class="fs-green"/><text x="305" y="248" font-size="12" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">cached</text><rect x="366" y="234" width="150" height="28" rx="4" class="fs-green"/><text x="441" y="248" font-size="12" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">cached</text><rect x="522" y="234" width="140" height="28" rx="4" class="fs-green"/><text x="592" y="248" font-size="12" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">cached</text><rect x="668" y="234" width="170" height="28" rx="4" class="fs-green"/><text x="753" y="248" font-size="12" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">cached</text><rect x="844" y="234" width="130" height="28" rx="4" class="fs-grey"/><text x="909" y="248" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-muted" xml:space="preserve">+ new turn</text><text x="250" y="280" font-size="12.5" class="t-muted" xml:space="preserve">The cache matches from the first token. Everything after the first change is a miss.</text></g>
