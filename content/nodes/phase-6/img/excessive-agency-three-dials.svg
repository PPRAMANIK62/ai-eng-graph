<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 860 382" width="860" height="382" role="img" aria-labelledby="fig-1mpkp2j-t fig-1mpkp2j-d">
<title id="fig-1mpkp2j-t">Three ways to give an email agent too much agency</title>
<desc id="fig-1mpkp2j-d">The email assistant with too much agency, as three dials. The task only needs reading mail. Too much functionality: the tool can also send, fixed by a tool that only reads. Too many permissions: it signs in with rights to send, fixed by a read-only OAuth scope. Too much autonomy: nothing checks before mail goes out, fixed by having the user press send. Any one fix stops the injected email from forwarding the inbox.</desc>
