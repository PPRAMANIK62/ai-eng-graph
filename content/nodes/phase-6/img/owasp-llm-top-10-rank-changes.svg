<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 860 468" width="860" height="468" role="img" aria-labelledby="fig-16nag1n-t fig-16nag1n-d">
<title id="fig-16nag1n-t">How the OWASP LLM Top 10 moved from 2025 to 2026</title>
<desc id="fig-16nag1n-d">Bump chart of the OWASP Top 10 for LLM apps, 2025 rank on the left, 2026 rank on the right. Prompt injection and sensitive information disclosure stay first and second. Excessive agency climbs from 6 to 3. Unbounded consumption climbs from 10 to 6. Misinformation rises from 9 to 7. System prompt leakage, 7th in 2025, becomes hidden context exposure at 8. Supply chain, data and model poisoning, and vector and embedding weaknesses each drop one place. Improper output handling falls from 5 to 10.</desc>
