<g transform="translate(0 44)"><text x="20" y="10" font-size="14" font-weight="700" class="t-orange" xml:space="preserve">Alias (older models)</text><text x="20" y="30" font-size="12.5" class="t-muted" xml:space="preserve">points at the newest dated snapshot, so it can move</text><rect x="20" y="56" width="170" height="36" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="105" y="74" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">claude-sonnet-4-5</text><rect x="260" y="56" width="230" height="36" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="375" y="74" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">claude-sonnet-4-5-20250929</text><rect x="560" y="56" width="200" height="36" rx="6" class="fs-grey s-grey" stroke-width="1.5" stroke-dasharray="5 4"/><text x="660" y="74" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">a newer dated snapshot</text><line x1="192" y1="74" x2="256" y2="74" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><path d="M105,94 C105,130 660,130 660,96" class="s-orange" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/><text x="385" y="140" font-size="12" text-anchor="middle" class="t-orange" xml:space="preserve">could move here with no change in your code</text><line x1="20" y1="162" x2="780" y2="162" class="grid" stroke-width="1"/><text x="20" y="182" font-size="14" font-weight="700" class="t-blue" xml:space="preserve">Pinned ID (4.6 generation on)</text><text x="20" y="202" font-size="12.5" class="t-muted" xml:space="preserve">the dateless ID is the snapshot; a newer model gets a new ID</text><rect x="20" y="226" width="230" height="36" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="135" y="244" font-size="12.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">claude-sonnet-5 = snapshot</text><rect x="320" y="226" width="180" height="36" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="410" y="244" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">claude-sonnet-5-5</text><text x="510" y="249" font-size="12" class="t-muted" xml:space="preserve">newer model, new ID</text><line x1="20" y1="288" x2="780" y2="288" class="grid" stroke-width="1"/><text x="20" y="308" font-size="14" font-weight="700" class="t-ink" xml:space="preserve">Even a pinned ID ends</text><line x1="20" y1="350" x2="760" y2="350" class="axis" stroke-width="2"/><rect x="54" y="344" width="12" height="12" rx="6" class="f-green"/><text x="60" y="376" font-size="12.5" text-anchor="middle" font-weight="600" class="t-green" xml:space="preserve">active</text><rect x="294" y="344" width="12" height="12" rx="6" class="f-orange"/><text x="300" y="376" font-size="12.5" text-anchor="middle" font-weight="600" class="t-orange" xml:space="preserve">deprecated (notice sent)</text><rect x="634" y="344" width="12" height="12" rx="6" class="f-red"/><text x="640" y="376" font-size="12.5" text-anchor="middle" font-weight="600" class="t-red" xml:space="preserve">retired: requests fail</text><path d="M306,334 L306,328 L634,328 L634,334" class="s-muted" stroke-width="1.5" fill="none"/><text x="470" y="320" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">at least 60 days' notice</text></g>
<text x="24" y="453" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Based on Anthropic's model IDs and model deprecations docs (2026-09).</text>
