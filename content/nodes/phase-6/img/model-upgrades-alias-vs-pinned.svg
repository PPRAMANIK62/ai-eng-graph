<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 800 464" width="800" height="464" role="img" aria-labelledby="fig-s248ni-t fig-s248ni-d">
<title id="fig-s248ni-t">An alias can move; a pinned ID can't, but it gets retired</title>
<desc id="fig-s248ni-d">Two ways to name a model. Top, an alias: claude-sonnet-4-5 points at the newest dated snapshot, so it could move to a newer snapshot without a code change. Bottom, a pinned ID: from the 4.6 generation on, a dateless ID such as claude-sonnet-5 is the snapshot itself and never moves; a newer model gets a new ID. A timeline shows that even a pinned ID ends: deprecation, at least 60 days' notice, then retirement, after which requests fail.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
