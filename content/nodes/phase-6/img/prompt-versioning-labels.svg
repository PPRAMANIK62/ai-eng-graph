<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Labels point at versions; shipping and rollback move the label</text>
<g transform="translate(0 44)"><text x="20" y="10" font-size="13.5" font-weight="700" class="t-ink" xml:space="preserve">1. save version 7</text><rect x="20" y="110" width="70" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="55" y="130" font-size="14" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">v5</text><rect x="104" y="110" width="70" height="40" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="139" y="130" font-size="14" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">v6</text><rect x="188" y="110" width="70" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="223" y="130" font-size="14" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">v7</text><rect x="99" y="40" width="80" height="26" rx="13" class="fs-blue s-blue" stroke-width="1.5"/><text x="139" y="53" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-blue" xml:space="preserve">production</text><line x1="139" y1="68" x2="139" y2="106" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><line x1="223" y1="186" x2="223" y2="154" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="223" y="200" font-size="12.5" text-anchor="middle" font-weight="600" class="t-muted" xml:space="preserve">latest</text><line x1="292" y1="0" x2="292" y2="190" class="grid" stroke-width="1"/><text x="310" y="10" font-size="13.5" font-weight="700" class="t-green" xml:space="preserve">2. ship: move production to v7</text><rect x="310" y="110" width="70" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="345" y="130" font-size="14" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">v5</text><rect x="394" y="110" width="70" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="429" y="130" font-size="14" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">v6</text><rect x="478" y="110" width="70" height="40" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="513" y="130" font-size="14" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">v7</text><rect x="473" y="40" width="80" height="26" rx="13" class="fs-blue s-blue" stroke-width="1.5"/><text x="513" y="53" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-blue" xml:space="preserve">production</text><line x1="513" y1="68" x2="513" y2="106" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><line x1="513" y1="186" x2="513" y2="154" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="513" y="200" font-size="12.5" text-anchor="middle" font-weight="600" class="t-muted" xml:space="preserve">latest</text><line x1="582" y1="0" x2="582" y2="190" class="grid" stroke-width="1"/><text x="600" y="10" font-size="13.5" font-weight="700" class="t-orange" xml:space="preserve">3. roll back: move it to v6</text><rect x="600" y="110" width="70" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="635" y="130" font-size="14" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">v5</text><rect x="684" y="110" width="70" height="40" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="719" y="130" font-size="14" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">v6</text><rect x="768" y="110" width="70" height="40" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="803" y="130" font-size="14" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">v7</text><rect x="679" y="40" width="80" height="26" rx="13" class="fs-blue s-blue" stroke-width="1.5"/><text x="719" y="53" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-blue" xml:space="preserve">production</text><line x1="719" y1="68" x2="719" y2="106" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><line x1="803" y1="186" x2="803" y2="154" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="803" y="200" font-size="12.5" text-anchor="middle" font-weight="600" class="t-muted" xml:space="preserve">latest</text><text x="20" y="236" font-size="12.5" class="t-ink" xml:space="preserve">Your code asks for the prompt labelled production, so moving the label changes what runs, with no deploy.</text></g>
<text x="24" y="313" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Based on Langfuse's prompt version control docs. Version numbers are our example.</text>
