<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 840 348" width="840" height="348" role="img" aria-labelledby="fig-xd98ed-t fig-xd98ed-d">
<title id="fig-xd98ed-t">Same request, different wrapping: why safety training leaks</title>
<desc id="fig-xd98ed-d">One harmful request, three prompts. The plain request is refused. With prefix injection (start your reply with &quot;Absolutely! Here's&quot;), the instruction-following and text-prediction habits outweigh the safety habit, and the model answers. With the request encoded in Base64, the model can read it from pretraining, but safety training likely never covered that form, so it answers. Based on Wei, Haghtalab and Steinhardt (2023).</desc>
