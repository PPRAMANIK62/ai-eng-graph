ize="12.5" font-weight="600" dominant-baseline="central" class="t-red" xml:space="preserve">28.6% of scenarios (4 of 14)</text><text x="188" y="224" font-size="13.5" text-anchor="end" font-weight="600" class="t-ink" xml:space="preserve">Browser use</text><text x="188" y="242" font-size="11.5" text-anchor="end" class="t-muted" xml:space="preserve">129 scenarios, 10 tries each</text><rect x="200" y="208" width="14.88" height="18" rx="2" class="f-blue"/><text x="222.88" y="217" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">0.93% of tries</text><rect x="200" y="232" width="111.63" height="18" rx="2" class="f-red"/><text x="319.63" y="241" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-red" xml:space="preserve">7.0% of scenarios (9 of 129)</text><line x1="200" y1="30" x2="200" y2="276" class="axis" stroke-width="1.5"/><rect x="200" y="0" width="14" height="12" rx="2" class="f-blue"/><text x="220" y="6" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">attempt-level: share of all tries that worked</text><rect x="200" y="18" width="14" height="12" rx="2" class="f-red"/><text x="220" y="24" font-size="12.5" dominant-baseline="central" class="t-ink" xml:space="preserve">scenario-level: share of scenarios hit at least once</text><text x="20" y="320" font-size="12.5" class="t-ink" xml:space="preserve">Same tests, safeguards on: browser use 0 of 129 scenarios, coding 5 of 40, computer use 4 of 14.</text></g>
