<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 404" width="900" height="404" role="img" aria-labelledby="fig-1exakx-t fig-1exakx-d">
<title id="fig-1exakx-t">Low per try, higher per scenario: one test, two counts</title>
<desc id="fig-1exakx-d">Grouped bar chart of prompt injection attack success for Claude Sonnet 5 with extended thinking and without extra safeguards, from its 2026 system card. Coding (40 scenarios, 200 tries each): 0.31% of tries succeeded, but 7 of 40 scenarios (17.5%) fell at least once. Computer use (14 scenarios, 200 tries each): 2.25% of tries, 4 of 14 scenarios (28.6%). Browser use (129 scenarios, 10 tries each): 0.93% of tries, 9 of 129 scenarios (7.0%). With safeguards on, browser use went to 0 of 129 scenarios, coding to 5 of 40 and computer use stayed at 4 of 14.</desc>
