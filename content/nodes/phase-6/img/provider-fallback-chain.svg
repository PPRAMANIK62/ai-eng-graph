<g transform="translate(0 44)"><g transform="translate(0 10)"><text x="20" y="6" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">1. primary model</text><rect x="20" y="20" width="250" height="40" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="145" y="40" font-size="13.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink mono" xml:space="preserve">gpt-6-astra</text><rect x="40" y="76" width="210" height="36" rx="6" class="s-blue" fill="none" stroke-width="1.5"/><text x="145" y="94" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">1) via Azure</text><rect x="40" y="126" width="210" height="36" rx="6" class="s-blue" fill="none" stroke-width="1.5"/><text x="145" y="144" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">2) via OpenAI</text><line x1="145" y1="112" x2="145" y2="124" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="274" y1="40" x2="316" y2="40" class="s-red" stroke-width="1.5" marker-end="url(#ah-red)"/><text x="295" y="74" font-size="12" text-anchor="middle" font-weight="600" class="t-red" xml:space="preserve">all</text><text x="295" y="90" font-size="12" text-anchor="middle" font-weight="600" class="t-red" xml:space="preserve">failed</text><text x="320" y="6" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">2. first backup model</text><rect x="320" y="20" width="250" height="40" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="445" y="40" font-size="13.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink mono" xml:space="preserve">gpt-5.4-nano</text><rect x="340" y="76" width="210" height="36" rx="6" class="s-purple" fill="none" stroke-width="1.5"/><text x="445" y="94" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">1) via Azure</text><rect x="340" y="126" width="210" height="36" rx="6" class="s-purple" fill="none" stroke-width="1.5"/><text x="445" y="144" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">2) via OpenAI</text><line x1="445" y1="112" x2="445" y2="124" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="574" y1="40" x2="616" y2="40" class="s-red" stroke-width="1.5" marker-end="url(#ah-red)"/><text x="595" y="74" font-size="12" text-anchor="middle" font-weight="600" class="t-red" xml:space="preserve">all</text><text x="595" y="90" font-size="12" text-anchor="middle" font-weight="600" class="t-red" xml:space="preserve">failed</text><text x="620" y="6" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">3. second backup model</text><rect x="620" y="20" width="250" height="40" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="745" y="40" font-size="13.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-ink mono" xml:space="preserve">claude-opus-5</text><rect x="640" y="76" width="210" height="36" rx="6" class="s-orange" fill="none" stroke-width="1.5"/><text x="745" y="94" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">any available provider</text><text x="20" y="200" font-size="12.5" class="t-ink" xml:space="preserve">The first model and provider that succeeds answers. Every attempt, with its error, is listed in the response metadata.</text><line x1="20" y1="222" x2="880" y2="222" class="grid" stroke-width="1"/><text x="20" y="242" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">What can trigger a fallback (OpenRouter's defaults)</text><rect x="20" y="258" width="90.8" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="65.4" y="274" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">downtime</text><rect x="124.8" y="258" width="113.6" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="181.6" y="274" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">rate limits</text><rect x="252.4" y="258" width="189.6" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="347.2" y="274" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">context-length errors</text><rect x="456" y="258" width="174.4" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="543.2" y="274" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">moderation refusals</text></g></g>
