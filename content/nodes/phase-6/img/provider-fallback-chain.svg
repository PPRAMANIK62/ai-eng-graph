<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 384" width="900" height="384" role="img" aria-labelledby="fig-ui5qn6-t fig-ui5qn6-d">
<title id="fig-ui5qn6-t">Fallback tries other providers first, then other models</title>
<desc id="fig-ui5qn6-d">A fallback chain in an AI gateway. The request goes to the primary model, gpt-6-astra, first through Azure, then through OpenAI. If both fail, it goes to a second model, gpt-5.4-nano, through Azure then OpenAI. If those fail too, it goes to claude-opus-5 through any available provider. The first success answers the request, and the response metadata lists every attempt. Below, what can trigger a fallback: downtime, rate limits, context-length errors, and moderation refusals.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
