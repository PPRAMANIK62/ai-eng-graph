al" class="t-ink" xml:space="preserve">layer 2</text><text x="225" y="254" font-size="13" text-anchor="middle" font-weight="700" class="t-grey" xml:space="preserve">3</text><line x1="283" y1="207" x2="317" y2="207" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="320" y="182" width="110" height="50" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="375" y="207" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">layer 3</text><text x="375" y="254" font-size="13" text-anchor="middle" font-weight="700" class="t-grey" xml:space="preserve">9</text><line x1="433" y1="207" x2="467" y2="207" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="470" y="182" width="110" height="50" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="525" y="207" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">layer 4</text><text x="525" y="254" font-size="13" text-anchor="middle" font-weight="700" class="t-grey" xml:space="preserve">27</text><line x1="583" y1="207" x2="617" y2="207" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="620" y="182" width="110" height="50" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="675" y="207" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">layer 5</text><text x="675" y="254" font-size="13" text-anchor="middle" font-weight="700" class="t-orange" xml:space="preserve">81</text><line x1="733" y1="207" x2="767" y2="207" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="770" y="182" width="110" height="50" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="825" y="207" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">database</text><text x="825" y="254" font-size="13" text-anchor="middle" font-weight="700" class="t-red" xml:space="preserve">243× load</text><text x="20" y="288" font-size="12.5" class="t-muted" xml:space="preserve">Numbers: requests arriving at each box for one original request. Fix: retry at one layer, turn the others off.</text></g>
<text x="24" y="363" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Bottom row from Marc Brooker, “Timeouts, retries, and backoff with jitter” (Amazon, 2019). Top row is an illustration.</text>
