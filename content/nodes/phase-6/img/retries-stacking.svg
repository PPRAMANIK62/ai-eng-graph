<g transform="translate(0 44)"><text x="20" y="16" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">An LLM app with retries at three layers (example: 3 tries each)</text><rect x="20" y="34" width="140" height="50" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="90" y="50.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">one user</text><text x="90" y="67.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">question</text><text x="90" y="106" font-size="13" text-anchor="middle" font-weight="700" class="t-grey" xml:space="preserve">1</text><line x1="163" y1="59" x2="199" y2="59" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="202" y="34" width="140" height="50" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="272" y="50.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">your retry loop</text><text x="272" y="67.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">3 attempts</text><text x="272" y="106" font-size="13" text-anchor="middle" font-weight="700" class="t-blue" xml:space="preserve">1</text><line x1="345" y1="59" x2="381" y2="59" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="384" y="34" width="140" height="50" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="454" y="50.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">SDK retries</text><text x="454" y="67.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">3 attempts each</text><text x="454" y="106" font-size="13" text-anchor="middle" font-weight="700" class="t-blue" xml:space="preserve">3</text><line x1="527" y1="59" x2="563" y2="59" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)