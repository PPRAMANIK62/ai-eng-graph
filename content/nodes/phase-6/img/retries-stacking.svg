<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 920 374" width="920" height="374" role="img" aria-labelledby="fig-1mvf0qy-t fig-1mvf0qy-d">
<title id="fig-1mvf0qy-t">Retries at several layers multiply</title>
<desc id="fig-1mvf0qy-d">How retries stack in an LLM app. One user question goes through your own retry loop of 3 attempts; each attempt goes through the SDK, which retries 3 times; each SDK call reaches a gateway that tries 3 models: 3 × 3 × 3 = 27 calls to model providers for one question. Below, Amazon's example: five layers of services, each retrying 3 times, send 243 times the load to the database at the bottom. The fix in both cases is to retry at one layer and turn the others off.</desc>
