<g transform="translate(0 44)"><rect x="24" y="8" width="158" height="148" rx="10" class="s-blue" fill="none" stroke-width="1.5"/><rect x="24" y="8" width="158" height="40" rx="10" class="fs-blue s-blue" stroke-width="1.5"/><rect x="24.75" y="38" width="156.5" height="10" rx="0" class="fs-blue"/><line x1="24" y1="48" x2="182" y2="48" class="s-blue" stroke-width="1.5"/><text x="38" y="28" font-size="15" font-weight="700" dominant-baseline="central" class="t-blue" xml:space="preserve">1</text><text x="54" y="28" font-size="13.5" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Define good</text><text x="36" y="74" font-size="13" class="t-ink" xml:space="preserve">Success criteria you</text><text x="36" y="93" font-size="13" class="t-ink" xml:space="preserve">can measure. Expect</text><text x="36" y="112" font-size="13" class="t-ink" xml:space="preserve">to revise them.</text><line x1="185" y1="82" x2="201" y2="82" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="204" y="8" width="158" height="148" rx="10" class="s-purple" fill="none" stroke-width="1.5"/><rect x="204" y="8" width="158" height="40" rx="10" class="fs-purple s-purple" stroke-width="1.5"/><rect x="204.75" y="38" width="156.5" height="10" rx="0" class="fs-purple"/><line x1="204" y1="48" x2="362" y2="48" class="s-purple" stroke-width="1.5"/><text x="218" y="28" font-size="15" font-weight="700" dominant-baseline="central" class="t-purple" xml:space="preserve">2</text><text x="234" y="28" font-size="13.5" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Read outputs</text><text x="216" y="74" font-size="13" class="t-ink" xml:space="preserve">About 100 diverse</text><text x="216" y="93" font-size="13" class="t-ink" xml:space="preserve">traces, the first 30</text><text x="216" y="112" font-size="13" class="t-ink" xml:space="preserve">yourself. List how it</text><text x="216" y="131" font-size="13" class="t-ink" xml:space="preserve">fails.</text><line x1="365" y1="82" x2="381" y2="82" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="384" y="8" width="158" height="148" rx="10" class="s-orange" fill="none" stroke-width="1.5"/><rect x="384" y="8" width="158" height="40" rx="10" class="fs-orange s-orange" stroke-width="1.5"/><rect x="384.75" y="38" width="156.5" height="10" rx="0" class="fs-orange"/><line x1="384" y1="48" x2="542" y2="48" class="s-orange" stroke-width="1.5"/><text x="398" y="28" font-size="15" font-weight="700" dominant-baseline="central" class="t-orange" xml:space="preserve">3</text><text x="414" y="28" font-size="13.5" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Collect tasks</text><text x="396" y="74" font-size="13" class="t-ink" xml:space="preserve">20 to 50, from real</text><text x="396" y="93" font-size="13" class="t-ink" xml:space="preserve">failures, manual</text><text x="396" y="112" font-size="13" class="t-ink" xml:space="preserve">checks and the</text><text x="396" y="131" font-size="13" class="t-ink" xml:space="preserve">support queue.</text><line x1="545" y1="82" x2="561" y2="82" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="564" y="8" width="158" height="148" rx="10" class="s-red" fill="none" stroke-width="1.5"/><rect x="564" y="8" width="158" height="40" rx="10" class="fs-red s-red" stroke-width="1.5"/><rect x="564.75" y="38" width="156.5" height="10" rx="0" class="fs-red"/><line x1="564" y1="48" x2="722" y2="48" class="s-red" stroke-width="1.5"/><text x="578" y="28" font-size="15" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">4</text><text x="594" y="28" font-size="13.5" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Pick graders</text><text x="576" y="74" font-size="13" class="t-ink" xml:space="preserve">Code where a rule</text><text x="576" y="93" font-size="13" class="t-ink" xml:space="preserve">decides. A model</text><text x="576" y="112" font-size="13" class="t-ink" xml:space="preserve">where you need</text><text x="576" y="131" font-size="13" class="t-ink" xml:space="preserve">judgment.</text><line x1="725" y1="82" x2="741" y2="82" class="s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="744" y="8" width="158" height="148" rx="10" class="s-green" fill="none" stroke-width="1.5"/><rect x="744" y="8" width="158" height="40" rx="10" class="fs-green s-green" stroke-width="1.5"/><rect x="744.75" y="38" width="156.5" height="10" rx="0" class="fs-green"/><line x1="744" y1="48" x2="902" y2="48" class="s-green" stroke-width="1.5"/><text x="758" y="28" font-size="15" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">5</text><text x="774" y="28" font-size="13.5" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Run and track</text><text x="756" y="74" font-size="13" class="t-ink" xml:space="preserve">On every change.</text><text x="756" y="93" font-size="13" class="t-ink" xml:space="preserve">Keep the score next</text><text x="756" y="112" font-size="13" class="t-ink" xml:space="preserve">to the prompt and</text><text x="756" y="131" font-size="13" class="t-ink" xml:space="preserve">model version.</text><path d="M823,160 L823,190 L283,190 L283,164" class="s-muted" stroke-width="2" fill="none" marker-end="url(#ah-muted)"/><rect x="353" y="178" width="400" height="24" class="bg"/><text x="553" y="190" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-muted" xml:space="preserve">Every new failure becomes a task. Keep reading outputs.</text></g>

