<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 926 264" width="926" height="264" role="img" aria-labelledby="fig-1k85vau-t fig-1k85vau-d">
<title id="fig-1k85vau-t">Building a first eval set</title>
<desc id="fig-1k85vau-d">Five steps to a first eval set. 1: Write down what good means. 2: Read outputs, about 100 diverse traces, the first 30 yourself, and list how it fails. 3: Collect 20 to 50 tasks from real failures, manual checks and the support queue. 4: Pick a grader per failure, code first, a model where you need judgment. 5: Run on every change and track the number, then add each new failure as a task. An arrow runs from step 5 back to step 2: keep reading outputs.</desc>
