<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 700 550" width="700" height="550" role="img" aria-labelledby="fig-12z8ke0-t fig-12z8ke0-d">
<title id="fig-12z8ke0-t">HNSW searches from the sparse top layer down</title>
<desc id="fig-12z8ke0-d">Three stacked layers of the same graph. The top layer has three vectors joined by long links, the middle layer has seven, and the bottom layer has all sixteen with short links. A search path starts at the entry point in the top layer, walks to the vector nearest the query, drops down a layer, walks again, and drops again, finishing next to the query in the bottom layer.</desc>
<style>
