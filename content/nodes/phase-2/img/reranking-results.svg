<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 384" width="900" height="384" role="img" aria-labelledby="fig-wmu2ux-t fig-wmu2ux-d">
<title id="fig-wmu2ux-t">Against a tuned first stage, a reranker won clearly on two of five datasets</title>
<desc id="fig-wmu2ux-d">Horizontal bar chart of the nDCG@10 change from adding the best of four cross-encoder rerankers, measured against hybrid search with tuned fusion, on five datasets. CodeSearchNet +0.135 and DBPedia-entity +0.115 held up on held-out queries. SciFact +0.033 and ArguAna +0.017 did not hold up. WANDS −0.008: the reranker lost. Against untuned default fusion, all five looked like gains, from +0.031 to +0.169.</desc>
