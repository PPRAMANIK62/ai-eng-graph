<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 730 392" width="730" height="392" role="img" aria-labelledby="fig-1e05yie-t fig-1e05yie-d">
<title id="fig-1e05yie-t">In the original paper, k barely mattered between 20 and 100</title>
<desc id="fig-1e05yie-d">Line chart from Cormack et al. (2009): retrieval quality (MAP) of reciprocal rank fusion over 30 search systems as k goes from 0 to 100. It rises from 0.2072 at k = 0 to about 0.214 by k = 30 and stays nearly flat through k = 100, peaking at 0.2147 at k = 80; at k = 60 it is 0.2145. At k = 500 it drops to 0.2098. Every value is above the best single system, 0.2016.</desc>
