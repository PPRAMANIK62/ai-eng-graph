<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 800 383" width="800" height="383" role="img" aria-labelledby="fig-1u5p2on-t fig-1u5p2on-d">
<title id="fig-1u5p2on-t">One document, three ways to cut it</title>
<desc id="fig-1u5p2on-d">The same short document split three ways. Fixed-size chunks cut every N tokens, so a border falls in the middle of a sentence. Recursive splitting tries paragraph breaks first, then sentence ends, so each chunk ends on a boundary. Structure-aware splitting follows the headings, so each chunk is one section with its heading.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
