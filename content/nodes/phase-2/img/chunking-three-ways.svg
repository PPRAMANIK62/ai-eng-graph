<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="800" height="383"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">One document, three ways to cut it</text>
<g transform="translate(0 44)"><text x="24" y="10" font-size="14" font-weight="700" class="t-ink" xml:space="preserve">Fixed-size</text><text x="24" y="28" font-size="12" class="t-muted" xml:space="preserve">cut every N tokens</text><rect x="24" y="44" width="236" height="48" rx="5" class="fs-blue s-blue" stroke-width="1.5"/><text x="34" y="63" font-size="12.5" class="t-ink" xml:space="preserve">Q2 results. Revenue grew 3% over</text><text x="34" y="80" font-size="12.5" class="t-ink" xml:space="preserve">the previous</text><line x1="20" y1="96" x2="264" y2="96" class="s-red" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="24" y="100" width="236" height="48" rx="5" class="fs-orange s-orange" stroke-width="1.5"/><text x="34" y="119" font-size="12.5" class="t-ink" xml:space="preserve">quarter. Most of the growth came</text><text x="34" y="136" font-size="12.5" class="t-ink" xml:space="preserve">from the cloud unit. Operating</text><line x1="20" y1="152" x2="264" y2="152" class="s-red" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="24" y="156" width="236" height="65" rx="5" class="fs-green s-green" stroke-width="1.5"/><text x="34" y="175" font-size="12.5" class="t-ink" xml:space="preserve">costs were flat, so margins</text><text x="34" y="192" font-size="12.5" class="t-ink" xml:space="preserve">improved. Outlook. The company</text><text x="34" y="209" font-size="12.5" class="t-ink" xml:space="preserve">expects</text><line x1="20" y1="225" x2="264" y2="225" class="s-red" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="24" y="229" width="236" height="48" rx="5" class="fs-purple s-purple" stroke-width="1.5"/><text x="34" y="248" font-size="12.5" class="t-ink" xml:space="preserve">slower growth in Q3 as two large</text><text x="34" y="265" font-size="12.5" class="t-ink" xml:space="preserve">contracts end.</text><text x="282" y="10" font-size="14" font-weight="700" class="t-ink" xml:space="preserve">Recursive</text><text x="282" y="28" font-size="12" class="t-muted" xml:space="preserve">paragraphs first, then smaller breaks</text><rect x="282" y="44" width="236" height="65" rx="5" class="fs-blue s-blue" stroke-width="1.5"/><text x="292" y="63" font-size="12.5" class="t-ink" xml:space="preserve">Q2 results. Revenue grew 3% over</text><text x="292" y="80" font-size="12.5" class="t-ink" xml:space="preserve">the previous quarter. Most of the</text><text x="292" y="97" font-size="12.5" class="t-ink" xml:space="preserve">growth came from the cloud unit.</text><rect x="282" y="117" width="236" height="82" rx="5" class="fs-orange s-orange" stroke-width="1.5"/><text x="292" y="136" font-size="12.5" class="t-ink" xml:space="preserve">Operating costs were flat, so</text><text x="292" y="153" font-size="12.5" class="t-ink" xml:space="preserve">margins improved. Outlook. The</text><text x="292" y="170" font-size="12.5" class="t-ink" xml:space="preserve">company expects slower growth in</text><text x="292" y="187" font-size="12.5" class="t-ink" xml:space="preserve">Q3 as two large contracts end.</text><text x="282" y="217" font-size="12" font-style="italic" class="t-muted" xml:space="preserve">ends on boundaries, but mixes two sections</text><text x="540" y="10" font-size="14" font-weight="700" class="t-ink" xml:space="preserve">Structure-aware</text><text x="540" y="28" font-size="12" class="t-muted" xml:space="preserve">one section per chunk</text><rect x="540" y="44" width="236" height="99" rx="5" class="fs-blue s-blue" stroke-width="1.5"/><text x="550" y="63" font-size="12.5" class="t-ink" xml:space="preserve">Q2 results. Revenue grew 3% over</text><text x="550" y="80" font-size="12.5" class="t-ink" xml:space="preserve">the previous quarter. Most of the</text><text x="550" y="97" font-size="12.5" class="t-ink" xml:space="preserve">growth came from the cloud unit.</text><text x="550" y="114" font-size="12.5" class="t-ink" xml:space="preserve">Operating costs were flat, so</text><text x="550" y="131" font-size="12.5" class="t-ink" xml:space="preserve">margins improved.</text><rect x="540" y="151" width="236" height="65" rx="5" class="fs-orange s-orange" stroke-width="1.5"/><text x="550" y="170" font-size="12.5" class="t-ink" xml:space="preserve">Outlook. The company expects</text><text x="550" y="187" font-size="12.5" class="t-ink" xml:space="preserve">slower growth in Q3 as two large</text><text x="550" y="204" font-size="12.5" class="t-ink" xml:space="preserve">contracts end.</text><line x1="24" y1="295" x2="42" y2="295" class="s-red" stroke-width="1.5" stroke-dasharray="5 4"/><text x="50" y="299" font-size="12" class="t-red" xml:space="preserve">border falls mid-sentence</text></g>
<text x="24" y="372" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Illustrative: made-up text and cut points, not measured data.</text>
</svg>
