<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 920 406" width="920" height="406" role="img" aria-labelledby="fig-1ofr2pz-t fig-1ofr2pz-d">
<title id="fig-1ofr2pz-t">Why reranking is a second stage</title>
<desc id="fig-1ofr2pz-d">Two ways to score a document against a query. Left, the first stage (a bi-encoder): the query and the document go through the model separately, each becomes a vector, and the vectors are compared. Document vectors are made ahead of time and stored, so this is fast over millions of documents. Right, the reranker (a cross-encoder): the query and one document go into the model together as one input, and it outputs a single relevance score. Nothing can be stored ahead of time, so it runs once per candidate at query time. Below, the two-stage pipeline: first stage over the whole collection, top 150 candidates to the reranker, top 20 to the model.</desc>
