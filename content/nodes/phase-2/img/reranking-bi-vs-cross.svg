<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Why reranking is a second stage</text>
<g transform="translate(0 44)"><text x="20" y="10" font-size="14.5" font-weight="700" class="t-blue" xml:space="preserve">First stage: bi-encoder</text><text x="20" y="30" font-size="12.5" class="t-muted" xml:space="preserve">query and document encoded separately</text><rect x="20" y="50" width="110" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="75" y="67" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">query</text><rect x="20" y="120" width="110" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="75" y="137" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">document</text><rect x="170" y="50" width="90" height="34" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="215" y="67" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">model</text><rect x="170" y="120" width="90" height="34" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="215" y="137" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">model</text><line x1="130" y1="67" x2="168" y2="67" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="130" y1="137" x2="168" y2="137" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="300" y="50" width="70" height="34" rx="6" class="s-blue" fill="none" stroke-width="1.5"/><text x="335" y="67" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">vector</text><rect x="300" y="120" width="70" height="34" rx="6" class="s-blue" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="335" y="137" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">vector</text><line x1="260" y1="67" x2="298" y2="67" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="260" y1="137" x2="298" y2="137" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="335" y="172" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">made ahead, stored</text><line x1="370" y1="67" x2="398" y2="95" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="370" y1="137" x2="398" y2="109" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="400" y="85" width="60" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="430" y="102" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">compare</text><text x="20" y="205" font-size="12.5" class="t-ink" xml:space="preserve">Fast over millions of documents, but each vector</text><text x="20" y="223" font-size="12.5" class="t-ink" xml:space="preserve">was made before anyone asked the question.</text><line x1="478" y1="0" x2="478" y2="230" class="grid" stroke-width="1"/><text x="500" y="10" font-size="14.5" font-weight="700" class="t-orange" xml:space="preserve">Reranker: cross-encoder</text><text x="500" y="30" font-size="12.5" class="t-muted" xml:space="preserve">query and document read together</text><rect x="500" y="80" width="150" height="48" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="575" y="97" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">query</text><text x="575" y="116" font-size="13" text-anchor="middle" class="t-ink" xml:space="preserve">+ one document</text><rect x="680" y="80" width="90" height="48" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="725" y="104" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">model</text><line x1="650" y1="104" x2="678" y2="104" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="800" y="84" width="90" height="40" rx="6" class="s-orange" fill="none" stroke-width="1.5"/><text x="845" y="96.2" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">relevance</text><text x="845" y="111.8" font-size="12" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">score</text><line x1="770" y1="104" x2="798" y2="104" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="500" y="205" font-size="12.5" class="t-ink" xml:space="preserve">More accurate, but nothing can be stored:</text><text x="500" y="223" font-size="12.5" class="t-ink" xml:space="preserve">it runs once per candidate, at query time.</text><line x1="20" y1="250" x2="900" y2="250" class="grid" stroke-width="1"/><text x="20" y="270" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">So you use both, in two stages</text><rect x="20" y="286" width="150" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="95" y="303" font-size="13" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">whole collection</text><line x1="174" y1="303" x2="200" y2="303" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="204" y="286" width="120" height="34" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="264" y="303" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">first stage</text><line x1="328" y1="303" x2="354" y2="303" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="358" y="286" width="100" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="408" y="303" font-size="13" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">top 150</text><line x1="462" y1="303" x2="488" y2="303" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="492" y="286" width="110" height="34" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="547" y="303" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">reranker</text><line x1="606" y1="303" x2="632" y2="303" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="636" y="286" width="90" height="34" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="681" y="303" font-size="13" text-anchor="middle" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">top 20</text><line x1="730" y1="303" x2="756" y2="303" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="760" y="286" width="90" height="34" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="805" y="303" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">model</text></g>
<text x="24" y="395" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Mechanism from Sentence Transformers docs and Nogueira &amp; Cho (2019). 150 to 20 is Anthropic's setup (2024).</text>
</svg>
