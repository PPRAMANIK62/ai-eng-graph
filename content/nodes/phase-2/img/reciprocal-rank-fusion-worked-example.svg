<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 820 374" width="820" height="374" role="img" aria-labelledby="fig-nnrje3-t fig-nnrje3-d">
<title id="fig-nnrje3-t">Reciprocal rank fusion on two short lists</title>
<desc id="fig-nnrje3-d">Two ranked lists merged with reciprocal rank fusion. Keyword list: A, B, C, D. Vector list: F, A, B, C. With k = 60 the fused order is A 0.0325, B 0.0320, C 0.0315, F 0.0164, D 0.0156: documents found by both lists come first, and F, top of the vector list only, drops to fourth. With k = 1 the order is A 0.833, B 0.583, F 0.500, C 0.450, D 0.200: F now beats C.</desc>
<style>
