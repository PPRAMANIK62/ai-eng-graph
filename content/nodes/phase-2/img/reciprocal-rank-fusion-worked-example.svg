<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Reciprocal rank fusion on two short lists</text>
<g transform="translate(0 44)"><text x="90" y="12" font-size="14" text-anchor="middle" font-weight="600" class="t-ink" xml:space="preserve">Keyword list</text><text x="90" y="30" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">rank 1 to 4</text><text x="250" y="12" font-size="14" text-anchor="middle" font-weight="600" class="t-ink" xml:space="preserve">Vector list</text><text x="250" y="30" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">rank 1 to 4</text><text x="480" y="12" font-size="14" text-anchor="middle" font-weight="600" class="t-ink" xml:space="preserve">Fused, k = 60</text><text x="480" y="30" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">sum of 1 / (60 + rank)</text><text x="700" y="12" font-size="14" text-anchor="middle" font-weight="600" class="t-ink" xml:space="preserve">Fused, k = 1</text><text x="700" y="30" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">sum of 1 / (1 + rank)</text><rect x="30" y="50" width="120" height="32" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="90" y="66" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">1.  A</text><rect x="30" y="90" width="120" height="32" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="90" y="106" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">2.  B</text><rect x="30" y="130" width="120" height="32" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="90" y="146" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">3.  C</text><rect x="30" y="170" width="120" height="32" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="90" y="186" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">4.  D</text><rect x="190" y="50" width="120" height="32" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="250" y="66" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">1.  F</text><rect x="190" y="90" width="120" height="32" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="250" y="106" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">2.  A</text><rect x="190" y="130" width="120" height="32" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="250" y="146" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">3.  B</text><rect x="190" y="170" width="120" height="32" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="250" y="186" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">4.  C</text><rect x="400" y="50" width="160" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="480" y="66" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">1.  A   0.0325</text><rect x="400" y="90" width="160" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="480" y="106" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">2.  B   0.0320</text><rect x="400" y="130" width="160" height="32" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="480" y="146" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">3.  C   0.0315</text><rect x="400" y="170" width="160" height="32" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="480" y="186" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">4.  F   0.0164</text><rect x="400" y="210" width="160" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="480" y="226" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">5.  D   0.0156</text><rect x="620" y="50" width="160" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="700" y="66" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">1.  A   0.833</text><rect x="620" y="90" width="160" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="700" y="106" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">2.  B   0.583</text><rect x="620" y="130" width="160" height="32" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="700" y="146" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">3.  F   0.500</text><rect x="620" y="170" width="160" height="32" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="700" y="186" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">4.  C   0.450</text><rect x="620" y="210" width="160" height="32" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="700" y="226" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">5.  D   0.200</text><line x1="324" y1="126" x2="386" y2="126" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="30" y1="248" x2="800" y2="248" class="grid" stroke-width="1"/><text x="30" y="268" font-size="13" class="t-green" xml:space="preserve">k = 60: C, found by both lists, stays well ahead of F, found by one.</text><text x="30" y="290" font-size="13" class="t-purple" xml:space="preserve">k = 1: F's first place in one list is now worth more than C's two lower places.</text></g>
<text x="24" y="363" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Made-up lists, real arithmetic. D appears in one list only, near the bottom.</text>
