<title id="fig-21vt73-t">Nine sentences, scored against one question</title>
<desc id="fig-21vt73-d">Bar chart of cosine scores for the question 'How do artificial neural networks work?' against nine sentences. The three machine-learning sentences score highest: neural networks 0.593, deep learning 0.529, machine learning 0.465. The six space and climate sentences all score between 0.02 and 0.14.</desc>
