<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 720 406" width="720" height="406" role="img" aria-labelledby="fig-jr571g-t fig-jr571g-d">
<title id="fig-jr571g-t">Recall@k climbs one step per relevant result</title>
<desc id="fig-jr571g-d">A step chart of recall at k for one question with 8 results, where the relevant chunks sit at ranks 2, 4, 5 and 7. Recall is 0 at k = 1, 0.25 at k = 2 and 3, 0.5 at k = 4, 0.75 at k = 5 and 6, and 1 from k = 7. It steps up at each relevant chunk and never goes down.</desc>
<style>
