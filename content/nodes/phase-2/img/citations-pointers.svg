<g transform="translate(0 44)"><text x="24" y="12" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">The answer comes back as text blocks</text><text x="560" y="12" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">Document 0 (plain text), split into sentences</text><rect x="550" y="28" width="350" height="184" rx="6" class="s-grey" fill="none" stroke-width="1"/><rect x="560" y="40" width="330" height="74" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="576" y="68" font-size="15" font-weight="600" class="t-ink" xml:space="preserve">The grass is green.</text><text x="576" y="92" font-size="12.5" class="t-muted mono" xml:space="preserve">characters 0 to 20</text><rect x="560" y="126" width="330" height="74" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="576" y="154" font-size="15" font-weight="600" class="t-ink" xml:space="preserve">The sky is blue.</text><text x="576" y="178" font-size="12.5" class="t-muted mono" xml:space="preserve">characters 20 to 36</text><rect x="24" y="28" width="300" height="44" rx="6" class="s-grey" fill="none" stroke-width="1" stroke-dasharray="5 4"/><text x="38" y="50" font-size="14" dominant-baseline="central" class="t-muted" xml:space="preserve">“According to the document, ”</text><text x="312" y="50" font-size="12" text-anchor="end" dominant-baseline="central" class="t-muted" xml:space="preserve">no citation</text><rect x="24" y="86" width="300" height="44" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="38" y="108" font-size="14" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">“the grass is green”</text><line x1="324" y1="108" x2="548" y2="77" class="s-green" stroke-width="1.6" marker-end="url(#ah-green)"/><text x="338" y="70.5" font-size="12" class="t-green mono" xml:space="preserve">doc 0 · chars 0–20</text><rect x="24" y="144" width="300" height="44" rx="6" class="s-grey" fill="none" stroke-width="1" stroke-dasharray="5 4"/><text x="38" y="166" font-size="14" dominant-baseline="central" class="t-muted" xml:space="preserve">“ and ”</text><text x="312" y="166" font-size="12" text-anchor="end" dominant-baseline="central" class="t-muted" xml:space="preserve">no citation</text><rect x="24" y="202" width="300" height="44" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="38" y="224" font-size="14" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">“the sky is blue”</text><line x1="324" y1="224" x2="548" y2="163" class="s-green" stroke-width="1.6" marker-end="url(#ah-green)"/><text x="338" y="171.5" font-size="12" class="t-green mono" xml:space="preserve">doc 0 · chars 20–36</text><text x="24" y="268" font-size="13.5" class="t-ink" xml:space="preserve">Join the blocks: “According to the document, the grass is green and the sky is blue.”</text><text x="24" y="290" font-size="13" class="t-muted" xml:space="preserve">Each citation also carries the cited text itself, copied out by the API, not written by the model.</text></g>
