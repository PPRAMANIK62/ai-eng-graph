<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 924 376" width="924" height="376" role="img" aria-labelledby="fig-1s97d2e-t fig-1s97d2e-d">
<title id="fig-1s97d2e-t">A citation is a pointer from a claim to a place in your document</title>
<desc id="fig-1s97d2e-d">An answer made of four text blocks: two plain connecting blocks and two cited claims. The claim “the grass is green” points to characters 0 to 20 of the document, the sentence “The grass is green.” The claim “the sky is blue” points to characters 20 to 36, “The sky is blue.” Each citation carries the document index, the character range and the cited text.</desc>
