<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 826 340" width="826" height="340" role="img" aria-labelledby="fig-bqp9aj-t fig-bqp9aj-d">
<title id="fig-bqp9aj-t">A criterion you can test has a number, a test set and several dimensions</title>
<desc id="fig-bqp9aj-d">A before and after card for a sentiment classifier. Before: &quot;The model should classify sentiments well.&quot; After, on a held-out set of 10,000 diverse posts: F1 of at least 0.85, 99.5% of outputs non-toxic, 90% of errors an inconvenience rather than an egregious error, and 95% of responses in under 200 ms. A note says you'd still have to define &quot;inconvenience&quot; and &quot;egregious&quot;.</desc>
<style>
