<g transform="translate(0 44)"><rect x="24" y="8" width="250" height="250" rx="10" class="fs-red s-red" stroke-width="1.5"/><text x="42" y="38" font-size="15" font-weight="700" class="t-red" xml:space="preserve">Before</text><text x="42" y="60" font-size="13" class="t-muted" xml:space="preserve">can't be tested</text><text x="42" y="106" font-size="16" font-style="italic" class="t-ink" xml:space="preserve">“The model should</text><text x="42" y="130" font-size="16" font-style="italic" class="t-ink" xml:space="preserve">classify sentiments</text><text x="42" y="154" font-size="16" font-style="italic" class="t-ink" xml:space="preserve">well.”</text><rect x="302" y="8" width="500" height="250" rx="10" class="fs-green s-green" stroke-width="1.5"/><text x="320" y="38" font-size="15" font-weight="700" class="t-green" xml:space="preserve">After</text><text x="320" y="60" font-size="13" class="t-muted" xml:space="preserve">on a held-out set of 10,000 diverse posts:</text><text x="320" y="98" font-size="14" font-weight="700" class="t-green" xml:space="preserve">✓</text><text x="340" y="98" font-size="14" class="t-ink" xml:space="preserve">F1 of at least 0.85</text><text x="784" y="98" font-size="12.5" text-anchor="end" class="t-muted" xml:space="preserve">task fidelity</text><text x="320" y="132" font-size="14" font-weight="700" class="t-green" xml:space="preserve">✓</text><text x="340" y="132" font-size="14" class="t-ink" xml:space="preserve">99.5% of outputs non-toxic</text><text x="784" y="132" font-size="12.5" text-anchor="end" class="t-muted" xml:space="preserve">toxicity</text><text x="320" y="166" font-size="14" font-weight="700" class="t-green" xml:space="preserve">✓</text><text x="340" y="166" font-size="14" class="t-ink" xml:space="preserve">90% of errors: inconvenience, not egregious*</text><text x="784" y="166" font-size="12.5" text-anchor="end" class="t-muted" xml:space="preserve">error severity</text><text x="320" y="200" font-size="14" font-weight="700" class="t-green" xml:space="preserve">✓</text><text x="340" y="200" font-size="14" class="t-ink" xml:space="preserve">95% of responses &lt; 200 ms</text><text x="784" y="200" font-size="12.5" text-anchor="end" class="t-muted" xml:space="preserve">latency</text><text x="320" y="224" font-size="12.5" class="t-muted" xml:space="preserve">* you'd still have to define what “inconvenience”</text><text x="320" y="241" font-size="12.5" class="t-muted" xml:space="preserve">and “egregious” mean for your product</text></g>
<text x="24" y="329" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Adapted from Anthropic's “Define success criteria and build evaluations” docs.</text>
