<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 894 382" width="894" height="382" role="img" aria-labelledby="fig-8vxtvc-t fig-8vxtvc-d">
<title id="fig-8vxtvc-t">An eval: fixed inputs, a grader, and a number you track</title>
<desc id="fig-8vxtvc-d">An eval in four parts. A fixed set of test cases, each an input with the answer you expect, goes into your feature (prompt, model, retrieval and code together). Each output goes to a grader: code, an LLM or a person. The grader's verdicts add up to one score, 27 of 30 in the ticket example. Version 1 scores 90%; after each change you run the same set again and compare, so a change that drops the score is caught before it ships.</desc>
<style>
