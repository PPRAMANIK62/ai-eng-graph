seline="central" class="t-green" xml:space="preserve">90%</text><line x1="230" y1="270" x2="254" y2="270" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="260" y="248" width="200" height="44" rx="6" class="s-grey" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="274" y="270" font-size="13.5" dominant-baseline="central" class="t-ink" xml:space="preserve">prompt v2</text><text x="446" y="270" font-size="15" text-anchor="end" font-weight="700" dominant-baseline="central" class="t-muted" xml:space="preserve">?</text><line x1="466" y1="270" x2="490" y2="270" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="496" y="248" width="200" height="44" rx="6" class="s-grey" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="510" y="270" font-size="13.5" dominant-baseline="central" class="t-ink" xml:space="preserve">model upgrade</text><text x="682" y="270" font-size="15" text-anchor="end" font-weight="700" dominant-baseline="central" class="t-muted" xml:space="preserve">?</text><text x="714" y="262" font-size="12.5" class="t-muted" xml:space="preserve">A drop means the</text><text x="714" y="279" font-size="12.5" class="t-muted" xml:space="preserve">change broke something.</text></g>
<text x="24" y="371" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Illustrative example (ticket triage), not a measurement.</text>
