<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 864 344" width="864" height="344" role="img" aria-labelledby="fig-q0v88k-t fig-q0v88k-d">
<title id="fig-q0v88k-t">Chunking barely moves recall, but changes how much junk comes with it</title>
<desc id="fig-q0v88k-d">Paired bars for six chunking settings, measured with text-embedding-3-large. Recall stays between 84% and 92% for all of them. IoU, the share of retrieved text that is actually answer, ranges from 1.4% for 800-token chunks with 400 overlap up to 6.9% for recursive 200-token chunks with no overlap and 8.0% for a cluster-based semantic chunker.</desc>
