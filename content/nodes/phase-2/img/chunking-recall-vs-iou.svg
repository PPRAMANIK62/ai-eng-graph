<g transform="translate(0 44)"><text x="254" y="12" font-size="13" font-weight="600" class="t-ink" xml:space="preserve">Recall: share of the answer retrieved</text><text x="564" y="12" font-size="13" font-weight="600" class="t-ink" xml:space="preserve">IoU: share of retrieved text that is answer</text><text x="242" y="55" font-size="13" text-anchor="end" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">Fixed 800 tokens, 400 overlap</text><rect x="254" y="44" width="202.17" height="20" rx="2" class="f-blue"/><text x="462.17" y="55" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">87.9%</text><rect x="564" y="44" width="32.2" height="20" rx="2" class="f-orange"/><text x="602.2" y="55" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">1.4%</text><text x="242" y="89" font-size="13" text-anchor="end" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">Semantic, default settings</text><rect x="254" y="78" width="192.28" height="20" rx="2" class="f-blue"/><text x="452.28" y="89" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">83.6%</text><rect x="564" y="78" width="34.5" height="20" rx="2" class="f-orange"/><text x="604.5" y="89" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">1.5%</text><text x="242" y="123" font-size="13" text-anchor="end" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">Recursive 400, no overlap</text><rect x="254" y="112" width="205.85" height="20" rx="2" class="f-blue"/><text x="465.85" y="123" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">89.5%</text><rect x="564" y="112" width="82.8" height="20" rx="2" class="f-orange"/><text x="652.8" y="123" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">3.6%</text><text x="242" y="157" font-size="13" text-anchor="end" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">LLM decides the cuts</text><rect x="254" y="146" width="211.37" height="20" rx="2" class="f-blue"/><text x="471.37" y="157" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">91.9%</text><rect x="564" y="146" width="89.7" height="20" rx="2" class="f-orange"/><text x="659.7" y="157" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">3.9%</text><text x="242" y="191" font-size="13" text-anchor="end" font-weight="700" dominant-baseline="central" class="t-ink" xml:space="preserve">Recursive 200, no overlap</text><rect x="254" y="180" width="202.63" height="20" rx="2" class="f-blue"/><text x="462.63" y="191" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">88.1%</text><rect x="564" y="180" width="158.7" height="20" rx="2" class="f-orange"/><text x="728.7" y="191" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">6.9%</text><text x="242" y="225" font-size="13" text-anchor="end" font-weight="400" dominant-baseline="central" class="t-ink" xml:space="preserve">Cluster semantic, 200</text><rect x="254" y="214" width="200.79" height="20" rx="2" class="f-blue"/><text x="460.79" y="225" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">87.3%</text><rect x="564" y="214" width="184" height="20" rx="2" class="f-orange"/><text x="754" y="225" font-size="12.5" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">8.0%</text><line x1="254" y1="40" x2="254" y2="244" class="axis" stroke-width="1.5"/><line x1="564" y1="40" x2="564" y2="244" class="axis" stroke-width="1.5"/><text x="254" y="262" font-size="11.5" class="t-muted" xml:space="preserve">scale 0–100%</text><text x="564" y="262" font-size="11.5" class="t-muted" xml:space="preserve">scale 0–10%</text></g>
