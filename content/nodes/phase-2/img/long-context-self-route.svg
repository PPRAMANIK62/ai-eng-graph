<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Self-Route: try the retrieved chunks first, send everything only if needed</text>
<g transform="translate(0 44)"><rect x="24" y="40" width="170" height="64" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="109" y="62.9" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">question +</text><text x="109" y="81.1" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">top 5 chunks</text><line x1="194" y1="72" x2="238" y2="72" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><rect x="242" y="40" width="210" height="64" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="347" y="62.9" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">model: can you answer</text><text x="347" y="81.1" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">from these chunks?</text><text x="347" y="28" font-size="13" text-anchor="middle" font-weight="700" class="t-blue" xml:space="preserve">step 1: cheap</text><line x1="452" y1="72" x2="540" y2="72" class="s-green" stroke-width="1.5" marker-end="url(#ah-green)"/><text x="496" y="62" font-size="13" text-anchor="middle" font-weight="700" class="t-green" xml:space="preserve">yes</text><rect x="544" y="40" width="200" height="64" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="644" y="62.9" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">answer from</text><text x="644" y="81.1" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">the chunks</text><text x="644" y="124" font-size="12.5" text-anchor="middle" class="t-muted" xml:space="preserve">GPT-4o: 57% of questions</text><text x="644" y="142" font-size="12.5" text-anchor="middle" class="t-muted" xml:space="preserve">Gemini-1.5-Pro: 82%</text><line x1="347" y1="104" x2="347" y2="206" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><text x="357" y="157" font-size="13" font-weight="700" class="t-orange" xml:space="preserve">no: &quot;unanswerable&quot;</text><rect x="242" y="210" width="210" height="64" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="347" y="232.9" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">send the full text</text><text x="347" y="251.1" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">+ question</text><text x="347" y="294" font-size="13" text-anchor="middle" font-weight="700" class="t-orange" xml:space="preserve">step 2: expensive</text><line x1="452" y1="242" x2="540" y2="242" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><rect x="544" y="210" width="200" height="64" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="644" y="232.9" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">answer from</text><text x="644" y="251.1" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">the whole text</text><text x="24" y="326" font-size="14" font-weight="700" class="t-ink" xml:space="preserve">Result, about the same quality as always sending the full text:</text><text x="24" y="350" font-size="13.5" class="t-ink" xml:space="preserve">Gemini-1.5-Pro used 38.6% of the tokens. Cost fell 65% for Gemini-1.5-Pro and 39% for GPT-4o.</text></g>
<text x="24" y="425" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Numbers from Li et al., &quot;Retrieval Augmented Generation or Long-Context LLMs?&quot; (2024), on 2024 models. Redrawn, not copied.</text>
