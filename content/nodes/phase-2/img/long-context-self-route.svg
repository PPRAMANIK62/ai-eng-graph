<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 768 436" width="768" height="436" role="img" aria-labelledby="fig-pbnj4g-t fig-pbnj4g-d">
<title id="fig-pbnj4g-t">Self-Route: try the retrieved chunks first, send everything only if needed</title>
<desc id="fig-pbnj4g-d">A flow chart. A question and the top retrieved chunks go to the model, which is asked whether it can answer from them. If yes, it answers, and the call was cheap. If not, the full text is sent and the model answers from all of it. With this router, Gemini-1.5-Pro used 38.6% of the tokens of sending the full text every time, and cost fell 65% for Gemini-1.5-Pro and 39% for GPT-4o.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
