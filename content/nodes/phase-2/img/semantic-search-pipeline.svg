er-end="url(#ah-muted)"/><text x="755" y="224" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">cosine similarity</text><line x1="755" y1="234" x2="755" y2="262" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="684" y="266" width="142" height="44" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="755" y="279.23" font-size="13.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Top k</text><text x="755" y="296.78" font-size="13.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">chunks</text></g>
