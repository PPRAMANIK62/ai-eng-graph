<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-ink"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-muted"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-blue"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-orange"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-green"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-red"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="1034" height="388"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Three checks before the system answers</text>
<g transform="translate(0 44)"><rect x="24" y="40" width="110" height="58" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="79" y="60.55" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">Question +</text><text x="79" y="77.45" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">retrieved chunks</text><line x1="136" y1="69" x2="160" y2="69" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="164" y="40" width="150" height="58" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="239" y="60.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">1. Best retrieval</text><text x="239" y="77.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">score ≥ threshold?</text><line x1="316" y1="69" x2="350" y2="69" class="s-green" stroke-width="1.5" marker-end="url(#ah-green)"/><text x="334" y="61" font-size="12" text-anchor="middle" class="t-green" xml:space="preserve">yes</text><rect x="354" y="40" width="150" height="58" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="429" y="60.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">2. Does the text</text><text x="429" y="77.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">answer the question?</text><rect x="354" y="114" width="150" height="58" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="429" y="134.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">3. Model's confidence</text><text x="429" y="151.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">in its answer</text><line x1="506" y1="69" x2="540" y2="100" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="506" y1="143" x2="540" y2="112" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><rect x="544" y="77" width="150" height="58" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="619" y="97.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">Combined score</text><text x="619" y="114.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">≥ threshold?</text><line x1="619" y1="137" x2="619" y2="222" class="s-green" stroke-width="1.5" marker-end="url(#ah-green)"/><text x="627" y="180.5" font-size="12" class="t-green" xml:space="preserve">yes</text><rect x="544" y="226" width="150" height="58" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="619" y="246.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">Answer,</text><text x="619" y="263.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-green" xml:space="preserve">with citations</text><path d="M544,125 L534,125 L534,255 L508,255" class="s-orange" stroke-width="1.5" fill="none" marker-end="url(#ah-orange)"/><text x="540" y="220" font-size="12" class="t-orange" xml:space="preserve">no</text><rect x="354" y="226" width="150" height="58" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="429" y="246.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">“This isn't in</text><text x="429" y="263.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">the docs I have.”</text><line x1="239" y1="100" x2="239" y2="222" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><text x="247" y="128" font-size="12" class="t-orange" xml:space="preserve">no</text><rect x="164" y="226" width="150" height="58" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="239" y="246.55" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">“I couldn't find</text><text x="239" y="263.45" font-size="13" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">anything on that.”</text><text x="239" y="302" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">no model call needed</text><text x="429" y="302" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">on-topic text, but no answer</text><rect x="738" y="0" width="272" height="308" rx="6" class="s-grey" fill="none" stroke-width="1"/><text x="754" y="24" font-size="14" font-weight="700" class="t-ink" xml:space="preserve">The threshold is a dial</text><line x1="782" y1="50" x2="782" y2="200" class="axis" stroke-width="1.5"/><line x1="782" y1="200" x2="984" y2="200" class="axis" stroke-width="1.5"/><text x="772" y="125" font-size="12" text-anchor="middle" transform="rotate(-90 772 125)" class="t-muted" xml:space="preserve">accuracy on answered</text><text x="883" y="220" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">coverage (share answered) →</text><path d="M790,64 C872.9,72 923.4,100 978,170" class="s-purple" stroke-width="2.2" fill="none"/><text x="792" y="84" font-size="12" font-weight="600" class="t-purple" xml:space="preserve">strict</text><text x="950" y="176" font-size="12" text-anchor="end" font-weight="600" class="t-purple" xml:space="preserve">loose</text><text x="754" y="246" font-size="12.5" class="t-ink" xml:space="preserve">Strict: answers less, more of it right.</text><text x="754" y="266" font-size="12.5" class="t-ink" xml:space="preserve">Loose: answers more, more of it wrong.</text><text x="754" y="290" font-size="12" font-style="italic" class="t-muted" xml:space="preserve">Illustrative shape, not data.</text></g>
<text x="24" y="377" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Our own diagram. Combined score after Joren et al. (2024); threshold calibration after Cohere's Rerank docs.</text>
</svg>
