<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 668 358" width="668" height="358" role="img" aria-labelledby="fig-17r8yzz-t fig-17r8yzz-d">
<title id="fig-17r8yzz-t">Reciprocal rank: most of the score is in the top two places</title>
<desc id="fig-17r8yzz-d">A bar chart of the score a question gets by the rank of its first relevant result: 1 at rank 1, 0.5 at rank 2, 0.33 at rank 3, 0.25 at rank 4, 0.2 at rank 5, and 0 if nothing relevant is in the top 5. Half the score is gone by rank 2.</desc>
