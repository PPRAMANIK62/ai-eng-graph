<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="fig-tu46ai-t fig-tu46ai-d">
<title id="fig-tu46ai-t">More recall, fewer queries per second</title>
<desc id="fig-tu46ai-d">A line chart of recall against queries per second for pgvector's HNSW index on 1 million 1,536-dimension vectors. Four points, one per ef_search setting: 10 gives 85.1% recall at 1,162 queries per second, 40 gives 96.8% at 567, 200 gives 99.6% at 156, and 800 gives 99.9% at 48. Higher recall costs throughput, and the last steps toward 100% cost the most.</desc>
<style>
