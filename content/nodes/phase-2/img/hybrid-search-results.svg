<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 880 394" width="880" height="394" role="img" aria-labelledby="fig-7a1c53-t fig-7a1c53-d">
<title id="fig-7a1c53-t">Hybrid beat the better single search on four of five datasets</title>
<desc id="fig-7a1c53-d">Grouped bar chart of nDCG@10 on five public datasets for keyword search only, vector search only and hybrid search with reciprocal rank fusion. Hybrid scores highest on four: SciFact 0.718 (best single 0.689), ArguAna 0.522 (0.491), WANDS 0.725 (0.710) and CodeSearchNet 0.656 (0.630). On DBPedia-entity, vector only scores 0.468 and hybrid 0.464, slightly lower.</desc>
