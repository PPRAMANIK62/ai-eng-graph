="95" width="120" height="46" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="620" y="118" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">fusion</text><line x1="512" y1="60" x2="558" y2="108" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="512" y1="176" x2="558" y2="128" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><text x="620" y="160" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">one ranking</text><rect x="730" y="95" width="150" height="46" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="805" y="109.88" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">top 10 to the model</text><text x="805" y="126.13" font-size="12.5" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">or reranker</text><line x1="680" y1="118" x2="728" y2="118" class="s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><line x1="20" y1="236" x2="880" y2="236" class="grid" stroke-width="1"/><text x="20" y="256" font-size="13.5" font-weight="600" class="t-ink" xml:space="preserve">Why run both: each search misses a different query</text><text x="20" y="286" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">Query</text><text x="250" y="286" font-size="12.5" font-weight="600" class="t-orange" xml:space="preserve">Keyword search's top result</text><text x="570" y="286" font-size="12.5" font-weight="600" class="t-blue" xml:space="preserve">Vector search's top result</text><text x="20" y="314" font-size="13" class="t-ink" xml:space="preserve">“french molding”</text><text x="250" y="314" font-size="13" class="t-red" xml:space="preserve">french bread mold toast tray (wrong)</text><text x="570" y="314" font-size="13" class="t-green" xml:space="preserve">french curves rosette applique (right)</text><text x="20" y="342" font-size="13" class="t-ink" xml:space="preserve">“bathroom vanity knobs”</text><text x="250" y="342" font-size="13" class="t-green" xml:space="preserve">damask mushroom knob (right)</text><text x="570" y="342" font-size="13" class="t-red" xml:space="preserve">30'' single bathroom vanity set (wrong)</text></g>
<text x="24" y="423" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Example queries from Qdrant, “Hybrid Search in Qdrant” (2026). Product names shortened.</text>
