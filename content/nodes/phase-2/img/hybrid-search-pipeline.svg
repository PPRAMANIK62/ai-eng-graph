<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 434" width="900" height="434" role="img" aria-labelledby="fig-1fb82fz-t fig-1fb82fz-d">
<title id="fig-1fb82fz-t">Hybrid search: two searches, one merged ranking</title>
<desc id="fig-1fb82fz-d">Diagram of hybrid search. One query goes to two searches at once: keyword search (BM25) and vector search. Each returns its own ranked list of about 100 candidates. A fusion step merges the two lists into one ranking, and the top 10 go on to the model or a reranker. Below, two real product queries: for &quot;french molding&quot;, vector search found the right product and keyword search found a french bread mold; for &quot;bathroom vanity knobs&quot;, keyword search found the right knob and vector search found a vanity set.</desc>
<style>
.fig{--bg:var(--t-surface,#fcfbf8);--ink:var(--t-ink,#1f2329);--muted:var(--t-ink-2,#4d5461);--line:var(--t-ink-3,#7d8490);--grid:var(--t-rule,#dfddd6);--blue:var(--line-1,#1f66b0);--orange:var(--line-3,#d9692a);--green:var(--line-2,#1c8f4f);--red:var(--line-0,#d22f3f);--purple:var(--line-4,#80479a);--grey:var(--t-ink-3,#7d8490);--blue-soft:var(--line-1-soft,#dde8f4);--orange-soft:var(--line-3-soft,#f8e5d8);--green-soft:var(--line-2-soft,#d9eee1);--red-soft:var(--line-0-soft,#f6dcdf);--purple-soft:var(--line-4-soft,#ebe0f0);--grey-soft:var(--t-panel,#efeee9);--ink-soft:var(--t-panel,#efeee9);--muted-soft:var(--t-panel,#efeee9)}
