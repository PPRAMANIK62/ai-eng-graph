 x1="572" y1="55" x2="602" y2="55" class="s-purple" stroke-width="1.5" marker-end="url(#ah-purple)"/><rect x="150" y="150" width="118" height="50" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="209" y="175" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">question</text><rect x="302" y="150" width="118" height="50" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="361" y="166.23" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">embed the</text><text x="361" y="183.78" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">question</text><line x1="268" y1="175" x2="298" y2="175" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><rect x="454" y="150" width="118" height="50" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="513" y="166.23" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">search</text><text x="513" y="183.78" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">the index</text><line x1="420" y1="175" x2="450" y2="175" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><rect x="606" y="150" width="118" height="50" rx="6" class="fs-blue s-blue" stroke-width="1.5"/><text x="665" y="166.23" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">top chunks</text><text x="665" y="183.78" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">into prompt</text><line x1="572" y1="175" x2="602" y2="175" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><rect x="758" y="150" width="118" height="50" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="817" y="166.23" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">model</text><text x="817" y="183.78" font-size="13.5" text-anchor="middle" font-weight="600" dominant-baseline="central" class="t-ink" xml:space="preserve">answers</text><line x1="724" y1="175" x2="754" y2="175" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><line x1="665" y1="80" x2="521" y2="146" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-grey)"/><circle cx="264" cy="28" r="11" class="fs-red s-red" stroke-width="1.5"/><text x="264" y="28.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">1</text><circle cx="568" cy="148" r="11" class="fs-red s-red" stroke-width="1.5"/><text x="568" y="148.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">2</text><circle cx="720" cy="148" r="11" class="fs-red s-red" stroke-width="1.5"/><text x="720" y="148.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">3</text><circle cx="772" cy="216" r="11" class="fs-red s-red" stroke-width="1.5"/><text x="772" y="216.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">4</text><circle cx="799" cy="216" r="11" class="fs-red s-red" stroke-width="1.5"/><text x="799" y="216.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">5</text><circle cx="826" cy="216" r="11" class="fs-red s-red" stroke-width="1.5"/><text x="826" y="216.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">6</text><circle cx="853" cy="216" r="11" class="fs-red s-red" stroke-width="1.5"/><text x="853" y="216.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">7</text><rect x="24" y="238" width="852" height="173" rx="6" class="s-grey" fill="none" stroke-width="1"/><circle cx="44" cy="256" r="9" class="fs-red s-red" stroke-width="1.5"/><text x="44" y="256.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">1</text><text x="62" y="256" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">missing content: the answer isn't in the documents</text><circle cx="44" cy="277" r="9" class="fs-red s-red" stroke-width="1.5"/><text x="44" y="277.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">2</text><text x="62" y="277" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">missed the top results: ranked too low to be returned</text><circle cx="44" cy="298" r="9" class="fs-red s-red" stroke-width="1.5"/><text x="44" y="298.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">3</text><text x="62" y="298" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">not in context: retrieved, then cut from the prompt</text><circle cx="44" cy="319" r="9" class="fs-red s-red" stroke-width="1.5"/><text x="44" y="319.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">4</text><text x="62" y="319" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">not extracted: in the prompt, but the model missed it</text><circle cx="44" cy="340" r="9" class="fs-red s-red" stroke-width="1.5"/><text x="44" y="340.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">5</text><text x="62" y="340" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">wrong format: asked for a table or list, got prose</text><circle cx="44" cy="361" r="9" class="fs-red s-red" stroke-width="1.5"/><text x="44" y="361.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">6</text><text x="62" y="361" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">wrong specificity: too vague or too detailed</text><circle cx="44" cy="382" r="9" class="fs-red s-red" stroke-width="1.5"/><text x="44" y="382.5" font-size="12.5" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">7</text><text x="62" y="382" font-size="13" dominant-baseline="central" class="t-ink" xml:space="preserve">incomplete: right, but missing part of the answer</text><text x="866" y="256" font-size="12.5" text-anchor="end" font-weight="600" dominant-baseline="central" class="t-blue" xml:space="preserve">1–3: search problems</text><text x="866" y="319" font-size="12.5" text-anchor="end" font-weight="600" dominant-baseline="central" class="t-orange" xml:space="preserve">4–7: answer problems</text></g>
<text x="24" y="478" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Failure points from Barnett et al., &quot;Seven Failure Points When Engineering a RAG System&quot; (2024). Placement on the pipeline is ours.</text>
</svg>
