<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 900 489" width="900" height="489" role="img" aria-labelledby="fig-1oo6h8g-t fig-1oo6h8g-d">
<title id="fig-1oo6h8g-t">RAG builds an index ahead of time, then looks things up per question</title>
<desc id="fig-1oo6h8g-d">A RAG pipeline in two rows. The top row runs ahead of time: documents are split into chunks, each chunk is embedded, and the embeddings go into an index. The bottom row runs on each question: the question is embedded, the index is searched, the top chunks go into the prompt, and the model writes an answer. Seven numbered markers show where things fail: missing content at the documents, the right chunk ranked too low at search, retrieved but cut from the prompt, and four failures at the answer: not extracted, wrong format, wrong specificity, incomplete.</desc>
