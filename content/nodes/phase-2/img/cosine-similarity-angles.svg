<g transform="translate(0 44)"><line x1="98" y1="210" x2="428" y2="210" class="axis" stroke-width="1.5"/><line x1="230" y1="331" x2="230" y2="12" class="axis" stroke-width="1.5"/><path d="M238.4,198.8 L249.6,207.2 L241.2,218.4" class="s-muted" stroke-width="1.2" fill="none"/><line x1="230" y1="210" x2="362" y2="34" class="s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="372" y="38" font-size="13" font-weight="600" class="t-green" xml:space="preserve">b (6, 8)</text><line x1="230" y1="210" x2="296" y2="122" class="s-blue" stroke-width="3.5" marker-end="url(#ah-blue)"/><text x="226" y="124" font-size="13" font-weight="600" class="t-blue" xml:space="preserve">a (3, 4)</text><line x1="230" y1="210" x2="318" y2="276" class="s-orange" stroke-width="2.5" marker-end="url(#ah-orange)"/><text x="328" y="290" font-size="13" font-weight="600" class="t-orange" xml:space="preserve">c (4, −3)</text><line x1="230" y1="210" x2="164" y2="298" class="s-red" stroke-width="2.5" marker-end="url(#ah-red)"/><text x="80" y="316" font-size="13" font-weight="600" class="t-red" xml:space="preserve">d (−3, −4)</text><circle cx="230" cy="210" r="3.5" class="f-ink"/><text x="470" y="30" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">Compared with a:</text><text x="470" y="70" font-size="15" font-weight="700" class="t-green" xml:space="preserve">cos = 1</text><text x="470" y="90" font-size="13" class="t-muted" xml:space="preserve">b: same direction, twice as long</text><text x="470" y="128" font-size="15" font-weight="700" class="t-orange" xml:space="preserve">cos = 0</text><text x="470" y="148" font-size="13" class="t-muted" xml:space="preserve">c: at a right angle</text><text x="470" y="186" font-size="15" font-weight="700" class="t-red" xml:space="preserve">cos = −1</text><text x="470" y="206" font-size="13" class="t-muted" xml:space="preserve">d: opposite direction</text><text x="470" y="270" font-size="13" class="t-ink" xml:space="preserve">Only the angle