<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 970 408" width="970" height="408" role="img" aria-labelledby="fig-1olf0dq-t fig-1olf0dq-d">
<title id="fig-1olf0dq-t">Grounding is checked claim by claim</title>
<desc id="fig-1olf0dq-d">One answer split into three sentences, each checked against the passages it cites. The first sentence cites passage 1, which supports it: recall 1. The second cites passages 2 and 3; passage 2 supports it and passage 3, about support hours, adds nothing, so recall is 1 but passage 3 is an irrelevant citation. The third sentence, that most stores accept returns of unopened items, has no citation and comes from the model's memory: recall 0. Citation recall is 2 of 3 sentences, citation precision is 2 of 3 citations.</desc>
<style>
