 markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-purple"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="f-grey"/></marker></defs>
<rect class="bg" x="0" y="0" width="970" height="408"/>
<text x="24" y="30" font-size="17" font-weight="700" class="t-ink display" xml:space="preserve">Grounding is checked claim by claim</text>
<g transform="translate(0 44)"><text x="24" y="12" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">The answer, one sentence per row</text><text x="300" y="12" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">Cites</text><text x="470" y="12" font-size="12.5" font-weight="600" class="t-muted" xml:space="preserve">Retrieved passages</text><text x="850" y="12" font-size="12.5" text-anchor="middle" font-weight="600" class="t-muted" xml:space="preserve">Recall</text><rect x="470" y="28" width="220" height="54" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="482" y="48" font-size="13" font-weight="700" class="t-blue" xml:space="preserve">[1]</text><text x="512" y="48" font-size="13" class="t-ink" xml:space="preserve">Refunds are available within</text><text x="512" y="66" font-size="13" class="t-ink" xml:space="preserve">30 days of purchase.</text><rect x="470" y="116" width="220" height="54" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="482" y="136" font-size="13" font-weight="700" class="t-blue" xml:space="preserve">[2]</text><text x="512" y="136" font-size="13" class="t-ink" xml:space="preserve">Opened software is not</text><text x="512" y="154" font-size="13" class="t-ink" xml:space="preserve">refundable.</text><rect x="470" y="204" width="220" height="54" rx="6" class="fs-grey s-grey" stroke-width="1.5"/><text x="482" y="224" font-size="13" font-weight="700" class="t-blue" xml:space="preserve">[3]</text><text x="512" y="224" font-size="13" class="t-ink" xml:space="preserve">Our support team is open</text><text x="512" y="242" font-size="13" class="t-ink" xml:space="preserve">Monday to Friday.</text><rect x="24" y="28" width="250" height="62" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="149" y="50.55" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">“Refunds are available within</text><text x="149" y="67.45" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">30 days of purchase.”</text><rect x="300" y="47" width="40" height="24" rx="4" class="fs-green s-green" stroke-width="1.5"/><text x="320" y="59" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">[1]</text><line x1="340" y1="59" x2="466" y2="55" class="s-green" stroke-width="1.4"/><text x="850" y="53" font-size="22" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">1</text><text x="850" y="75" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">supported</text><rect x="24" y="112" width="250" height="62" rx="6" class="fs-green s-green" stroke-width="1.5"/><text x="149" y="134.55" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">“Opened software can't</text><text x="149" y="151.45" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">be refunded.”</text><rect x="300" y="116" width="40" height="24" rx="4" class="fs-green s-green" stroke-width="1.5"/><text x="320" y="128" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">[2]</text><line x1="340" y1="128" x2="466" y2="143" class="s-green" stroke-width="1.4"/><rect x="300" y="146" width="40" height="24" rx="4" class="fs-orange s-orange" stroke-width="1.5"/><text x="320" y="158" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-orange" xml:space="preserve">[3]</text><line x1="340" y1="158" x2="466" y2="231" class="s-orange" stroke-width="1.4" stroke-dasharray="5 4"/><text x="850" y="137" font-size="22" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-green" xml:space="preserve">1</text><text x="850" y="159" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">supported, but [3] adds nothing</text><rect x="24" y="196" width="250" height="62" rx="6" class="fs-red s-red" stroke-width="1.5"/><text x="149" y="218.55" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">“Most stores accept returns</text><text x="149" y="235.45" font-size="13" text-anchor="middle" dominant-baseline="central" class="t-ink" xml:space="preserve">of unopened items.”</text><text x="300" y="227" font-size="13" font-weight="600" dominant-baseline="central" class="t-red" xml:space="preserve">none</text><text x="850" y="221" font-size="22" text-anchor="middle" font-weight="700" dominant-baseline="central" class="t-red" xml:space="preserve">0</text><text x="850" y="243" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">no citation: from memory</text><line x1="24" y1="278" x2="940" y2="278" class="grid" stroke-width="1"/><text x="24" y="298" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">Citation recall = sentences fully supported ÷ sentences = 2 ÷ 3</text><text x="24" y="322" font-size="14" font-weight="600" class="t-ink" xml:space="preserve">Citation precision = citations that are needed ÷ citations = 2 ÷ 3  (the [3] on row 2 is irrelevant)</text></g>
<text x="24" y="397" font-size="11.5" font-style="italic" class="t-muted" xml:space="preserve">Illustrative example. Metrics as defined in Gao et al., “Enabling LLMs to Generate Text with Citations” (ALCE, 2023).</text>
</svg>
