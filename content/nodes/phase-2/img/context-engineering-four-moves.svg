<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 820 535" width="820" height="535" role="img" aria-labelledby="fig-1m7pt8m-t fig-1m7pt8m-d">
<title id="fig-1m7pt8m-t">Four moves decide what's in the window on each call</title>
<desc id="fig-1m7pt8m-d">A context window in the middle, with four moves around it. Write: save notes, plans and memories outside the window. Select: pull in only the documents, tools and memories this step needs. Compress: summarize or trim old turns and tool results. Isolate: hand a subtask to a sub-agent with its own window, and take back only a short summary.</desc>
