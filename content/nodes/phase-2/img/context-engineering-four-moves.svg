ze="13" class="t-ink" xml:space="preserve">pull in only the docs, tools and</text><text x="510" y="71" font-size="13" class="t-ink" xml:space="preserve">memories this step needs (RAG)</text><line x1="620" y1="86" x2="500" y2="146" class="s-blue" stroke-width="1.5" marker-end="url(#ah-blue)"/><rect x="24" y="360" width="300" height="68" rx="6" class="fs-orange s-orange" stroke-width="1.5"/><text x="38" y="380" font-size="15" font-weight="700" class="t-orange display" xml:space="preserve">Compress</text><text x="38" y="402" font-size="13" class="t-ink" xml:space="preserve">summarize old turns (compaction),</text><text x="38" y="421" font-size="13" class="t-ink" xml:space="preserve">clear used tool results, trim</text><line x1="320" y1="302" x2="200" y2="356" class="s-orange" stroke-width="1.5" marker-end="url(#ah-orange)"/><rect x="496" y="360" width="300" height="87" rx="6" class="fs-purple s-purple" stroke-width="1.5"/><text x="510" y="380" font-size="15" font-weight="700" class="t-purple display" xml:space="preserve">Isolate</text><text x="510" y="402" font-size="13" class="t-ink" xml:space="preserve">give a subtask to a sub-agent with</text><text x="510" y="421" font-size="13" class="t-ink" xml:space="preserve">its own window; take back a summary</text><text x="510" y="440" font-size="13" class="t-ink" xml:space="preserve">of often 1,000–2,000 tokens</text><line x1="500" y1="302" x2="620" y2="356" class="s-purple" stroke-width="1.5" marker-end="url(#ah-purple)"/><line x1="604" y1="356" x2="480" y2="304" class="s-purple" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-purple)"/></g>
